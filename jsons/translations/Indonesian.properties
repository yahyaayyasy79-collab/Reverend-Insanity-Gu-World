Gu World: Power Scaling = Dunia Gu: Skala Kekuatan
The five layers of power = Lima lapis kekuatan
A cultivator's body alone is weak: most of its power comes from its Gu, its dao marks and its comprehension of its path. One who fights without Gu still fights, on dao marks and comprehension alone. = Tubuh seorang kultivator saja lemah: sebagian besar kekuatannya datang dari Gu, jejak dao, dan pemahamannya atas jalurnya. Yang bertarung tanpa Gu tetap bisa bertarung, hanya dengan jejak dao dan pemahaman.
1. Rank. The body's strength: Rank One 6, Rank Two 10, Rank Three 14, Rank Four 21, Rank Five 29, Rank Six 36, Rank Seven 51, Rank Eight 69, the Venerable 168. Clan Masters of a rank have the same strength. Mortal and immortal are two worlds: an immortal fights mortal units 50% harder, the Venerable 100% harder. = 1. Tingkat. Kekuatan tubuh: Tingkat Satu 6, Tingkat Dua 10, Tingkat Tiga 14, Tingkat Empat 21, Tingkat Lima 29, Tingkat Enam 36, Tingkat Tujuh 51, Tingkat Delapan 69, Yang Mulia 168. Gu Master klan pada tingkat yang sama punya kekuatan yang sama. Fana dan abadi adalah dua dunia: seorang abadi melawan unit fana 50% lebih kuat, Yang Mulia 100% lebih kuat.
2. Path attainment (comprehension). Four tiers stack: Master +20% at any rank, Grandmaster +25% from rank three, Great Grandmaster +30% from rank six, Supreme Grandmaster +35% from rank eight: +110% at the top. Each tier opens a new kind of power: the Master the path's hit on every attack it makes, the Grandmaster a second effect and the mortal killer move, the Great Grandmaster a domain or a new art and the immortal killer move, the Supreme Grandmaster the path's peak. = 2. Pencapaian jalur (pemahaman). Empat tingkat bertumpuk: Ahli +20% di tingkat mana pun, Mahaguru +25% sejak tingkat tiga, Mahaguru Agung +30% sejak tingkat enam, Mahaguru Tertinggi +35% sejak tingkat delapan: +110% di puncak. Tiap tingkat membuka jenis kekuatan baru: Ahli membuka serangan khas jalur pada setiap serangan, Mahaguru efek kedua dan jurus pamungkas fana, Mahaguru Agung sebuah domain atau seni baru dan jurus pamungkas abadi, Mahaguru Tertinggi puncak jalur itu.
3. Dao marks, the quantity of dao. Tiers I to V give +10%, +20%, +30%, +40% and +10 HP healing, +55% and +15 HP healing. Every tier also raises the path's hit: extra damage 4/5/6/8/10/12, status turns 2/2/2/3/3/4, healing 5/6/8/10/12/15, XP 2/3/4/5/6/8, stolen stones 10/15/20/25/30/40%, movement 1/1/1/1/2/2 (no marks, then I to V; a path may multiply them). The Master's promotion lists what each tier adds. = 3. Jejak dao, kuantitas dao. Tingkat I sampai V memberi +10%, +20%, +30%, +40% dan +10 HP pemulihan, +55% dan +15 HP pemulihan. Tiap tingkat juga menaikkan serangan khas jalur: kerusakan tambahan 4/5/6/8/10/12, lama status 2/2/2/3/3/4 giliran, pemulihan 5/6/8/10/12/15, XP 2/3/4/5/6/8, batu curian 10/15/20/25/30/40%, gerak 1/1/1/1/2/2 (tanpa jejak, lalu I sampai V; sebagian jalur mengalikannya). Promosi Ahli menuliskan tambahan tiap tingkat.
Dao marks grow one tier every 20 turns on Standard for a path Master of rank three or more; an immortal also gains one for every immortal it kills and every heavenly tribulation it survives. Mortals stop at tier II. Rank seven needs tier II, rank eight tier III, the Venerable tier IV. = Jejak dao naik satu tingkat tiap 20 giliran pada kecepatan Standar bagi Ahli jalur tingkat tiga ke atas; seorang abadi juga mendapat satu dari setiap abadi yang dibunuhnya dan setiap kesengsaraan langit yang dilaluinya. Manusia fana berhenti di tingkat II. Tingkat tujuh butuh tingkat II, tingkat delapan III, Yang Mulia IV.
4. Gu. Each path's Gu comes with its Master. A Master refines more with XP: 123 catalog Gu of ranks 1 to 9, each waiting for a unit of its rank; a Gu's effect grows with its rank (a rank-one attack Gu +12%, a rank-nine one +44%). Immortal Gu sleep while the clan has no immortal essence of their rank. Every immortal Gu wonder of your own path that your clan owns adds 5% strength; one of a strongly clashing path takes 5% away. Spoils: a Gu Master that defeats a unit takes each of its catalog Gu of rank 1 to 5 with a 25% chance, when its own rank can hold it. = 4. Gu. Gu tiap jalur datang bersama Ahlinya. Seorang Ahli memurnikan lebih banyak dengan XP: 123 Gu katalog tingkat 1 sampai 9, masing-masing menunggu unit setingkatnya; efek Gu tumbuh dengan tingkatnya (Gu serang tingkat satu +12%, tingkat sembilan +44%). Gu abadi tertidur bila klan tak punya esensi abadi setingkatnya. Setiap keajaiban Gu abadi dari jalurmu sendiri yang dimiliki klanmu menambah 5% kekuatan; dari jalur yang sangat bertentangan mengurangi 5%. Rampasan: Gu Master yang mengalahkan sebuah unit merampas tiap Gu katalog tingkat 1 sampai 5 miliknya dengan peluang 25%, bila tingkatnya sendiri sanggup memegangnya.
5. Conflicts. A second path whose dao marks clash with the first costs 5% to 25% strength. = 5. Pertentangan. Jalur kedua yang jejak daonya berbenturan dengan jalur pertama memotong 5% sampai 25% kekuatan.
Killer moves = Jurus pamungkas
A unit-action button: for one turn the path family's burst plus the path's hit at full power (twice that for the immortal move). The mortal move costs 15 stones; the immortal move costs the immortal's own essence: 5 green grape at rank six, 4 red date at seven, 3 white lychee at eight, 2 yellow apricot as a Venerable. AI clans use these moves by themselves whenever they attack and can pay; they keep 100 stones and 10 essence in reserve, and a Venerable keeps its yellow apricot for Eternal Life. = Tombol aksi unit: selama satu giliran ledakan keluarga jalur ditambah serangan khas jalur pada kekuatan penuh (dua kali lipat untuk jurus abadi). Jurus fana 15 batu; jurus abadi memakai esensi abadi itu sendiri: 5 anggur hijau di tingkat enam, 4 kurma merah di tujuh, 3 leci putih di delapan, 2 aprikot kuning untuk Yang Mulia. Klan AI memakai jurus ini sendiri setiap kali menyerang dan sanggup membayar; mereka menyisakan 100 batu dan 10 esensi, dan Yang Mulia menyimpan aprikot kuningnya untuk Hidup Abadi.
Example = Contoh
A Rank Six fire-path Great Grandmaster with Dao Marks III: strength 36, +75% from attainment and +30% from dao marks. Each attack inflicts Burning for 3 turns; each attack deals 6 extra damage; domain: enemies beside it fight 10% weaker. = Gu Abadi tingkat enam jalur api, Mahaguru Agung, dengan Jejak Dao III: kekuatan 36, +75% dari pencapaian dan +30% dari jejak dao. Tiap serangan menimbulkan Terbakar selama 3 giliran; tiap serangan memberi 6 kerusakan tambahan; domain: musuh di sampingnya bertarung 10% lebih lemah.
Gu World: Small Stages = Dunia Gu: Tahap Kecil
Every rank has four small stages: initial, middle, upper and peak. A Gu Master climbs them by cultivating; each stage above initial adds 5% Strength. = Setiap rank punya empat tahap kecil: awal, menengah, atas dan puncak. Gu Master menaikinya dengan berkultivasi; tiap tahap di atas awal menambah Kekuatan 5%.
One stage every 8 turns with grade A aptitude, 10 with B, 12 with C, 16 with D and 5 with an extreme physique (Standard speed; the other speeds scale). An immortal takes 2 times as long. = Satu tahap tiap 8 giliran dengan bakat A, 10 dengan B, 12 dengan C, 16 dengan D dan 5 dengan fisik ekstrem (kecepatan Standar; kecepatan lain menyesuaikan). Gu Abadi butuh 2 kali lebih lama.
A new rank starts again at initial. The breakthrough costs 30% fewer stones from the peak and 50% more before it. = Rank baru dimulai lagi dari tahap awal. Terobosan 30% lebih murah dari puncak dan 50% lebih mahal sebelum puncak.
Relic Gu, one colour for each mortal rank, bought with XP and primeval stones (green copper 25, red iron 40, white silver 60, yellow gold 90, purple crystal 130): it lifts the unit one stage at once and is spent. = Gu relik, satu warna untuk tiap rank fana, dibeli dengan XP dan batu primordial (tembaga hijau 25, besi merah 40, perak putih 60, emas kuning 90, kristal ungu 130): mengangkat unit satu tahap seketika lalu habis.
An extreme physique: 1 awakening in a hundred. +20% Strength, +50% XP from combat, 20% less upkeep. After 60 turns (Standard speed) the aperture bursts and the unit dies, unless it has ascended to rank six. = Fisik ekstrem: 1 dari seratus kebangkitan. Kekuatan +20%, XP pertempuran +50%, pemeliharaan 20% lebih murah. Setelah 60 giliran (kecepatan Standar) aperturnya meledak dan unit mati, kecuali ia sudah naik ke rank enam.
Gu World: Immortal Lifespan = Dunia Gu: Umur Abadi
How long an immortal lives = Berapa lama seorang abadi hidup
A clan's Lifespan Gu are its immortals' lifespan. Reaching each rank adds to the stock and a higher rank burns it more slowly, so every rank climbed makes an immortal live longer. Numbers on Standard speed; the other speeds scale the turns. = Gu Umur milik klan adalah umur para abadinya. Setiap rank yang dicapai menambah stok itu, dan rank yang lebih tinggi membakarnya lebih lambat, jadi setiap kenaikan rank memperpanjang hidup seorang abadi. Angka pada kecepatan Standar; kecepatan lain menyesuaikan jumlah giliran.
Rank six: +20 Lifespan Gu on ascending; burns one every 10 turns, so its own gift lasts about 200 turns. = Tingkat enam: +20 Gu Umur saat naik menjadi abadi; membakar satu tiap 10 giliran, jadi pemberiannya sendiri bertahan sekitar 200 giliran.
Rank seven: +25 Lifespan Gu on advancing; burns one every 15 turns, so its own gift lasts about 375 turns. = Tingkat tujuh: +25 Gu Umur saat naik rank; membakar satu tiap 15 giliran, jadi pemberiannya sendiri bertahan sekitar 375 giliran.
Rank eight: +35 Lifespan Gu on advancing; burns one every 20 turns, so its own gift lasts about 700 turns. = Tingkat delapan: +35 Gu Umur saat naik rank; membakar satu tiap 20 giliran, jadi pemberiannya sendiri bertahan sekitar 700 giliran.
The Venerable: +60 Lifespan Gu on becoming a Venerable; burns one every 30 turns, so its own gift lasts about 1800 turns. = Yang Mulia: +60 Gu Umur saat menjadi Yang Mulia; membakar satu tiap 30 giliran, jadi pemberiannya sendiri bertahan sekitar 1800 giliran.
All the clan's immortals share one stock, each burning at its own rank's rate. With none left an immortal wastes away (7 damage a turn) and heals only by pillaging; one Lifespan Gu ends that at once. = Semua abadi klan berbagi satu stok, masing-masing membakar menurut rank-nya. Bila habis, seorang abadi merana (7 kerusakan per giliran) dan hanya pulih dengan menjarah; satu Gu Umur langsung menghentikannya.
How to add lifespan = Cara menambah umur
1. Climb. Every rank reached adds Lifespan Gu (above): the surest way. = 1. Naik rank. Setiap rank yang dicapai menambah Gu Umur (di atas): cara paling pasti.
2. Green land. From Calamity Lore, every 8 owned forest, jungle or marsh tiles of each kind give one with a 15% chance each turn: keep your woods and swamps, settle near them. = 2. Tanah hijau. Sejak Ilmu Bencana, setiap 8 petak hutan, rimba, atau rawa milikmu (per jenis) memberi satu dengan peluang 15% tiap giliran: jaga hutan dan rawamu, bangun desa di dekatnya.
3. Immortal Gu and inheritances: Year Gu gives 1 every 3 turns; Years Flow Like Water gives 2 every 5 turns for 10 green grape essence while the clan holds more than 9; Red Lotus Inheritance gives 1 every 5 turns. = 3. Gu abadi dan warisan: Gu Tahun memberi 1 tiap 3 giliran; Tahun Mengalir Seperti Air memberi 2 tiap 5 giliran dengan 10 esensi anggur hijau selama klan memegang lebih dari 9; Warisan Teratai Merah memberi 1 tiap 5 giliran.
4. The market. Treasure Yellow Heaven sells 3 Lifespan Gu for 120 stones. = 4. Pasar. Treasure Yellow Heaven menjual 3 Gu Umur seharga 120 batu.
5. Conquest. A captured city keeps its immortal Gu and inheritances, so the ones above can be seized. = 5. Penaklukan. Kota yang direbut tetap memegang Gu abadi dan warisannya, jadi yang di atas bisa direbut.
What takes lifespan = Apa yang menghabiskan umur
Wisdom Gu: takes 1 every 5 turns. = Gu Kebijaksanaan: mengambil 1 tiap 5 giliran.
While a Venerable lives, every clan loses one each 10 turns. = Selama seorang Yang Mulia hidup, setiap klan kehilangan satu tiap 10 giliran.
The Zombie Alliance's immortals never age (it gains one per immortal each 10 turns) but make no essence. = Para abadi Aliansi Mayat Hidup tak pernah menua (mendapat satu per abadi tiap 10 giliran) tetapi tak menghasilkan esensi.
Immortals against mortal clans = Abadi melawan klan fana
An immortal outclasses any mortal army: strength 36, 51 and 69 at ranks six to eight against 29 at rank five, before its path, and it crosses the region walls. That is the reward for a long, hard climb: ascension needs a rank-five Master, the three qi and luck, and every rank above needs a survived tribulation, dao marks and essence. = Seorang abadi jauh melampaui pasukan fana mana pun: kekuatan 36, 51, dan 69 pada rank enam sampai delapan melawan 29 pada rank lima, belum termasuk jalurnya, dan ia menembus tembok wilayah. Itulah imbalan pendakian yang panjang dan berat: kenaikan abadi butuh Ahli rank lima, tiga qi, dan keberuntungan, dan setiap rank di atasnya butuh selamat dari kesengsaraan, jejak dao, dan esensi.
Gu World: Gu Hunger and Food = Dunia Gu: Lapar dan Makanan Gu
Every Gu eats = Setiap Gu makan
A Gu that eats a Gu food (moon orchid, wild boar, jade or wine) takes it from the clan's stock every turn. When the clan is short, every Gu eating that food is weakened at once and its hunger meter rises each turn: a status on the unit shows the percent. At 100% the Gu rolls its chance to die, then the meter starts again. Feed the clan and the meter clears. = Gu yang memakan makanan Gu (anggrek bulan, babi hutan, giok, atau arak) mengambilnya dari stok klan setiap giliran. Bila klan kekurangan, setiap Gu pemakan makanan itu langsung melemah dan meteran laparnya naik tiap giliran: sebuah status di unit menunjukkan persennya. Pada 100% Gu itu melempar peluang matinya, lalu meteran mulai lagi. Beri makan klan dan meteran itu hilang.
A path's own Gu is its Master's vital Gu: if it starves to death, the Master takes 30 damage (none at 30 HP or less). Its Master brings it back once the food is in surplus again. = Gu milik sebuah jalur adalah Gu vital Ahlinya: bila ia mati kelaparan, sang Ahli menerima 30 kerusakan (tidak ada bila HP-nya 30 atau kurang). Ahlinya mendapatkannya kembali begitu makanannya surplus lagi.
Hunger rate by rank: rank 1 +33% a turn (50% death chance at 100%), rank 2 +20% a turn (50% death chance at 100%), rank 3 +14% a turn (50% death chance at 100%), rank 4 +11% a turn (50% death chance at 100%). The lower the rank, the faster the hunger. = Laju lapar per rank: rank 1 +33% per giliran (peluang mati 50% pada 100%), rank 2 +20% per giliran (peluang mati 50% pada 100%), rank 3 +14% per giliran (peluang mati 50% pada 100%), rank 4 +11% per giliran (peluang mati 50% pada 100%). Makin rendah rank-nya, makin cepat laparnya.
Where the food comes from: moon orchid and wild boar from their improved tiles and the Gu Feeding House, jade from mined jade, wine only from the Tavern. = Asal makanan: anggrek bulan dan babi hutan dari petaknya yang dikelola dan Rumah Pakan Gu, giok dari tambang giok, arak hanya dari Kedai Arak.
Other Gu eat primeval stones: each raises its unit's upkeep, usually by 10%. When the clan's stones fall below zero, every unit fights 20% weaker. = Gu lain memakan batu primordial: masing-masing menaikkan pemeliharaan unitnya, biasanya 10%. Bila batu klan di bawah nol, setiap unit bertarung 20% lebih lemah.
