Formation Great Grandmaster = Mahaguru Agung Jalur Formasi
Formation path, Great Grandmaster attainment (大宗师): where most rank-eight immortals end; a rank-six immortal that reaches it opens the immortal killer move Grand Formation (5 green grape essence). = Jalur Formasi, pencapaian Mahaguru Agung (大宗师): tempat kebanyakan abadi tingkat delapan berhenti; abadi tingkat enam yang mencapainya membuka jurus pamungkas abadi Formasi Agung (5 esensi anggur hijau).
Linked Formation = Formasi Bertaut
Linked Formation: a formation-path killer move for one turn: heal 40 HP, +15% Strength. = Formasi Bertaut: jurus pamungkas jalur Formasi selama satu giliran: pulih 40 HP, +15% Kekuatan.
Grand Formation = Formasi Agung
Grand Formation: a formation-path immortal killer move for one turn: heal 80 HP, +30% Strength. = Formasi Agung: jurus pamungkas abadi jalur Formasi selama satu giliran: pulih 80 HP, +30% Kekuatan.
Food Master = Ahli Jalur Makanan
Food path (食道), Master attainment (大师): the food path feeds Gu cheaply. = Jalur Makanan (食道), pencapaian Ahli (大师): jalur makanan memberi makan Gu dengan murah.
Food Grandmaster = Mahaguru Jalur Makanan
Food path, Grandmaster attainment (宗师): deep enough to bend other paths' methods to its own Gu. Opens the killer move Eat Bitterness. = Jalur Makanan, pencapaian Mahaguru (宗师): cukup dalam untuk meminjam cara jalur lain dengan Gu sendiri. Membuka jurus pamungkas Menelan Kepahitan.
Food Great Grandmaster = Mahaguru Agung Jalur Makanan
Food path, Great Grandmaster attainment (大宗师): where most rank-eight immortals end; a rank-six immortal that reaches it opens the immortal killer move Banquet of Immortals (5 green grape essence). = Jalur Makanan, pencapaian Mahaguru Agung (大宗师): tempat kebanyakan abadi tingkat delapan berhenti; abadi tingkat enam yang mencapainya membuka jurus pamungkas abadi Perjamuan Para Dewa (5 esensi anggur hijau).
Eat Bitterness = Menelan Kepahitan
Eat Bitterness (吃苦): a food-path killer move for one turn: heal 40 HP, +15% Strength. = Menelan Kepahitan (吃苦): jurus pamungkas jalur Makanan selama satu giliran: pulih 40 HP, +15% Kekuatan.
Banquet of Immortals = Perjamuan Para Dewa
Banquet of Immortals: a food-path immortal killer move for one turn: heal 80 HP, +30% Strength. = Perjamuan Para Dewa: jurus pamungkas abadi jalur Makanan selama satu giliran: pulih 80 HP, +30% Kekuatan.
Pill Master = Ahli Jalur Pil
Pill path (丹道), Master attainment (大师): pills heal on the march. = Jalur Pil (丹道), pencapaian Ahli (大师): pil menyembuhkan sambil berbaris.
Pill Grandmaster = Mahaguru Jalur Pil
Pill path, Grandmaster attainment (宗师): deep enough to bend other paths' methods to its own Gu. Opens the killer move Recovery Pill. = Jalur Pil, pencapaian Mahaguru (宗师): cukup dalam untuk meminjam cara jalur lain dengan Gu sendiri. Membuka jurus pamungkas Pil Pemulihan.
Pill Great Grandmaster = Mahaguru Agung Jalur Pil
Pill path, Great Grandmaster attainment (大宗师): where most rank-eight immortals end; a rank-six immortal that reaches it opens the immortal killer move Life-Saving Pill (5 green grape essence). = Jalur Pil, pencapaian Mahaguru Agung (大宗师): tempat kebanyakan abadi tingkat delapan berhenti; abadi tingkat enam yang mencapainya membuka jurus pamungkas abadi Pil Penyelamat Nyawa (5 esensi anggur hijau).
Recovery Pill = Pil Pemulihan
Recovery Pill: a pill-path killer move for one turn: heal 40 HP, +15% Strength. = Pil Pemulihan: jurus pamungkas jalur Pil selama satu giliran: pulih 40 HP, +15% Kekuatan.
Life-Saving Pill = Pil Penyelamat Nyawa
Life-Saving Pill: a pill-path immortal killer move for one turn: heal 80 HP, +30% Strength. = Pil Penyelamat Nyawa: jurus pamungkas abadi jalur Pil selama satu giliran: pulih 80 HP, +30% Kekuatan.
Information Master = Ahli Jalur Informasi
Information path (信道), Master attainment (大师): messages and records reach past the hills. = Jalur Informasi (信道), pencapaian Ahli (大师): pesan dan catatan menjangkau melewati bukit.
Information Grandmaster = Mahaguru Jalur Informasi
Information path, Grandmaster attainment (宗师): deep enough to bend other paths' methods to its own Gu. Opens the killer move Mountain Pledge. = Jalur Informasi, pencapaian Mahaguru (宗师): cukup dalam untuk meminjam cara jalur lain dengan Gu sendiri. Membuka jurus pamungkas Sumpah Gunung.
Information Great Grandmaster = Mahaguru Agung Jalur Informasi
Information path, Great Grandmaster attainment (大宗师): where most rank-eight immortals end; a rank-six immortal that reaches it opens the immortal killer move Sea Oath (5 green grape essence). = Jalur Informasi, pencapaian Mahaguru Agung (大宗师): tempat kebanyakan abadi tingkat delapan berhenti; abadi tingkat enam yang mencapainya membuka jurus pamungkas abadi Ikrar Laut (5 esensi anggur hijau).
Mountain Pledge = Sumpah Gunung
Mountain Pledge (山盟): a information-path killer move for one turn: heal 40 HP, +15% Strength. = Sumpah Gunung (山盟): jurus pamungkas jalur Informasi selama satu giliran: pulih 40 HP, +15% Kekuatan.
Sea Oath = Ikrar Laut
Sea Oath (海誓): a information-path immortal killer move for one turn: heal 80 HP, +30% Strength. = Ikrar Laut (海誓): jurus pamungkas abadi jalur Informasi selama satu giliran: pulih 80 HP, +30% Kekuatan.
Human Master = Ahli Jalur Manusia
Human path (人道), Master attainment (大师): human-path marks clash with nothing, so it helps any ally. = Jalur Manusia (人道), pencapaian Ahli (大师): jejak jalur manusia tak berbenturan dengan apa pun, jadi menolong sekutu mana pun.
Human Grandmaster = Mahaguru Jalur Manusia
Human path, Grandmaster attainment (宗师): deep enough to bend other paths' methods to its own Gu. Opens the killer move Hopes of the Crowd. = Jalur Manusia, pencapaian Mahaguru (宗师): cukup dalam untuk meminjam cara jalur lain dengan Gu sendiri. Membuka jurus pamungkas Harapan Orang Banyak.
Human Great Grandmaster = Mahaguru Agung Jalur Manusia
Human path, Great Grandmaster attainment (大宗师): where most rank-eight immortals end; a rank-six immortal that reaches it opens the immortal killer move Heroes Among People (5 green grape essence). = Jalur Manusia, pencapaian Mahaguru Agung (大宗师): tempat kebanyakan abadi tingkat delapan berhenti; abadi tingkat enam yang mencapainya membuka jurus pamungkas abadi Pahlawan di Antara Manusia (5 esensi anggur hijau).
Hopes of the Crowd = Harapan Orang Banyak
Hopes of the Crowd (众望所归): a human-path killer move for one turn: heal 40 HP, +15% Strength. = Harapan Orang Banyak (众望所归): jurus pamungkas jalur Manusia selama satu giliran: pulih 40 HP, +15% Kekuatan.
Heroes Among People = Pahlawan di Antara Manusia
Heroes Among People (人中豪杰): a human-path immortal killer move for one turn: heal 80 HP, +30% Strength. = Pahlawan di Antara Manusia (人中豪杰): jurus pamungkas abadi jalur Manusia selama satu giliran: pulih 80 HP, +30% Kekuatan.
Painting Master = Ahli Jalur Lukisan
Painting path (画道), Master attainment (大师): paintings guard the home that hangs them. = Jalur Lukisan (画道), pencapaian Ahli (大师): lukisan menjaga rumah yang memajangnya.
Painting Grandmaster = Mahaguru Jalur Lukisan
Painting path, Grandmaster attainment (宗师): deep enough to bend other paths' methods to its own Gu. Opens the killer move Living Ink. = Jalur Lukisan, pencapaian Mahaguru (宗师): cukup dalam untuk meminjam cara jalur lain dengan Gu sendiri. Membuka jurus pamungkas Tinta Hidup.
Painting Great Grandmaster = Mahaguru Agung Jalur Lukisan
Painting path, Great Grandmaster attainment (大宗师): where most rank-eight immortals end; a rank-six immortal that reaches it opens the immortal killer move Contented Lifestyle (5 green grape essence). = Jalur Lukisan, pencapaian Mahaguru Agung (大宗师): tempat kebanyakan abadi tingkat delapan berhenti; abadi tingkat enam yang mencapainya membuka jurus pamungkas abadi Hidup Tenteram (5 esensi anggur hijau).
Living Ink = Tinta Hidup
Living Ink: a painting-path killer move for one turn: heal 40 HP, +15% Strength. = Tinta Hidup: jurus pamungkas jalur Lukisan selama satu giliran: pulih 40 HP, +15% Kekuatan.
Contented Lifestyle = Hidup Tenteram
Contented Lifestyle (安居乐业): a painting-path immortal killer move for one turn: heal 80 HP, +30% Strength. = Hidup Tenteram (安居乐业): jurus pamungkas abadi jalur Lukisan selama satu giliran: pulih 80 HP, +30% Kekuatan.
Theft Master = Ahli Jalur Pencurian
Theft path (偷道), Master attainment (大师): gain without paying the cost. = Jalur Pencurian (偷道), pencapaian Ahli (大师): untung tanpa membayar harga.
Theft Grandmaster = Mahaguru Jalur Pencurian
Theft path, Grandmaster attainment (宗师): deep enough to bend other paths' methods to its own Gu. Opens the killer move Light Fingers. = Jalur Pencurian, pencapaian Mahaguru (宗师): cukup dalam untuk meminjam cara jalur lain dengan Gu sendiri. Membuka jurus pamungkas Jari Ringan.
Theft Great Grandmaster = Mahaguru Agung Jalur Pencurian
Theft path, Great Grandmaster attainment (大宗师): where most rank-eight immortals end; a rank-six immortal that reaches it opens the immortal killer move Great Thief Ghost Hand (5 green grape essence). = Jalur Pencurian, pencapaian Mahaguru Agung (大宗师): tempat kebanyakan abadi tingkat delapan berhenti; abadi tingkat enam yang mencapainya membuka jurus pamungkas abadi Tangan Hantu Pencuri Agung (5 esensi anggur hijau).
Light Fingers = Jari Ringan
Light Fingers: a theft-path killer move for one turn: heal 40 HP, +15% Strength. = Jari Ringan: jurus pamungkas jalur Pencurian selama satu giliran: pulih 40 HP, +15% Kekuatan.
Great Thief Ghost Hand = Tangan Hantu Pencuri Agung
Great Thief Ghost Hand (大盗鬼手): a theft-path immortal killer move for one turn: heal 80 HP, +30% Strength. = Tangan Hantu Pencuri Agung (大盗鬼手): jurus pamungkas abadi jalur Pencurian selama satu giliran: pulih 80 HP, +30% Kekuatan.
Poisoned = Teracuni
Venom works through the body: damage at every turn start until it fades. = Bisa menjalari tubuh: kerusakan di setiap awal giliran sampai hilang.
Charmed = Terpesona
Charm saps the will: weaker attacks while it lasts. = Pesona melemahkan niat: serangan lebih lemah selama berlangsung.
Sealed = Tersegel
A restriction seal cuts the unit off from healing; only pillage restores it. = Segel larangan memutus unit dari penyembuhan; hanya menjarah yang memulihkannya.
Phantom Veil = Selubung Hampa
After a heavy blow the body turns insubstantial for a moment: much harder to hit. = Setelah pukulan berat tubuh menjadi tak berwujud sejenak: jauh lebih sulit dilukai.
Shaken = Gentar
A mind-path move has shaken the unit's resolve: weaker in battle. = Jurus jalur pikiran mengguncang tekad unit: lebih lemah dalam pertempuran.
Roaming Zombie Gu = Gu Zombi Pengembara
Roaming Zombie Gu (游僵蛊) turns its user into a walking corpse that feels no pain and shrugs off blows, weaker by daylight. Used too long, the change stays. = Gu Zombi Pengembara (游僵蛊) mengubah penggunanya menjadi mayat berjalan yang tak merasakan sakit dan tahan pukulan, lebih lemah di siang hari. Dipakai terlalu lama, perubahan itu menetap.
Bone Spear Gu = Gu Tombak Tulang
Bone Spear Gu (骨枪蛊) fires a small spinning spike of bone, the bone path's answer to the moon blade. In canon it drinks milk; here it eats pork. = Gu Tombak Tulang (骨枪蛊) menembakkan duri tulang kecil yang berputar, jawaban jalur tulang atas bilah bulan. Dalam kanon ia minum susu; di sini ia makan daging babi.
Blood Skull Gu = Gu Tengkorak Darah
Blood Skull Gu (血颅蛊) drinks the blood of the slain and turns it into essence that raises its user's aptitude, one of the Blood Sea Ancestor's true inheritances. = Gu Tengkorak Darah (血颅蛊) meminum darah yang terbunuh dan mengubahnya menjadi esensi yang menaikkan bakat penggunanya, salah satu warisan sejati Leluhur Lautan Darah.
Sword Shadow Gu = Gu Bayangan Pedang
Sword Shadow Gu (剑影蛊) sends out the shadow of a sword, counted among the strongest rank-three attack Gu. = Gu Bayangan Pedang (剑影蛊) melepaskan bayangan sebilah pedang, terhitung di antara Gu serangan tingkat tiga yang terkuat.
Sole Blade Gu = Gu Bilah Tunggal
Sole Blade Gu (单刀蛊) lives on a blade as a gleam of edge-light and can cut through a defence of its own rank, then needs long rest. It wears its blade away; here it eats jade. = Gu Bilah Tunggal (单刀蛊) hidup di sebilah golok sebagai kilau mata pisau dan mampu menembus pertahanan setingkatnya, lalu perlu istirahat panjang. Ia mengikis bilahnya; di sini ia makan giok.
Bronze Skin Gu = Gu Kulit Perunggu
Bronze Skin Gu (铜皮蛊) coats the body in a bronze glow that turns blows aside, a close fighter's defence from the skin series. = Gu Kulit Perunggu (铜皮蛊) melapisi tubuh dengan cahaya perunggu yang menangkis pukulan, pertahanan petarung jarak dekat dari seri kulit.
Armoury Gu = Gu Gudang Senjata
Armoury Gu shapes its user's essence into whatever weapon the fight needs. The weapon path is young and canon names no mortal Gu for it; this one is the mod's invention. = Gu Gudang Senjata membentuk esensi penggunanya menjadi senjata apa pun yang dibutuhkan pertarungan. Jalur senjata masih muda dan kanon tak menyebut Gu fana untuknya; yang ini rekaan mod.
Killing Intent Gu = Gu Niat Membunuh
Killing Intent Gu sharpens at the scent of a wounded enemy. The killing path is still forming in canon and has no mortal Gu; this one is the mod's invention. = Gu Niat Membunuh makin tajam saat mencium musuh yang terluka. Jalur pembunuhan masih terbentuk dalam kanon dan tak punya Gu fana; yang ini rekaan mod.
Fiery Claw Gu = Gu Cakar Api
Fiery Claw Gu (火爪蛊) hurls a great three-fingered claw of flame; several claws can merge into a bigger blaze. = Gu Cakar Api (火爪蛊) melontarkan cakar api besar berjari tiga; beberapa cakar dapat menyatu menjadi kobaran yang lebih besar.
Water Shield Gu = Gu Perisai Air
Water Shield Gu (水罩蛊) wraps its user in a sphere of moving water that turns blows aside; it fails only when pinned against a wall. = Gu Perisai Air (水罩蛊) membungkus penggunanya dalam bola air yang bergerak dan membelokkan pukulan; ia gagal hanya bila terdesak ke dinding.
Heavenly Essence Treasure Lotus = Teratai Pusaka Esensi Langit
Heavenly Essence Treasure Lotus (天元宝莲) is a flower Gu that works like a pocket spirit spring, yielding primeval stones day after day; it pays for its keeper. = Teratai Pusaka Esensi Langit (天元宝莲) adalah Gu bunga yang bekerja seperti mata air roh saku, menghasilkan batu primordial hari demi hari; ia membiayai pemeliharanya.
Gruel Mud Gu = Gu Bubur Lumpur
Gruel Mud Gu (和稀泥蛊) softens earth into mud; common at low ranks, and used to raise whole towns. = Gu Bubur Lumpur (和稀泥蛊) melunakkan tanah menjadi lumpur; umum di tingkat rendah, dan dipakai untuk membangun kota.
Whirlwind Gu = Gu Angin Puyuh
Whirlwind Gu (旋风蛊) gives a short burst of speed and puts its momentum behind every strike. = Gu Angin Puyuh (旋风蛊) memberi ledakan kecepatan singkat dan menaruh dorongannya di balik setiap serangan.
Flying Cloud Gu = Gu Awan Terbang
Flying Cloud Gu (腾云蛊) lifts its user high on a cloud: a good climber, a poor turner. = Gu Awan Terbang (腾云蛊) mengangkat penggunanya tinggi di atas awan: pandai menanjak, buruk berbelok.
Frost Demon Gu = Gu Siluman Embun Beku
Frost Demon Gu (霜妖蛊) turns the arm into frosty ice for a piercing palm-blade; used too often, it hurts the joints. = Gu Siluman Embun Beku (霜妖蛊) mengubah lengan menjadi es beku untuk bilah telapak yang menusuk; terlalu sering dipakai, ia menyakiti sendi.
Thunderclap Gu = Gu Guntur Meledak
Thunderclap Gu (炸雷蛊) spits a fast, bursting thunderball, but never twice in a row. One was found on a lightning wolf king. = Gu Guntur Meledak (炸雷蛊) menyemburkan bola guntur yang cepat dan meledak, tetapi tak pernah dua kali berturut-turut. Satu ditemukan pada raja serigala petir.
Poison Scorpion Gu = Gu Kalajengking Racun
Poison Scorpion Gu (毒蝎蛊) stings to hold a slow poison in check: its victims need a new sting every seven days, which makes them obedient servants. = Gu Kalajengking Racun (毒蝎蛊) menyengat untuk menahan racun lambat: korbannya butuh sengatan baru setiap tujuh hari, yang menjadikan mereka pelayan penurut.
Little Light Gu = Gu Cahaya Kecil
Little Light Gu (小光蛊), a famous rank-one light Gu: it lights up the area and doubles the size of a moon blade. = Gu Cahaya Kecil (小光蛊), Gu cahaya tingkat satu yang terkenal: ia menerangi sekitar dan menggandakan ukuran bilah bulan.
Shadow Follower Gu = Gu Bayang Pengiring
Shadow Follower Gu (幽影随行蛊) cloaks its user in darkness; a flash of light breaks the cloak, and the Gu must rest. = Gu Bayang Pengiring (幽影随行蛊) menyelubungi penggunanya dalam kegelapan; kilatan cahaya memecah selubung itu, dan Gu harus beristirahat.
Overlapping Shadow Gu = Gu Bayangan Bertumpuk
Overlapping Shadow Gu (叠影蛊) layers shadow over shadow to strengthen an attack Gu. Canon files it under the dark path; the young shadow path borrows it here. = Gu Bayangan Bertumpuk (叠影蛊) menumpuk bayangan di atas bayangan untuk memperkuat Gu serangan. Kanon menggolongkannya ke jalur gelap; jalur bayangan yang masih muda meminjamnya di sini.
Star Dart Gu = Gu Panah Bintang
Star Dart Gu (星镖蛊), the commonest star Gu, throws a dart of starlight; hundreds of them make a star killer move. = Gu Panah Bintang (星镖蛊), Gu bintang yang paling umum, melempar panah cahaya bintang; ratusan dari mereka membentuk jurus pamungkas bintang.
Heaven Earth Magnificent Sound Gu = Gu Suara Agung Langit Bumi
Heaven Earth Magnificent Sound Gu (天地宏音蛊) looses a wide wave of sound for mass kills; long use can strip its user's voice. = Gu Suara Agung Langit Bumi (天地宏音蛊) melepaskan gelombang suara luas untuk pembantaian massal; pemakaian lama dapat merenggut suara penggunanya.
Illusory Moon Gu = Gu Bulan Ilusi
Illusory Moon Gu (幻影月蛊) makes an illusory double that draws attacks and confuses the enemy, a Gu Yue fusion of the moonlight line that eats moon orchids by the handful. = Gu Bulan Ilusi (幻影月蛊) menciptakan kembaran ilusi yang menarik serangan dan membingungkan musuh, leburan Gu Yue dari garis cahaya bulan yang melahap anggrek bulan segenggam demi segenggam.
Clear Mind Gu = Gu Pikiran Jernih
Clear Mind Gu (神清蛊) enters the head like a breeze, clearing and steadying the mind for deduction. = Gu Pikiran Jernih (神清蛊) masuk ke kepala seperti angin sepoi, menjernihkan dan menenangkan pikiran untuk penalaran.
Emotion Poetry Gu = Gu Puisi Perasaan
Emotion Poetry Gu (诗情蛊) stores a single emotion for later use; rare and costly. = Gu Puisi Perasaan (诗情蛊) menyimpan satu emosi untuk dipakai kelak; langka dan mahal.
Estrus Gu = Gu Birahi
Estrus Gu (发情蛊) bursts into a pink powder that drives beasts to breed, used to grow enslaved herds. Canon lists it in the emotion line from which enchantment split. = Gu Birahi (发情蛊) pecah menjadi serbuk merah muda yang mendorong binatang berkembang biak, dipakai untuk memperbanyak kawanan taklukan. Kanon mencantumkannya di garis emosi, asal jalur pesona.
Soul Search Gu = Gu Penggeledah Jiwa
Soul Search Gu (搜魂蛊) reads part of a captive's memories from his soul; the results are patchy, and overuse clouds the searcher's own mind. = Gu Penggeledah Jiwa (搜魂蛊) membaca sebagian ingatan tawanan dari jiwanya; hasilnya tambal-sulam, dan pemakaian berlebihan mengaburkan pikiran si penggeledah.
Dream Pillow Gu = Gu Bantal Mimpi
Dream Pillow Gu (梦枕蛊), set under the pillow, lets an ordinary Gu Master walk into his own dream realm to gather dream materials. = Gu Bantal Mimpi (梦枕蛊), diletakkan di bawah bantal, memungkinkan Gu Master biasa memasuki alam mimpinya sendiri untuk mengumpulkan bahan mimpi.
Wolf Enslavement Gu = Gu Penakluk Serigala
Wolf Enslavement Gu (驭狼蛊), planted in a wolf's soul, makes it obey for life; higher ranks hold a thousand-wolf or a ten-thousand-wolf king. = Gu Penakluk Serigala (驭狼蛊), ditanam di jiwa serigala, membuatnya patuh seumur hidup; tingkat yang lebih tinggi menundukkan raja seribu atau sepuluh ribu serigala.
Man as Before Gu = Gu Manusia Seperti Semula
Man as Before Gu (人如故蛊) turns a body back to its state of a short while ago, a near-complete healing. = Gu Manusia Seperti Semula (人如故蛊) mengembalikan tubuh ke keadaannya sesaat sebelumnya, penyembuhan yang hampir sempurna.
Warp Gu = Gu Pindah Ruang
Warp Gu (挪移蛊) tears space to move its user's body away; frequent use twists flesh and bone. = Gu Pindah Ruang (挪移蛊) merobek ruang untuk memindahkan tubuh penggunanya; pemakaian yang sering memelintir daging dan tulang.
Amplify Effect Gu = Gu Pelipat Daya
Amplify Effect Gu (功倍蛊) multiplies the effect of another Gu, at a higher essence cost. = Gu Pelipat Daya (功倍蛊) melipatgandakan efek Gu lain, dengan biaya esensi yang lebih tinggi.
Turn Phantom Gu = Gu Pengubah Maya
Turn Phantom Gu (弄虚蛊) makes a solid thing insubstantial, so attacks pass through it. Canon does not give its rank. = Gu Pengubah Maya (弄虚蛊) membuat benda padat menjadi tak berwujud, sehingga serangan menembusnya. Kanon tak menyebut tingkatnya.
Primeval Break Gu = Gu Pemutus Esensi
Primeval Break Gu (断元蛊) cuts a wild Gu off from primeval energy. Canon does not give its rank. = Gu Pemutus Esensi (断元蛊) memutus Gu liar dari energi primordial. Kanon tak menyebut tingkatnya.
Luck Inspection Gu = Gu Pengamat Untung
Luck Inspection Gu (察运蛊) shows the colour of a person's luck; the series reaches rank five. = Gu Pengamat Untung (察运蛊) memperlihatkan warna keberuntungan seseorang; serinya mencapai tingkat lima.
Ten-Year Lifespan Gu = Gu Umur Sepuluh Tahun
A ten-year Lifespan Gu (十年寿蛊): lifespan Gu add a set number of years of life, ten, a hundred, more. The heaven path rules them. = Gu Umur Sepuluh Tahun (十年寿蛊): Gu umur menambah sejumlah tahun hidup: sepuluh, seratus, lebih. Jalur langit menguasainya.
Strength Qi Gu = Gu Hawa Kekuatan
Strength Qi Gu (力气蛊) is a formless qi of strength that doubles or triples its user's battle strength for a while. = Gu Hawa Kekuatan (力气蛊) adalah hawa kekuatan tak berwujud yang menggandakan atau melipattigakan daya tempur penggunanya untuk sementara.
Revert Gu = Gu Pembalik
Revert Gu (幡然蛊) turns a fused Gu back into one of its ingredients, so a failed plan can be unpicked. Canon does not give its rank. = Gu Pembalik (幡然蛊) mengembalikan Gu leburan menjadi salah satu bahannya, sehingga rencana yang gagal bisa diurai. Kanon tak menyebut tingkatnya.
Formation Heart Gu = Gu Inti Formasi
Formation Heart Gu (阵心蛊) is the core of a Gu formation; every other Gu in it circles around it. = Gu Inti Formasi (阵心蛊) adalah inti formasi Gu; setiap Gu lain di dalamnya berputar mengelilinginya.
Four Flavours Liquor Worm = Cacing Arak Empat Rasa
Four Flavours Liquor Worm (四味酒虫), refined from two Liquor Worms and four wines (sour, sweet, bitter, spicy), does for rank-two essence what the Liquor Worm does for rank one. = Cacing Arak Empat Rasa (四味酒虫), dimurnikan dari dua Cacing Arak dan empat arak (asam, manis, pahit, pedas), berbuat bagi esensi tingkat dua seperti Cacing Arak bagi tingkat satu.
Pill Refiner Gu = Gu Peramu Pil
Pill Refiner Gu (炼丹师蛊) becomes a pill-refiner clone that refines pill Gu; canon calls it a human-path recipe born from a pill-path inheritance. = Gu Peramu Pil (炼丹师蛊) menjadi tiruan peramu pil yang memurnikan Gu pil; kanon menyebutnya resep jalur manusia yang lahir dari warisan jalur pil.
Flying Sword Letter Gu = Gu Surat Pedang Terbang
Flying Sword Letter Gu (飞剑传书蛊) is a sword-shaped messenger that carries a letter very fast. = Gu Surat Pedang Terbang (飞剑传书蛊) adalah pembawa pesan berbentuk pedang yang mengantar surat dengan sangat cepat.
Relic Gu = Gu Relik
Relic Gu (舍利蛊) raises a Gu Master by one small stage; there is one kind for every rank, green copper to purple crystal. = Gu Relik (舍利蛊) menaikkan seorang Gu Master satu tahap kecil; ada satu jenis untuk tiap tingkat, dari tembaga hijau sampai kristal ungu.
Painting Idea Gu = Gu Gagasan Lukisan
Painting Idea Gu (画意蛊) turns a sight into a scene etched in memory. Canon files it under wisdom; only its name points to painting. = Gu Gagasan Lukisan (画意蛊) mengubah pemandangan menjadi adegan yang terukir di ingatan. Kanon menggolongkannya ke jalur kebijaksanaan; hanya namanya yang menunjuk ke lukisan.
Plunder Gu = Gu Perampas
Plunder Gu (强取蛊) tears a Gu away from an enemy while its user stands still; the odds are low, and failure strikes back. = Gu Perampas (强取蛊) merenggut Gu dari musuh sementara penggunanya berdiri diam; peluangnya kecil, dan kegagalan berbalik menyerang.

# Gold is displayed as Batu Primordial (overrides base translations)
Barbarians raided [cityName] and stole [amount] Gold from your treasury! = Orang-orang Barbar telah menyerang [cityName] dan merampas [amount] Batu Primordial dari perbendaharaanmu!
Build [improvementName] on [resourceName] (200 Gold) = Bangun [improvementName] di [resourceName] (200 Batu Primordial)
Can spend Gold to annex or puppet a City-State that has been your Ally for [nonNegativeAmount] turns = Dapat mengeluarkan Batu Primordial untuk menganeksasi atau menjadikan Negara-Kota yang telah menjadi Sekutumu sebagai boneka selama [nonNegativeAmount] giliran
Can trade civilization introductions for [positiveAmount] Gold = Dapat menjual perkenalan peradaban untuk [positiveAmount] Batu Primordial
Diplomatic Marriage ([amount] Gold) = Pernikahan Diplomatik ([amount] Batu Primordial)
Gifts of Gold to City-States generate [relativeAmount]% more Influence = Pemberian Batu Primordial ke Negara-Kota menghasilkan [relativeAmount]% lebih banyak Pengaruh
Give Gold = Berikan Batu Primordial
Gold = Batu Primordial
Gold can be used to Buy Buildings and Units, helping bring up a new City or quickly build an Army. It can also buy Tiles to add to your City. It's also used to Upgrade your units from their older, obsolete forms to new, stronger versions. And investing it into a Research Agreement is a great way to convert it into ⍾Science. = Uang dapat digunakan untuk Membeli Bangunan dan Unit, membantu mendirikan Kota baru atau secepatnya membangun Tentara. Ini juga bisa membeli Ubin untuk ditambahkan pada Kotamu. Ini juga digunakan untuk Meningkatkan untuk unitmu dari bentuk lama, usang mereka menjadi versi baru, lebih kuat. Dan menginvestasikannya pada Persetujuan Riset adalah cara yang hebat untuk mengubahnya menjadi ⍾Ilmu Pengetahuan.
Gold cost modifier: [amount]%¤ = Pemodifikasi biaya batu primordial: [amount]%¤
Gold gift influence gain modifier: [amount]%¤ = Pemodifikasi pengaruh hadiah batu primordial: [amount]%¤
Gold is also very valuable in Diplomacy. You can directly Gift Gold to City-States to gain their favor. Use it to balance a Trade Deal with other Nations. Or demand every last drop after a successful war and your enemy sues for peace. = Batu Primordial juga sangat berharga dalam Diplomasi. Kamu bisa langsung Memberi Batu Primordial kepada Negara-Kota untuk mendapatkan bantuan mereka. Menggunakannya untuk menyeimbangkan Kesepakatan Dagang dengan Bangsa lain. Atau menuntut setiap tetes terakhir setelah perang yang berhasil dan gugatan musuhmu untuk berdamai.
Gold is how you pay for Building Maintenance, Transportation Upkeep, and Unit Upkeep. If you run out of Gold, first you'll receive penalties to your ⍾Science production, then eventually your Units will start Disbanding as you can't pay their upkeep. = Batu Primordial adalah caramu membayar untuk Pemeliharaan Bangunan, Kebutuhan Transportasi, dan Kebutuhan Unit. Jika kamu kehabisan Batu Primordial, pertama-tama kamu akan menerima penalti kepada produksi ⍾Ilmu Pengetahuanmu, lalu pada akhirnya Unitmu akan mulai Bubar karena kamu tidak bisa membayar kebutuhan mereka.
Gold per turn = Batu Primordial per giliran
Gold reward for clearing barbarian camps = Hadiah batu primordial atas penumpasan perkemahan orang barbar
Ironically, some may consider Gold to be one of the less important Resources. But it's flexible nature and importance to keep your Nation running makes it a precious thing to pay attention to. After all, everyone loves Gold. = Ironisnya, beberapa mungkin menganggap Batu Primordial sebagai salah satu Sumber Daya yang kurang penting. Tetapi sifat fleksibelnya dan pentingnya menjaga Bangsamu berjalan membuatnya sebagai hal berharga untuk diperhatikan. Lagipula, semua orang menyukai Batu Primordial.
Note that before you can invest in a research agreement, you must have a Declaraction of Friendship, both Nations need the required Technology, and both Nations need enough Gold on hand for the agreement. = Catatlah bahwa sebelum kamu menginvestasi dalam persetujuan riset, kamu harus mempunyai Deklarasi Pertemanan, kedua Bangsa membutuhkan Teknologi yang diperlukan, dan kedua Bangsa membutuhkan Batu Primordial yang cukup untuk persetujuan.
Receive [relativeAmount]% Gold from Barbarian encampments and pillaging Cities = Mendapatkan [relativeAmount]% Batu Primordial dari menjarah Kota dan perkemahan Orang Barbar
Received [goldAmount] Gold for capturing [cityName] = Menerima [goldAmount] Batu Primordial karena merebut [cityName]
We are suffering great poverty after being robbed by [civName], and unless we receive a sum of Gold, it's only a matter of time before we collapse. = Kami sedang mengalami kemiskinan hebat setelah dirampok oleh [civName], kecuali kami mendapatkan sejumlah Batu Primordial, hanya tinggal menunggu waktu sebelum kami runtuh.
We have received [goldAmount] Gold for discovering [naturalWonder] = Kita telah menerima Batu Primordial sebanyak [goldAmount] karena menemukan [naturalWonder]
When conquering an encampment, earn [amount] Gold and recruit a Barbarian unit = Saat menaklukkan perkemahan, mendapatkan [amount] Batu Primordial dan merekrut satu unit Orang Barbar
When defeating a [mapUnitFilter] unit, earn [amount] Gold and recruit it = Saat mengalahkan unit [mapUnitFilter], mendapatkan [amount] Batu Primordial dan merekrutnya
You can earn more Gold from Tiles, Resources, Improvements, and eventually Buildings, Specialists, and Trade Routes. Ancient Ruins, meeting new City-States, and Pillaging are also great sources of Gold. During a Golden Age every Tile that already yields Gold will yield an additional Gold! = Kamu bisa mendapatkan lebih banyak Batu Primordial dari Ubin, Sumber Daya, Peningkatan, dan pada akhirnya Bangunan, Spesialis, dan Jalur Perdagangan. Reruntuhan Kuno, bertemu Negara-Kota baru, dan Menjarah juga merupakan sumber Batu Primordial yang bagus. Selama Masa Kejayaan, setiap Ubin yang sudah menghasilkan Batu Primordial akan menghasilkan Batu Primordial tambahan!
[relativeAmount]% Gold cost of acquiring tiles [cityFilter] = [relativeAmount]% biaya Batu Primordial untuk memperoleh ubin [cityFilter]
[relativeAmount]% Gold cost of upgrading = [relativeAmount]% biaya Batu Primordial untuk peningkatan
[relativeAmount]% Gold from Great Merchant trade missions = [relativeAmount]% Batu Primordial dari misi dagang Pedagang Besar
[relativeAmount]% Gold given to enemy if city is captured = [relativeAmount]% Batu Primordial diberikan kepada musuh jika kota telah direbut
