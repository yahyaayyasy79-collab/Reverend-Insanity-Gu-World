Illusory Moon Gu (幻影月蛊) makes an illusory double that draws attacks and confuses the enemy, a Gu Yue fusion of the moonlight line that eats moon orchids by the handful. = Gu Bulan Ilusi (幻影月蛊) menciptakan kembaran ilusi yang menarik serangan dan membingungkan musuh, leburan Gu Yue dari garis cahaya bulan yang melahap anggrek bulan segenggam demi segenggam.
Clear Mind Gu = Gu Pikiran Jernih
Clear Mind Gu (神清蛊) enters the head like a breeze, clearing and steadying the mind for deduction. = Gu Pikiran Jernih (神清蛊) masuk ke kepala seperti angin sepoi, menjernihkan dan menenangkan pikiran untuk penalaran.
Emotion Poetry Gu = Gu Puisi Perasaan
Emotion Poetry Gu (诗情蛊) stores a single emotion for later use; rare and costly. = Gu Puisi Perasaan (诗情蛊) menyimpan satu emosi untuk dipakai kelak; langka dan mahal.
Estrus Gu = Gu Birahi
Estrus Gu (发情蛊) bursts into a pink powder that drives beasts to breed, used to grow enslaved herds. Canon lists it in the emotion line from which enchantment split. = Gu Birahi (发情蛊) pecah menjadi serbuk merah muda yang mendorong binatang berkembang biak, dipakai untuk memperbanyak kawanan taklukan. Kanon mencantumkannya di garis emosi, asal jalur pesona.
Soul Search Gu = Gu Penggeledah Jiwa
Soul Search Gu (搜魂蛊) reads part of a captive's memories from his soul; the results are patchy, and overuse clouds the searcher's own mind. = Gu Penggeledah Jiwa (搜魂蛊) membaca sebagian ingatan tawanan dari jiwanya; hasilnya tambal-sulam, dan pemakaian berlebihan mengaburkan pikiran si penggeledah.
Dream Pillow Gu = Gu Bantal Mimpi
Dream Pillow Gu (梦枕蛊), set under the pillow, lets an ordinary Gu Master walk into his own dream realm to gather dream materials. = Gu Bantal Mimpi (梦枕蛊), diletakkan di bawah bantal, memungkinkan Gu Master biasa memasuki alam mimpinya sendiri untuk mengumpulkan bahan mimpi.
Wolf Enslavement Gu = Gu Penakluk Serigala
Wolf Enslavement Gu (驭狼蛊), planted in a wolf's soul, makes it obey for life; higher ranks hold a thousand-wolf or a ten-thousand-wolf king. = Gu Penakluk Serigala (驭狼蛊), ditanam di jiwa serigala, membuatnya patuh seumur hidup; tingkat yang lebih tinggi menundukkan raja seribu atau sepuluh ribu serigala.
Man as Before Gu = Gu Manusia Seperti Semula
Man as Before Gu (人如故蛊) turns a body back to its state of a short while ago, a near-complete healing. = Gu Manusia Seperti Semula (人如故蛊) mengembalikan tubuh ke keadaannya sesaat sebelumnya, penyembuhan yang hampir sempurna.
Warp Gu = Gu Pindah Ruang
Warp Gu (挪移蛊) tears space to move its user's body away; frequent use twists flesh and bone. = Gu Pindah Ruang (挪移蛊) merobek ruang untuk memindahkan tubuh penggunanya; pemakaian yang sering memelintir daging dan tulang.
Amplify Effect Gu = Gu Pelipat Daya
Amplify Effect Gu (功倍蛊) multiplies the effect of another Gu, at a higher essence cost. = Gu Pelipat Daya (功倍蛊) melipatgandakan efek Gu lain, dengan biaya esensi yang lebih tinggi.
Turn Phantom Gu = Gu Pengubah Maya
Turn Phantom Gu (弄虚蛊) makes a solid thing insubstantial, so attacks pass through it. Canon does not give its rank. = Gu Pengubah Maya (弄虚蛊) membuat benda padat menjadi tak berwujud, sehingga serangan menembusnya. Kanon tak menyebut tingkatnya.
Primeval Break Gu = Gu Pemutus Esensi
Primeval Break Gu (断元蛊) cuts a wild Gu off from primeval energy. Canon does not give its rank. = Gu Pemutus Esensi (断元蛊) memutus Gu liar dari energi primordial. Kanon tak menyebut tingkatnya.
Luck Inspection Gu = Gu Pengamat Untung
Luck Inspection Gu (察运蛊) shows the colour of a person's luck; the series reaches rank five. = Gu Pengamat Untung (察运蛊) memperlihatkan warna keberuntungan seseorang; serinya mencapai tingkat lima.
Lifespan Gu = Gu Umur
Lifespan Gu (寿蛊) adds a set number of years of life: ten, a hundred, more. The heaven path rules them. = Gu Umur (寿蛊) menambah sejumlah tahun hidup: sepuluh, seratus, lebih. Jalur langit menguasainya.
Strength Qi Gu = Gu Hawa Kekuatan
Strength Qi Gu (力气蛊) is a formless qi of strength that doubles or triples its user's battle strength for a while. = Gu Hawa Kekuatan (力气蛊) adalah hawa kekuatan tak berwujud yang menggandakan atau melipattigakan daya tempur penggunanya untuk sementara.
Revert Gu = Gu Pembalik
Revert Gu (幡然蛊) turns a fused Gu back into one of its ingredients, so a failed plan can be unpicked. Canon does not give its rank. = Gu Pembalik (幡然蛊) mengembalikan Gu leburan menjadi salah satu bahannya, sehingga rencana yang gagal bisa diurai. Kanon tak menyebut tingkatnya.
Formation Heart Gu = Gu Inti Formasi
Formation Heart Gu (阵心蛊) is the core of a Gu formation; every other Gu in it circles around it. = Gu Inti Formasi (阵心蛊) adalah inti formasi Gu; setiap Gu lain di dalamnya berputar mengelilinginya.
Four Flavours Liquor Worm = Cacing Arak Empat Rasa
Four Flavours Liquor Worm (四味酒虫), refined from two Liquor Worms and four wines (sour, sweet, bitter, spicy), does for rank-two essence what the Liquor Worm does for rank one. = Cacing Arak Empat Rasa (四味酒虫), dimurnikan dari dua Cacing Arak dan empat arak (asam, manis, pahit, pedas), berbuat bagi esensi tingkat dua seperti Cacing Arak bagi tingkat satu.
Pill Refiner Gu = Gu Peramu Pil
Pill Refiner Gu (炼丹师蛊) becomes a pill-refiner clone that refines pill Gu; canon calls it a human-path recipe born from a pill-path inheritance. = Gu Peramu Pil (炼丹师蛊) menjadi tiruan peramu pil yang memurnikan Gu pil; kanon menyebutnya resep jalur manusia yang lahir dari warisan jalur pil.
Flying Sword Letter Gu = Gu Surat Pedang Terbang
Flying Sword Letter Gu (飞剑传书蛊) is a sword-shaped messenger that carries a letter very fast. = Gu Surat Pedang Terbang (飞剑传书蛊) adalah pembawa pesan berbentuk pedang yang mengantar surat dengan sangat cepat.
Relic Gu = Gu Relik
Relic Gu (舍利蛊) raises a Gu Master by one small stage; there is one kind for every rank, green copper to purple crystal. = Gu Relik (舍利蛊) menaikkan seorang Gu Master satu tahap kecil; ada satu jenis untuk tiap tingkat, dari tembaga hijau sampai kristal ungu.
Painting Idea Gu = Gu Gagasan Lukisan
Painting Idea Gu (画意蛊) turns a sight into a scene etched in memory. Canon files it under wisdom; only its name points to painting. = Gu Gagasan Lukisan (画意蛊) mengubah pemandangan menjadi adegan yang terukir di ingatan. Kanon menggolongkannya ke jalur kebijaksanaan; hanya namanya yang menunjuk ke lukisan.
Plunder Gu = Gu Perampas
Plunder Gu (强取蛊) tears a Gu away from an enemy while its user stands still; the odds are low, and failure strikes back. = Gu Perampas (强取蛊) merenggut Gu dari musuh sementara penggunanya berdiri diam; peluangnya kecil, dan kegagalan berbalik menyerang.

# Gold is displayed as Batu Primordial (overrides base translations)
Barbarians raided [cityName] and stole [amount] Gold from your treasury! = Orang-orang Barbar telah menyerang [cityName] dan merampas [amount] Batu Primordial dari perbendaharaanmu!
Build [improvementName] on [resourceName] (200 Gold) = Bangun [improvementName] di [resourceName] (200 Batu Primordial)
Can spend Gold to annex or puppet a City-State that has been your Ally for [nonNegativeAmount] turns = Dapat mengeluarkan Batu Primordial untuk menganeksasi atau menjadikan Negara-Kota yang telah menjadi Sekutumu sebagai boneka selama [nonNegativeAmount] giliran
Can trade civilization introductions for [positiveAmount] Gold = Dapat menjual perkenalan peradaban untuk [positiveAmount] Batu Primordial
Diplomatic Marriage ([amount] Gold) = Pernikahan Diplomatik ([amount] Batu Primordial)
Gifts of Gold to City-States generate [relativeAmount]% more Influence = Pemberian Batu Primordial ke Negara-Kota menghasilkan [relativeAmount]% lebih banyak Pengaruh
Give Gold = Berikan Batu Primordial
Gold = Batu Primordial
Gold can be used to Buy Buildings and Units, helping bring up a new City or quickly build an Army. It can also buy Tiles to add to your City. It's also used to Upgrade your units from their older, obsolete forms to new, stronger versions. And investing it into a Research Agreement is a great way to convert it into ⍾Science. = Uang dapat digunakan untuk Membeli Bangunan dan Unit, membantu mendirikan Kota baru atau secepatnya membangun Tentara. Ini juga bisa membeli Ubin untuk ditambahkan pada Kotamu. Ini juga digunakan untuk Meningkatkan untuk unitmu dari bentuk lama, usang mereka menjadi versi baru, lebih kuat. Dan menginvestasikannya pada Persetujuan Riset adalah cara yang hebat untuk mengubahnya menjadi ⍾Ilmu Pengetahuan.
Gold cost modifier: [amount]%¤ = Pemodifikasi biaya batu primordial: [amount]%¤
Gold gift influence gain modifier: [amount]%¤ = Pemodifikasi pengaruh hadiah batu primordial: [amount]%¤
Gold is also very valuable in Diplomacy. You can directly Gift Gold to City-States to gain their favor. Use it to balance a Trade Deal with other Nations. Or demand every last drop after a successful war and your enemy sues for peace. = Batu Primordial juga sangat berharga dalam Diplomasi. Kamu bisa langsung Memberi Batu Primordial kepada Negara-Kota untuk mendapatkan bantuan mereka. Menggunakannya untuk menyeimbangkan Kesepakatan Dagang dengan Bangsa lain. Atau menuntut setiap tetes terakhir setelah perang yang berhasil dan gugatan musuhmu untuk berdamai.
Gold is how you pay for Building Maintenance, Transportation Upkeep, and Unit Upkeep. If you run out of Gold, first you'll receive penalties to your ⍾Science production, then eventually your Units will start Disbanding as you can't pay their upkeep. = Batu Primordial adalah caramu membayar untuk Pemeliharaan Bangunan, Kebutuhan Transportasi, dan Kebutuhan Unit. Jika kamu kehabisan Batu Primordial, pertama-tama kamu akan menerima penalti kepada produksi ⍾Ilmu Pengetahuanmu, lalu pada akhirnya Unitmu akan mulai Bubar karena kamu tidak bisa membayar kebutuhan mereka.
Gold per turn = Batu Primordial per giliran
Gold reward for clearing barbarian camps = Hadiah batu primordial atas penumpasan perkemahan orang barbar
Ironically, some may consider Gold to be one of the less important Resources. But it's flexible nature and importance to keep your Nation running makes it a precious thing to pay attention to. After all, everyone loves Gold. = Ironisnya, beberapa mungkin menganggap Batu Primordial sebagai salah satu Sumber Daya yang kurang penting. Tetapi sifat fleksibelnya dan pentingnya menjaga Bangsamu berjalan membuatnya sebagai hal berharga untuk diperhatikan. Lagipula, semua orang menyukai Batu Primordial.
Note that before you can invest in a research agreement, you must have a Declaraction of Friendship, both Nations need the required Technology, and both Nations need enough Gold on hand for the agreement. = Catatlah bahwa sebelum kamu menginvestasi dalam persetujuan riset, kamu harus mempunyai Deklarasi Pertemanan, kedua Bangsa membutuhkan Teknologi yang diperlukan, dan kedua Bangsa membutuhkan Batu Primordial yang cukup untuk persetujuan.
Receive [relativeAmount]% Gold from Barbarian encampments and pillaging Cities = Mendapatkan [relativeAmount]% Batu Primordial dari menjarah Kota dan perkemahan Orang Barbar
Received [goldAmount] Gold for capturing [cityName] = Menerima [goldAmount] Batu Primordial karena merebut [cityName]
We are suffering great poverty after being robbed by [civName], and unless we receive a sum of Gold, it's only a matter of time before we collapse. = Kami sedang mengalami kemiskinan hebat setelah dirampok oleh [civName], kecuali kami mendapatkan sejumlah Batu Primordial, hanya tinggal menunggu waktu sebelum kami runtuh.
We have received [goldAmount] Gold for discovering [naturalWonder] = Kita telah menerima Batu Primordial sebanyak [goldAmount] karena menemukan [naturalWonder]
When conquering an encampment, earn [amount] Gold and recruit a Barbarian unit = Saat menaklukkan perkemahan, mendapatkan [amount] Batu Primordial dan merekrut satu unit Orang Barbar
When defeating a [mapUnitFilter] unit, earn [amount] Gold and recruit it = Saat mengalahkan unit [mapUnitFilter], mendapatkan [amount] Batu Primordial dan merekrutnya
You can earn more Gold from Tiles, Resources, Improvements, and eventually Buildings, Specialists, and Trade Routes. Ancient Ruins, meeting new City-States, and Pillaging are also great sources of Gold. During a Golden Age every Tile that already yields Gold will yield an additional Gold! = Kamu bisa mendapatkan lebih banyak Batu Primordial dari Ubin, Sumber Daya, Peningkatan, dan pada akhirnya Bangunan, Spesialis, dan Jalur Perdagangan. Reruntuhan Kuno, bertemu Negara-Kota baru, dan Menjarah juga merupakan sumber Batu Primordial yang bagus. Selama Masa Kejayaan, setiap Ubin yang sudah menghasilkan Batu Primordial akan menghasilkan Batu Primordial tambahan!
[relativeAmount]% Gold cost of acquiring tiles [cityFilter] = [relativeAmount]% biaya Batu Primordial untuk memperoleh ubin [cityFilter]
[relativeAmount]% Gold cost of upgrading = [relativeAmount]% biaya Batu Primordial untuk peningkatan
[relativeAmount]% Gold from Great Merchant trade missions = [relativeAmount]% Batu Primordial dari misi dagang Pedagang Besar
[relativeAmount]% Gold given to enemy if city is captured = [relativeAmount]% Batu Primordial diberikan kepada musuh jika kota telah direbut
