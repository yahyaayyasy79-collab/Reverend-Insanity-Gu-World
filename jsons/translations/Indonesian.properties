A Master contemplating its path: when this runs out (20 turns on Standard) its dao marks grow by one tier. = Seorang Ahli merenungkan jalurnya: saat ini habis (20 giliran pada kecepatan Standar) jejak dao-nya bertambah satu tingkat.
The region wall of the Southern Border (瘴气界壁). Mortals cannot cross it; immortals can, but one that ends its turn inside takes 25 damage. Found on the Five Regions map. = Dinding wilayah Perbatasan Selatan (瘴气界壁). Manusia fana tak bisa melintasinya; para abadi bisa, tetapi yang mengakhiri giliran di dalamnya menerima 25 kerusakan. Ada di peta Lima Wilayah.
