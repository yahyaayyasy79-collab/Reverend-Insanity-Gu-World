Gu World: Power Scaling = Dunia Gu: Skala Kekuatan
The five layers of power = Lima lapis kekuatan
1. Rank. Base strength: Rank One 8, Rank Two 14, Rank Three 22, Rank Four 32, Rank Five 44, Rank Six 60, Rank Seven 85, Rank Eight 115, the Venerable 280. Clan Masters of a rank have the same strength. = 1. Tingkat. Kekuatan dasar: Tingkat Satu 8, Tingkat Dua 14, Tingkat Tiga 22, Tingkat Empat 32, Tingkat Lima 44, Tingkat Enam 60, Tingkat Tujuh 85, Tingkat Delapan 115, Yang Mulia 280. Gu Master klan pada tingkat yang sama punya kekuatan yang sama.
2. Path attainment (comprehension). Four tiers stack: Master +10% at any rank, Grandmaster +15% from rank three, Great Grandmaster +20% from rank six, Supreme Grandmaster +25% from rank eight: +70% at the top. Each tier opens a new kind of power: the Master the path's hit on every attack it makes, the Grandmaster a second effect and the mortal killer move, the Great Grandmaster a domain or a new art and the immortal killer move, the Supreme Grandmaster the path's peak. = 2. Pencapaian jalur (pemahaman). Empat tingkat bertumpuk: Ahli +10% di tingkat mana pun, Mahaguru +15% sejak tingkat tiga, Mahaguru Agung +20% sejak tingkat enam, Mahaguru Tertinggi +25% sejak tingkat delapan: +70% di puncak. Tiap tingkat membuka jenis kekuatan baru: Ahli membuka serangan khas jalur pada setiap serangan, Mahaguru efek kedua dan jurus pamungkas fana, Mahaguru Agung sebuah domain atau seni baru dan jurus pamungkas abadi, Mahaguru Tertinggi puncak jalur itu.
3. Dao marks, the quantity of dao. Tiers I to V give +5%, +10%, +15%, +20% and +10 HP healing, +30% and +15 HP healing. Every tier also raises the path's hit: extra damage 4/5/6/8/10/12, status turns 2/2/2/3/3/4, healing 5/6/8/10/12/15, XP 2/3/4/5/6/8, stolen stones 10/15/20/25/30/40%, movement 1/1/1/1/2/2 (no marks, then I to V; a path may multiply them). The Master's promotion lists what each tier adds. = 3. Jejak dao, kuantitas dao. Tingkat I sampai V memberi +5%, +10%, +15%, +20% dan +10 HP pemulihan, +30% dan +15 HP pemulihan. Tiap tingkat juga menaikkan serangan khas jalur: kerusakan tambahan 4/5/6/8/10/12, lama status 2/2/2/3/3/4 giliran, pemulihan 5/6/8/10/12/15, XP 2/3/4/5/6/8, batu curian 10/15/20/25/30/40%, gerak 1/1/1/1/2/2 (tanpa jejak, lalu I sampai V; sebagian jalur mengalikannya). Promosi Ahli menuliskan tambahan tiap tingkat.
Dao marks grow one tier every 20 turns on Standard for a path Master of rank three or more; an immortal also gains one for every immortal it kills and every heavenly tribulation it survives. Mortals stop at tier II. Rank seven needs tier II, rank eight tier III, the Venerable tier IV. = Jejak dao naik satu tingkat tiap 20 giliran pada kecepatan Standar bagi Ahli jalur tingkat tiga ke atas; seorang abadi juga mendapat satu dari setiap abadi yang dibunuhnya dan setiap kesengsaraan langit yang dilaluinya. Manusia fana berhenti di tingkat II. Tingkat tujuh butuh tingkat II, tingkat delapan III, Yang Mulia IV.
4. Gu. Each path's Gu comes with its Master. Every immortal Gu of your own path that your clan owns adds 5% strength; one of a strongly clashing path takes 5% away. = 4. Gu. Gu tiap jalur datang bersama Ahlinya. Setiap Gu abadi dari jalurmu sendiri yang dimiliki klanmu menambah 5% kekuatan; Gu dari jalur yang sangat bertentangan mengurangi 5%.
5. Conflicts. A second path whose dao marks clash with the first costs 5% to 25% strength. = 5. Pertentangan. Jalur kedua yang jejak daonya berbenturan dengan jalur pertama memotong 5% sampai 25% kekuatan.
Killer moves = Jurus pamungkas
A unit-action button, so only you use them: for one turn the path family's burst plus the path's hit at full power (twice that for the immortal move). The mortal move costs 15 stones, the immortal move 5 green grape essence. = Tombol aksi unit, jadi hanya kamu yang memakainya: selama satu giliran ledakan keluarga jalur ditambah serangan khas jalur pada kekuatan penuh (dua kali lipat untuk jurus abadi). Jurus fana 15 batu, jurus abadi 5 esensi anggur hijau.
