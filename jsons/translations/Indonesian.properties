Gu World: Statuses = Dunia Gu: Status
What a path's hit leaves on its target. A status ticks at the start of the target's own turn. = Apa yang ditinggalkan serangan khas jalur pada sasarannya. Status berkurang di awal giliran sasaran itu sendiri.
Poisoned: Venom works through the body: damage at every turn start until it fades. = Teracuni: Bisa menjalari tubuh: kerusakan di setiap awal giliran sampai hilang.
Charmed: Charm saps the will: weaker attacks while it lasts. = Terpesona: Pesona melemahkan niat: serangan lebih lemah selama berlangsung.
Sealed: A restriction seal cuts the unit off from healing; only pillage restores it. = Tersegel: Segel larangan memutus unit dari penyembuhan; hanya menjarah yang memulihkannya.
Phantom Veil: After a heavy blow the body turns insubstantial for a moment: much harder to hit. = Selubung Hampa: Setelah pukulan berat tubuh menjadi tak berwujud sejenak: jauh lebih sulit dilukai.
Shaken: A mind-path move has shaken the unit's resolve: weaker in battle. = Gentar: Jurus jalur pikiran mengguncang tekad unit: lebih lemah dalam pertempuran.
Burning: Fire-path flames cling to the body: 8 damage at every turn start until they die out. = Terbakar: Api jalur api melekat di tubuh: 8 kerusakan di setiap awal giliran sampai padam.
Frozen: Ice-path frost locks the limbs: 1 movement less and 15% weaker attacks. = Membeku: Embun beku jalur es mengunci anggota tubuh: gerak berkurang 1 dan serangan 15% lebih lemah.
Bleeding: Open wounds from bone, blade or blood: 6 damage at every turn start. = Berdarah: Luka terbuka dari tulang, pisau, atau darah: 6 kerusakan di setiap awal giliran.
Blinded: Light or cloud fills the eyes: 2 sight less and 10% weaker. = Buta: Cahaya atau awan memenuhi mata: penglihatan berkurang 2 dan 10% lebih lemah.
Soul-Torn: The soul is wounded: 15% weaker, and half the battle experience. = Jiwa Terkoyak: Jiwa terluka: 15% lebih lemah, dan hanya separuh pengalaman tempur.
Dazed: Sound, dream or ink has muddled the mind: 1 movement less and 10% weaker. = Linglung: Suara, mimpi, atau tinta mengacaukan pikiran: gerak berkurang 1 dan 10% lebih lemah.
Guard Broken: The guard is broken, by force, metal, venom or a weakness exposed: 20% weaker when defending. = Pertahanan Jebol: Pertahanan jebol oleh tenaga, logam, racun, atau kelemahan yang terbuka: 20% lebih lemah saat bertahan.
Entangled: Roots or a formation hold the legs: 2 movement less. = Terjerat: Akar atau formasi menahan kaki: gerak berkurang 2.
Shocked: Lightning runs through the body: 25% weaker. = Tersengat: Petir mengalir di tubuh: 25% lebih lemah.
Doomed: Fortune has turned, or heaven itself frowns: 10% weaker and 5 damage at every turn start. = Celaka: Keberuntungan berbalik, atau langit sendiri murka: 10% lebih lemah dan 5 kerusakan di setiap awal giliran.
Aged: Time-path years pour into the body: 10% weaker when defending and 5 damage at every turn start. = Menua: Tahun-tahun jalur waktu mengalir ke tubuh: 10% lebih lemah saat bertahan dan 5 kerusakan di setiap awal giliran.
Weighted: Earth or starlight presses down: 1 movement less and 15% weaker when defending. = Terbebani: Bumi atau cahaya bintang menekan: gerak berkurang 1 dan 15% lebih lemah saat bertahan.
Gu World: Combination Killer Moves = Dunia Gu: Jurus Pamungkas Kombinasi
Combination killer moves = Jurus pamungkas kombinasi
174 killer moves need two Gu on the same unit. When a unit holds both, a button appears among its actions: one turn of power for stones (immortal moves: immortal essence) and one movement. Only you press these buttons; the AI never does. Each move's rank is its strongest Gu's rank, and its power grows with it. = 174 jurus pamungkas butuh dua Gu pada unit yang sama. Bila sebuah unit memegang keduanya, sebuah tombol muncul di antara aksinya: satu giliran kekuatan dengan biaya batu (jurus abadi: esensi abadi) dan satu gerak. Hanya kamu yang menekan tombol ini; AI tidak pernah. Tingkat tiap jurus sama dengan tingkat Gu terkuatnya, dan kekuatannya tumbuh bersamanya.
