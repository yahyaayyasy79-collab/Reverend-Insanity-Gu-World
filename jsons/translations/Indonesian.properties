A restriction seal cuts the unit off from healing; only pillage restores it. = Segel larangan memutus unit dari penyembuhan; hanya menjarah yang memulihkannya.
Phantom Veil = Selubung Hampa
After a heavy blow the body turns insubstantial for a moment: much harder to hit. = Setelah pukulan berat tubuh menjadi tak berwujud sejenak: jauh lebih sulit dilukai.
Shaken = Gentar
A mind-path move has shaken the unit's resolve: weaker in battle. = Jurus jalur pikiran mengguncang tekad unit: lebih lemah dalam pertempuran.
Burning = Terbakar
Fire-path flames cling to the body: 8 damage at every turn start until they die out. = Api jalur api melekat di tubuh: 8 kerusakan di setiap awal giliran sampai padam.
Frozen = Membeku
Ice-path frost locks the limbs: 1 movement less and 15% weaker attacks. = Embun beku jalur es mengunci anggota tubuh: gerak berkurang 1 dan serangan 15% lebih lemah.
Bleeding = Berdarah
Open wounds from bone, blade or blood: 6 damage at every turn start. = Luka terbuka dari tulang, pisau, atau darah: 6 kerusakan di setiap awal giliran.
Blinded = Buta
Light or cloud fills the eyes: 2 sight less and 10% weaker. = Cahaya atau awan memenuhi mata: penglihatan berkurang 2 dan 10% lebih lemah.
Soul-Torn = Jiwa Terkoyak
The soul is wounded: 15% weaker, and half the battle experience. = Jiwa terluka: 15% lebih lemah, dan hanya separuh pengalaman tempur.
Dazed = Linglung
Sound, dream or ink has muddled the mind: 1 movement less and 10% weaker. = Suara, mimpi, atau tinta mengacaukan pikiran: gerak berkurang 1 dan 10% lebih lemah.
Guard Broken = Pertahanan Jebol
The guard is broken, by force, metal, venom or a weakness exposed: 20% weaker when defending. = Pertahanan jebol oleh tenaga, logam, racun, atau kelemahan yang terbuka: 20% lebih lemah saat bertahan.
Entangled = Terjerat
Roots or a formation hold the legs: 2 movement less. = Akar atau formasi menahan kaki: gerak berkurang 2.
Shocked = Tersengat
Lightning runs through the body: 25% weaker. = Petir mengalir di tubuh: 25% lebih lemah.
Doomed = Celaka
Fortune has turned, or heaven itself frowns: 10% weaker and 5 damage at every turn start. = Keberuntungan berbalik, atau langit sendiri murka: 10% lebih lemah dan 5 kerusakan di setiap awal giliran.
Aged = Menua
Time-path years pour into the body: 10% weaker when defending and 5 damage at every turn start. = Tahun-tahun jalur waktu mengalir ke tubuh: 10% lebih lemah saat bertahan dan 5 kerusakan di setiap awal giliran.
Weighted = Terbebani
Earth or starlight presses down: 1 movement less and 15% weaker when defending. = Bumi atau cahaya bintang menekan: gerak berkurang 1 dan 15% lebih lemah saat bertahan.
Roaming Zombie Gu = Gu Zombi Pengembara
Roaming Zombie Gu (游僵蛊) turns its user into a walking corpse that feels no pain and shrugs off blows, weaker by daylight. Used too long, the change stays. = Gu Zombi Pengembara (游僵蛊) mengubah penggunanya menjadi mayat berjalan yang tak merasakan sakit dan tahan pukulan, lebih lemah di siang hari. Dipakai terlalu lama, perubahan itu menetap.
Bone Spear Gu = Gu Tombak Tulang
Bone Spear Gu (骨枪蛊) fires a small spinning spike of bone, the bone path's answer to the moon blade. In canon it drinks milk; here it eats pork. = Gu Tombak Tulang (骨枪蛊) menembakkan duri tulang kecil yang berputar, jawaban jalur tulang atas bilah bulan. Dalam kanon ia minum susu; di sini ia makan daging babi.
Blood Skull Gu = Gu Tengkorak Darah
Blood Skull Gu (血颅蛊) drinks the blood of the slain and turns it into essence that raises its user's aptitude, one of the Blood Sea Ancestor's true inheritances. = Gu Tengkorak Darah (血颅蛊) meminum darah yang terbunuh dan mengubahnya menjadi esensi yang menaikkan bakat penggunanya, salah satu warisan sejati Leluhur Lautan Darah.
Sword Shadow Gu = Gu Bayangan Pedang
Sword Shadow Gu (剑影蛊) sends out the shadow of a sword, counted among the strongest rank-three attack Gu. = Gu Bayangan Pedang (剑影蛊) melepaskan bayangan sebilah pedang, terhitung di antara Gu serangan tingkat tiga yang terkuat.
Sole Blade Gu = Gu Bilah Tunggal
Sole Blade Gu (单刀蛊) lives on a blade as a gleam of edge-light and can cut through a defence of its own rank, then needs long rest. It wears its blade away; here it eats jade. = Gu Bilah Tunggal (单刀蛊) hidup di sebilah golok sebagai kilau mata pisau dan mampu menembus pertahanan setingkatnya, lalu perlu istirahat panjang. Ia mengikis bilahnya; di sini ia makan giok.
Bronze Skin Gu = Gu Kulit Perunggu
Bronze Skin Gu (铜皮蛊) coats the body in a bronze glow that turns blows aside, a close fighter's defence from the skin series. = Gu Kulit Perunggu (铜皮蛊) melapisi tubuh dengan cahaya perunggu yang menangkis pukulan, pertahanan petarung jarak dekat dari seri kulit.
Armoury Gu = Gu Gudang Senjata
Armoury Gu shapes its user's essence into whatever weapon the fight needs. The weapon path is young and canon names no mortal Gu for it; this one is the mod's invention. = Gu Gudang Senjata membentuk esensi penggunanya menjadi senjata apa pun yang dibutuhkan pertarungan. Jalur senjata masih muda dan kanon tak menyebut Gu fana untuknya; yang ini rekaan mod.
Killing Intent Gu = Gu Niat Membunuh
Killing Intent Gu sharpens at the scent of a wounded enemy. The killing path is still forming in canon and has no mortal Gu; this one is the mod's invention. = Gu Niat Membunuh makin tajam saat mencium musuh yang terluka. Jalur pembunuhan masih terbentuk dalam kanon dan tak punya Gu fana; yang ini rekaan mod.
Fiery Claw Gu = Gu Cakar Api
Fiery Claw Gu (火爪蛊) hurls a great three-fingered claw of flame; several claws can merge into a bigger blaze. = Gu Cakar Api (火爪蛊) melontarkan cakar api besar berjari tiga; beberapa cakar dapat menyatu menjadi kobaran yang lebih besar.
Water Shield Gu = Gu Perisai Air
Water Shield Gu (水罩蛊) wraps its user in a sphere of moving water that turns blows aside; it fails only when pinned against a wall. = Gu Perisai Air (水罩蛊) membungkus penggunanya dalam bola air yang bergerak dan membelokkan pukulan; ia gagal hanya bila terdesak ke dinding.
Heavenly Essence Treasure Lotus = Teratai Pusaka Esensi Langit
Heavenly Essence Treasure Lotus (天元宝莲) is a flower Gu that works like a pocket spirit spring, yielding primeval stones day after day; it pays for its keeper. = Teratai Pusaka Esensi Langit (天元宝莲) adalah Gu bunga yang bekerja seperti mata air roh saku, menghasilkan batu primordial hari demi hari; ia membiayai pemeliharanya.
Gruel Mud Gu = Gu Bubur Lumpur
Gruel Mud Gu (和稀泥蛊) softens earth into mud; common at low ranks, and used to raise whole towns. = Gu Bubur Lumpur (和稀泥蛊) melunakkan tanah menjadi lumpur; umum di tingkat rendah, dan dipakai untuk membangun kota.
Whirlwind Gu = Gu Angin Puyuh
Whirlwind Gu (旋风蛊) gives a short burst of speed and puts its momentum behind every strike. = Gu Angin Puyuh (旋风蛊) memberi ledakan kecepatan singkat dan menaruh dorongannya di balik setiap serangan.
Flying Cloud Gu = Gu Awan Terbang
Flying Cloud Gu (腾云蛊) lifts its user high on a cloud: a good climber, a poor turner. = Gu Awan Terbang (腾云蛊) mengangkat penggunanya tinggi di atas awan: pandai menanjak, buruk berbelok.
Frost Demon Gu = Gu Siluman Embun Beku
Frost Demon Gu (霜妖蛊) turns the arm into frosty ice for a piercing palm-blade; used too often, it hurts the joints. = Gu Siluman Embun Beku (霜妖蛊) mengubah lengan menjadi es beku untuk bilah telapak yang menusuk; terlalu sering dipakai, ia menyakiti sendi.
Thunderclap Gu = Gu Guntur Meledak
Thunderclap Gu (炸雷蛊) spits a fast, bursting thunderball, but never twice in a row. One was found on a lightning wolf king. = Gu Guntur Meledak (炸雷蛊) menyemburkan bola guntur yang cepat dan meledak, tetapi tak pernah dua kali berturut-turut. Satu ditemukan pada raja serigala petir.
Poison Scorpion Gu = Gu Kalajengking Racun
Poison Scorpion Gu (毒蝎蛊) stings to hold a slow poison in check: its victims need a new sting every seven days, which makes them obedient servants. = Gu Kalajengking Racun (毒蝎蛊) menyengat untuk menahan racun lambat: korbannya butuh sengatan baru setiap tujuh hari, yang menjadikan mereka pelayan penurut.
Little Light Gu = Gu Cahaya Kecil
Little Light Gu (小光蛊), a famous rank-one light Gu: it lights up the area and doubles the size of a moon blade. = Gu Cahaya Kecil (小光蛊), Gu cahaya tingkat satu yang terkenal: ia menerangi sekitar dan menggandakan ukuran bilah bulan.
Shadow Follower Gu = Gu Bayang Pengiring
Shadow Follower Gu (幽影随行蛊) cloaks its user in darkness; a flash of light breaks the cloak, and the Gu must rest. = Gu Bayang Pengiring (幽影随行蛊) menyelubungi penggunanya dalam kegelapan; kilatan cahaya memecah selubung itu, dan Gu harus beristirahat.
Overlapping Shadow Gu = Gu Bayangan Bertumpuk
Overlapping Shadow Gu (叠影蛊) layers shadow over shadow to strengthen an attack Gu. Canon files it under the dark path; the young shadow path borrows it here. = Gu Bayangan Bertumpuk (叠影蛊) menumpuk bayangan di atas bayangan untuk memperkuat Gu serangan. Kanon menggolongkannya ke jalur gelap; jalur bayangan yang masih muda meminjamnya di sini.
Star Dart Gu = Gu Panah Bintang
Star Dart Gu (星镖蛊), the commonest star Gu, throws a dart of starlight; hundreds of them make a star killer move. = Gu Panah Bintang (星镖蛊), Gu bintang yang paling umum, melempar panah cahaya bintang; ratusan dari mereka membentuk jurus pamungkas bintang.
Heaven Earth Magnificent Sound Gu = Gu Suara Agung Langit Bumi
Heaven Earth Magnificent Sound Gu (天地宏音蛊) looses a wide wave of sound for mass kills; long use can strip its user's voice. = Gu Suara Agung Langit Bumi (天地宏音蛊) melepaskan gelombang suara luas untuk pembantaian massal; pemakaian lama dapat merenggut suara penggunanya.
Illusory Moon Gu = Gu Bulan Ilusi
Illusory Moon Gu (幻影月蛊) makes an illusory double that draws attacks and confuses the enemy, a Gu Yue fusion of the moonlight line that eats moon orchids by the handful. = Gu Bulan Ilusi (幻影月蛊) menciptakan kembaran ilusi yang menarik serangan dan membingungkan musuh, leburan Gu Yue dari garis cahaya bulan yang melahap anggrek bulan segenggam demi segenggam.
Clear Mind Gu = Gu Pikiran Jernih
Clear Mind Gu (神清蛊) enters the head like a breeze, clearing and steadying the mind for deduction. = Gu Pikiran Jernih (神清蛊) masuk ke kepala seperti angin sepoi, menjernihkan dan menenangkan pikiran untuk penalaran.
Emotion Poetry Gu = Gu Puisi Perasaan
Emotion Poetry Gu (诗情蛊) stores a single emotion for later use; rare and costly. = Gu Puisi Perasaan (诗情蛊) menyimpan satu emosi untuk dipakai kelak; langka dan mahal.
Estrus Gu = Gu Birahi
Estrus Gu (发情蛊) bursts into a pink powder that drives beasts to breed, used to grow enslaved herds. Canon lists it in the emotion line from which enchantment split. = Gu Birahi (发情蛊) pecah menjadi serbuk merah muda yang mendorong binatang berkembang biak, dipakai untuk memperbanyak kawanan taklukan. Kanon mencantumkannya di garis emosi, asal jalur pesona.
Soul Search Gu = Gu Penggeledah Jiwa
Soul Search Gu (搜魂蛊) reads part of a captive's memories from his soul; the results are patchy, and overuse clouds the searcher's own mind. = Gu Penggeledah Jiwa (搜魂蛊) membaca sebagian ingatan tawanan dari jiwanya; hasilnya tambal-sulam, dan pemakaian berlebihan mengaburkan pikiran si penggeledah.
Dream Pillow Gu = Gu Bantal Mimpi
Dream Pillow Gu (梦枕蛊), set under the pillow, lets an ordinary Gu Master walk into his own dream realm to gather dream materials. = Gu Bantal Mimpi (梦枕蛊), diletakkan di bawah bantal, memungkinkan Gu Master biasa memasuki alam mimpinya sendiri untuk mengumpulkan bahan mimpi.
Wolf Enslavement Gu = Gu Penakluk Serigala
Wolf Enslavement Gu (驭狼蛊), planted in a wolf's soul, makes it obey for life; higher ranks hold a thousand-wolf or a ten-thousand-wolf king. = Gu Penakluk Serigala (驭狼蛊), ditanam di jiwa serigala, membuatnya patuh seumur hidup; tingkat yang lebih tinggi menundukkan raja seribu atau sepuluh ribu serigala.
Man as Before Gu = Gu Manusia Seperti Semula
Man as Before Gu (人如故蛊) turns a body back to its state of a short while ago, a near-complete healing. = Gu Manusia Seperti Semula (人如故蛊) mengembalikan tubuh ke keadaannya sesaat sebelumnya, penyembuhan yang hampir sempurna.
Warp Gu = Gu Pindah Ruang
Warp Gu (挪移蛊) tears space to move its user's body away; frequent use twists flesh and bone. = Gu Pindah Ruang (挪移蛊) merobek ruang untuk memindahkan tubuh penggunanya; pemakaian yang sering memelintir daging dan tulang.
Amplify Effect Gu = Gu Pelipat Daya
Amplify Effect Gu (功倍蛊) multiplies the effect of another Gu, at a higher essence cost. = Gu Pelipat Daya (功倍蛊) melipatgandakan efek Gu lain, dengan biaya esensi yang lebih tinggi.
Turn Phantom Gu = Gu Pengubah Maya
Turn Phantom Gu (弄虚蛊) makes a solid thing insubstantial, so attacks pass through it. Canon does not give its rank. = Gu Pengubah Maya (弄虚蛊) membuat benda padat menjadi tak berwujud, sehingga serangan menembusnya. Kanon tak menyebut tingkatnya.
Primeval Break Gu = Gu Pemutus Esensi
Primeval Break Gu (断元蛊) cuts a wild Gu off from primeval energy. Canon does not give its rank. = Gu Pemutus Esensi (断元蛊) memutus Gu liar dari energi primordial. Kanon tak menyebut tingkatnya.
Luck Inspection Gu = Gu Pengamat Untung
Luck Inspection Gu (察运蛊) shows the colour of a person's luck; the series reaches rank five. = Gu Pengamat Untung (察运蛊) memperlihatkan warna keberuntungan seseorang; serinya mencapai tingkat lima.
Ten-Year Lifespan Gu = Gu Umur Sepuluh Tahun
A ten-year Lifespan Gu (十年寿蛊): lifespan Gu add a set number of years of life, ten, a hundred, more. The heaven path rules them. = Gu Umur Sepuluh Tahun (十年寿蛊): Gu umur menambah sejumlah tahun hidup: sepuluh, seratus, lebih. Jalur langit menguasainya.
Strength Qi Gu = Gu Hawa Kekuatan
Strength Qi Gu (力气蛊) is a formless qi of strength that doubles or triples its user's battle strength for a while. = Gu Hawa Kekuatan (力气蛊) adalah hawa kekuatan tak berwujud yang menggandakan atau melipattigakan daya tempur penggunanya untuk sementara.
Revert Gu = Gu Pembalik
Revert Gu (幡然蛊) turns a fused Gu back into one of its ingredients, so a failed plan can be unpicked. Canon does not give its rank. = Gu Pembalik (幡然蛊) mengembalikan Gu leburan menjadi salah satu bahannya, sehingga rencana yang gagal bisa diurai. Kanon tak menyebut tingkatnya.
Formation Heart Gu = Gu Inti Formasi
Formation Heart Gu (阵心蛊) is the core of a Gu formation; every other Gu in it circles around it. = Gu Inti Formasi (阵心蛊) adalah inti formasi Gu; setiap Gu lain di dalamnya berputar mengelilinginya.
Four Flavours Liquor Worm = Cacing Arak Empat Rasa
Four Flavours Liquor Worm (四味酒虫), refined from two Liquor Worms and four wines (sour, sweet, bitter, spicy), does for rank-two essence what the Liquor Worm does for rank one. = Cacing Arak Empat Rasa (四味酒虫), dimurnikan dari dua Cacing Arak dan empat arak (asam, manis, pahit, pedas), berbuat bagi esensi tingkat dua seperti Cacing Arak bagi tingkat satu.
Pill Refiner Gu = Gu Peramu Pil
Pill Refiner Gu (炼丹师蛊) becomes a pill-refiner clone that refines pill Gu; canon calls it a human-path recipe born from a pill-path inheritance. = Gu Peramu Pil (炼丹师蛊) menjadi tiruan peramu pil yang memurnikan Gu pil; kanon menyebutnya resep jalur manusia yang lahir dari warisan jalur pil.
Flying Sword Letter Gu = Gu Surat Pedang Terbang
Flying Sword Letter Gu (飞剑传书蛊) is a sword-shaped messenger that carries a letter very fast. = Gu Surat Pedang Terbang (飞剑传书蛊) adalah pembawa pesan berbentuk pedang yang mengantar surat dengan sangat cepat.
Relic Gu = Gu Relik
Relic Gu (舍利蛊) raises a Gu Master by one small stage; there is one kind for every rank, green copper to purple crystal. = Gu Relik (舍利蛊) menaikkan seorang Gu Master satu tahap kecil; ada satu jenis untuk tiap tingkat, dari tembaga hijau sampai kristal ungu.
Painting Idea Gu = Gu Gagasan Lukisan
Painting Idea Gu (画意蛊) turns a sight into a scene etched in memory. Canon files it under wisdom; only its name points to painting. = Gu Gagasan Lukisan (画意蛊) mengubah pemandangan menjadi adegan yang terukir di ingatan. Kanon menggolongkannya ke jalur kebijaksanaan; hanya namanya yang menunjuk ke lukisan.
Plunder Gu = Gu Perampas
Plunder Gu (强取蛊) tears a Gu away from an enemy while its user stands still; the odds are low, and failure strikes back. = Gu Perampas (强取蛊) merenggut Gu dari musuh sementara penggunanya berdiri diam; peluangnya kecil, dan kegagalan berbalik menyerang.
Strength Hall = Aula Jalur Kekuatan
The clan's strength-path hall: every Gu Master trained in this city starts as a Strength Master. Needs the Strength Path policy branch. = Aula jalur Kekuatan milik klan: setiap Gu Master yang dilatih di kota ini langsung menjadi Ahli Jalur Kekuatan. Butuh cabang kebijakan Jalur Kekuatan.
Transformation Hall = Aula Jalur Transformasi
The clan's transformation-path hall: every Gu Master trained in this city starts as a Transformation Master. Needs the Transformation Path policy branch. = Aula jalur Transformasi milik klan: setiap Gu Master yang dilatih di kota ini langsung menjadi Ahli Jalur Transformasi. Butuh cabang kebijakan Jalur Transformasi.
Transformation Path = Jalur Transformasi
The transformation path (变化道) as a clan's tradition (Body & Beast): its Masters grow with every policy of the branch, and it opens the Transformation Hall. = Jalur Transformasi (变化道) sebagai tradisi klan (Tubuh & Binatang): para Ahlinya menguat dengan setiap kebijakan cabang ini, dan cabang ini membuka Aula Jalur Transformasi.
Transformation Path Complete = Jalur Transformasi Tuntas
Transformation Lineage = Garis Keturunan Transformasi
Transformation Insight = Wawasan Transformasi
Transformation Doctrine = Doktrin Transformasi
A policy of the Transformation Path: its Masters defend 15% harder. = Kebijakan cabang Jalur Transformasi: para Ahlinya bertahan 15% lebih kuat.
A policy of the Transformation Path: +1 production in every city. = Kebijakan cabang Jalur Transformasi: +1 produksi di setiap kota.
A policy of the Transformation Path: its Masters heal 15 HP when they kill. = Kebijakan cabang Jalur Transformasi: para Ahlinya pulih 15 HP saat membunuh.
Completing the branch: its Masters heal 10 HP more. = Menuntaskan cabang ini: para Ahlinya pulih 10 HP lebih banyak.
Bone Hall = Aula Jalur Tulang
The clan's bone-path hall: every Gu Master trained in this city starts as a Bone Master. Needs the Bone Path policy branch. = Aula jalur Tulang milik klan: setiap Gu Master yang dilatih di kota ini langsung menjadi Ahli Jalur Tulang. Butuh cabang kebijakan Jalur Tulang.
Bone Path = Jalur Tulang
The bone path (骨道) as a clan's tradition (Body & Beast): its Masters grow with every policy of the branch, and it opens the Bone Hall. = Jalur Tulang (骨道) sebagai tradisi klan (Tubuh & Binatang): para Ahlinya menguat dengan setiap kebijakan cabang ini, dan cabang ini membuka Aula Jalur Tulang.
Bone Path Complete = Jalur Tulang Tuntas
Bone Lineage = Garis Keturunan Tulang
Bone Insight = Wawasan Tulang
Bone Doctrine = Doktrin Tulang
A policy of the Bone Path: its Masters defend 15% harder. = Kebijakan cabang Jalur Tulang: para Ahlinya bertahan 15% lebih kuat.
A policy of the Bone Path: +1 production in every city. = Kebijakan cabang Jalur Tulang: +1 produksi di setiap kota.
A policy of the Bone Path: its Masters heal 15 HP when they kill. = Kebijakan cabang Jalur Tulang: para Ahlinya pulih 15 HP saat membunuh.
Blood Hall = Aula Jalur Darah
The clan's blood-path hall: every Gu Master trained in this city starts as a Blood Master. Needs the Blood Path policy branch. = Aula jalur Darah milik klan: setiap Gu Master yang dilatih di kota ini langsung menjadi Ahli Jalur Darah. Butuh cabang kebijakan Jalur Darah.
Blood Path = Jalur Darah
The blood path (血道) as a clan's tradition (Body & Beast): its Masters grow with every policy of the branch, and it opens the Blood Hall. = Jalur Darah (血道) sebagai tradisi klan (Tubuh & Binatang): para Ahlinya menguat dengan setiap kebijakan cabang ini, dan cabang ini membuka Aula Jalur Darah.
Blood Path Complete = Jalur Darah Tuntas
Blood Lineage = Garis Keturunan Darah
Blood Insight = Wawasan Darah
Blood Doctrine = Doktrin Darah
A policy of the Blood Path: its Masters defend 15% harder. = Kebijakan cabang Jalur Darah: para Ahlinya bertahan 15% lebih kuat.
A policy of the Blood Path: +1 production in every city. = Kebijakan cabang Jalur Darah: +1 produksi di setiap kota.
A policy of the Blood Path: its Masters heal 15 HP when they kill. = Kebijakan cabang Jalur Darah: para Ahlinya pulih 15 HP saat membunuh.
Sword Hall = Aula Jalur Pedang
The clan's sword-path hall: every Gu Master trained in this city starts as a Sword Master. Needs the Sword Path policy branch. = Aula jalur Pedang milik klan: setiap Gu Master yang dilatih di kota ini langsung menjadi Ahli Jalur Pedang. Butuh cabang kebijakan Jalur Pedang.
Sword Path = Jalur Pedang
The sword path (剑道) as a clan's tradition (Edge & War): its Masters grow with every policy of the branch, and it opens the Sword Hall. = Jalur Pedang (剑道) sebagai tradisi klan (Mata Pisau & Perang): para Ahlinya menguat dengan setiap kebijakan cabang ini, dan cabang ini membuka Aula Jalur Pedang.
Sword Path Complete = Jalur Pedang Tuntas
Sword Lineage = Garis Keturunan Pedang
Sword Insight = Wawasan Pedang
Sword Doctrine = Doktrin Pedang
A policy of the Sword Path: its Masters attack 15% harder. = Kebijakan cabang Jalur Pedang: para Ahlinya menyerang 15% lebih kuat.
A policy of the Sword Path: military units are built 10% faster. = Kebijakan cabang Jalur Pedang: unit militer dibangun 10% lebih cepat.
A policy of the Sword Path: its Masters move 1 tile farther. = Kebijakan cabang Jalur Pedang: para Ahlinya bergerak 1 petak lebih jauh.
Completing the branch: its Masters fight 15% harder against cities. = Menuntaskan cabang ini: para Ahlinya bertarung 15% lebih kuat melawan kota.
Blade Hall = Aula Jalur Golok
The clan's blade-path hall: every Gu Master trained in this city starts as a Blade Master. Needs the Blade Path policy branch. = Aula jalur Golok milik klan: setiap Gu Master yang dilatih di kota ini langsung menjadi Ahli Jalur Golok. Butuh cabang kebijakan Jalur Golok.
Blade Path = Jalur Golok
The blade path (刀道) as a clan's tradition (Edge & War): its Masters grow with every policy of the branch, and it opens the Blade Hall. = Jalur Golok (刀道) sebagai tradisi klan (Mata Pisau & Perang): para Ahlinya menguat dengan setiap kebijakan cabang ini, dan cabang ini membuka Aula Jalur Golok.
Blade Path Complete = Jalur Golok Tuntas
Blade Lineage = Garis Keturunan Golok
Blade Insight = Wawasan Golok
Blade Doctrine = Doktrin Golok
