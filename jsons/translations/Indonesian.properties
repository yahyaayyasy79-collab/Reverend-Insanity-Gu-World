A marsh slows every step. Clear it (Remove Marsh) before building on the tile. = Rawa memperlambat setiap langkah. Bersihkan dulu (Hapus Rawa) sebelum membangun di petak ini.

# Paths: tiers, killer moves, statuses (data/paths*.csv, tools/gen_paths.py)
Every other path this unit holds costs Strength: dao marks interfere = Setiap jalur lain yang dipegang unit ini memotong Kekuatan: jejak dao saling mengganggu
Strength Master = Ahli Jalur Kekuatan
Strength path (力道), Master attainment (大师): a tempered body keeps its force while hurt. +10% strength. Signature: no penalty for wounds. Hit: each attack inflicts Guard Broken for 2 turns (dao marks I-V: 2/2/3/3/4). = Jalur Kekuatan (力道), pencapaian Ahli (大师): tubuh yang ditempa tetap bertenaga saat terluka. +10% kekuatan. Ciri khas: tanpa penalti saat terluka. Serangan: tiap serangan menimbulkan Pertahanan Jebol selama 2 giliran (jejak dao I-V: 2/2/3/3/4).
Strength Grandmaster = Mahaguru Jalur Kekuatan
Strength path, Grandmaster attainment (宗师): deep enough to bend other paths' methods to its own Gu. Opens the killer move Self-Reliance. +15% strength; unlocks: each attack takes 1 movement from the target. = Jalur Kekuatan, pencapaian Mahaguru (宗师): cukup dalam untuk meminjam cara jalur lain dengan Gu sendiri. Membuka jurus pamungkas Berdiri Sendiri. +15% kekuatan; membuka: tiap serangan merampas 1 gerak sasaran.
Strength Great Grandmaster = Mahaguru Agung Jalur Kekuatan
Strength path, Great Grandmaster attainment (大宗师): where most rank-eight immortals end; a rank-six immortal that reaches it opens the immortal killer move Myriad Self (5 green grape essence). +20% strength; adds: domain: enemies beside it fight 10% weaker. = Jalur Kekuatan, pencapaian Mahaguru Agung (大宗师): tempat kebanyakan abadi tingkat delapan berhenti; abadi tingkat enam yang mencapainya membuka jurus pamungkas abadi Sepuluh Ribu Diri (5 esensi anggur hijau). +20% kekuatan; menambah: domain: musuh di sampingnya bertarung 10% lebih lemah.
Strength Supreme Grandmaster = Mahaguru Tertinggi Jalur Kekuatan
