Self-Reliance = Berdiri Sendiri
Self-Reliance (自力更生): a strength-path killer move for one turn: +25% Strength; each attack inflicts Guard Broken for 4 turns. = Berdiri Sendiri (自力更生): jurus pamungkas jalur Kekuatan selama satu giliran: +25% Kekuatan; tiap serangan menimbulkan Pertahanan Jebol selama 4 giliran.
