# Civilopedia (data/civilopedia.csv)
Rank one and rank two (一转、二转): green-copper essence, then red-iron. Most Gu Masters never climb higher; a clan is judged by how many it can keep fed. = Tingkat satu dan dua (一转、二转): esensi tembaga hijau, lalu besi merah. Kebanyakan Gu Master tak pernah naik lebih tinggi; sebuah klan dinilai dari berapa banyak yang sanggup ia beri makan.
Rank three (三转): white-silver essence. Elders of this rank hold a mountain clan together, and losing one costs more than losing a village. = Tingkat tiga (三转): esensi perak putih. Para tetua setingkat ini menyatukan klan gunung, dan kehilangan satu orang lebih mahal daripada kehilangan sebuah desa.
Rank four (四转): yellow-gold essence. On Qing Mao such a master leads a clan; his upkeep decides whether the clan survives him. = Tingkat empat (四转): esensi emas kuning. Di Qing Mao, master seperti ini memimpin sebuah klan; biaya hidupnya memutuskan apakah klan sanggup bertahan.
Each year the clan opens the apertures of its youths (开窍) with a Hope Gu. The ones who open become Gu Masters; the rest stay mortal and work. = Setiap tahun klan membuka apertur para pemudanya (开窍) dengan Gu Harapan. Yang terbuka menjadi Gu Master; sisanya tetap manusia fana dan bekerja.
Primeval stones come out of spirit springs. A clan that cannot tap its spring cannot pay its Gu Masters, so this knowledge comes before almost everything else. = Batu primordial keluar dari mata air roh. Klan yang tak mampu menyadap mata airnya tak mampu membayar Gu Masternya, jadi ilmu ini datang sebelum hampir segalanya.
Every Gu eats one food and nothing else (养蛊). Raising Gu is bookkeeping: count the mouths, count the food, and never let the second number fall below the first. = Setiap Gu hanya memakan satu jenis makanan (养蛊). Memelihara Gu adalah urusan pembukuan: hitung mulutnya, hitung makanannya, dan jangan biarkan angka kedua di bawah yang pertama.
Villages brew wine (酿酒) for mortals and for the Gu that drink it. A jar of good wine has bought more than one Gu Master's loyalty. = Desa-desa membuat arak (酿酒) untuk manusia fana dan untuk Gu yang meminumnya. Sebuah guci arak yang baik pernah membeli kesetiaan lebih dari satu Gu Master.
Gu are refined (炼蛊) from a recipe and its materials, with the Gu Master's own essence worn into them. A failed refinement wastes every material and stone put into it; nobody refunds the loss. = Gu dimurnikan (炼蛊) dari resep dan bahan-bahannya, dengan esensi Gu Master sendiri yang dituangkan ke dalamnya. Pemurnian yang gagal menghabiskan semua bahan dan batu yang dimasukkan; tak ada yang mengganti kerugiannya.
The step from rank one to rank two. Essence turns from copper to iron, and so does the price of keeping the cultivator alive. = Langkah dari tingkat satu ke tingkat dua. Esensi berubah dari tembaga menjadi besi, begitu pula harga untuk membuat sang kultivator tetap hidup.
Formations (蛊阵) bind many Gu and a store of primeval stones into one structure. Qing Mao's villages still trusted their stockade walls; a clan that learns formations holds what walls cannot. = Formasi (蛊阵) mengikat banyak Gu dan simpanan batu primordial menjadi satu bangunan. Desa-desa Qing Mao masih mengandalkan tembok benteng; klan yang menguasai formasi mampu menahan apa yang tak sanggup ditahan tembok.
The step to rank three. Few reach it, and a clan spends years of stones on each one who does. = Langkah menuju tingkat tiga. Hanya sedikit yang mencapainya, dan klan menghabiskan batu bertahun-tahun untuk setiap orang yang berhasil.
Merchant clans send caravans (商队) up the mountain with goods, Gu and news. Their protection is paid for, and their prices are not negotiable. = Klan pedagang mengirim kafilah (商队) ke atas gunung membawa barang, Gu, dan kabar. Perlindungan mereka dibayar, dan harga mereka tak bisa ditawar.
Dead Gu Masters leave inheritances behind: stores, techniques, trials. Every inheritance has a reason to exist, and the reason is rarely the heir's welfare. = Gu Master yang telah mati meninggalkan warisan: simpanan, teknik, ujian. Setiap warisan punya alasan untuk ada, dan alasannya jarang demi kebaikan sang pewaris.
Several Gu used together in one technique make a killer move, stronger than any of them alone. The cost is paid in essence, and the essence comes from stones. = Beberapa Gu yang digunakan bersama dalam satu teknik membentuk jurus pamungkas, lebih kuat daripada masing-masingnya. Biayanya dibayar dengan esensi, dan esensi berasal dari batu.
The great clans of the Southern Border (超级家族) dwarf any mountain village, and the Shang clan runs a whole market city. Trade is how they turn other people's wars into their own income. = Klan-klan besar Perbatasan Selatan (超级家族) jauh melampaui desa gunung mana pun, dan klan Shang menjalankan sebuah kota pasar utuh. Perdagangan adalah cara mereka mengubah perang orang lain menjadi penghasilan mereka sendiri.
Some Gu Masters bind beasts to their will (奴道). A captured wolf is an army that never complains, as long as it is fed. = Sebagian Gu Master mengikat binatang buas pada kehendak mereka (奴道). Serigala tawanan adalah pasukan yang tak pernah mengeluh, selama ia diberi makan.
The step to rank four. On a mountain of three villages, a single rank-four master is a deciding weight. = Langkah menuju tingkat empat. Di gunung dengan tiga desa, seorang master tingkat empat saja sudah menjadi penentu.
Insight into the Great Dao (悟道) has no end. Each step teaches how little the previous one understood. = Pemahaman tentang Dao Agung (悟道) tak berujung. Setiap langkah mengajarkan betapa sedikit yang dipahami langkah sebelumnya.
A branch family sent out to raise a new village under the clan's name. It carries the clan's claim, and nothing to defend it with. = Keluarga cabang yang dikirim untuk mendirikan desa baru atas nama klan. Ia membawa klaim klan, dan tak ada apa pun untuk mempertahankannya.
Mortals (凡人) whose apertures never opened farm, mine and haul for the Gu Masters. They outnumber the cultivators and matter less to them. = Manusia fana (凡人) yang aperturnya tak pernah terbuka bertani, menambang, dan mengangkut untuk para Gu Master. Jumlah mereka lebih banyak, nilai mereka di mata kultivator lebih kecil.
A freshly awakened youth (一转蛊师) with a first Gu from the academy. Cheap, numerous and expendable: the clan learns which ones are worth feeding. = Pemuda yang baru terbangun (一转蛊师) dengan Gu pertamanya dari akademi. Murah, banyak, dan mudah dikorbankan: klan belajar mana yang layak diberi makan.
A rank-two strength cultivator (二转力道蛊师) who grafts beast strength onto the body. Hits harder than a moon cultivator and costs more to keep. = Kultivator kekuatan tingkat dua (二转力道蛊师) yang menanamkan kekuatan binatang ke tubuhnya. Memukul lebih keras daripada kultivator bulan dan lebih mahal dipelihara.
A rank-three strength cultivator (三转力道蛊师), able to stand against a beast pack alone. Every fight it wins is paid for in pork and stones. = Kultivator kekuatan tingkat tiga (三转力道蛊师), sanggup menghadapi sekawanan binatang seorang diri. Setiap pertarungan yang dimenangkannya dibayar dengan daging babi dan batu.
A rank-four strength master (四转力道蛊师), a siege engine that walks. Few clans can afford one for long. = Master kekuatan tingkat empat (四转力道蛊师), mesin pengepung yang berjalan. Hanya sedikit klan yang sanggup memeliharanya lama.
A rank-two moon cultivator (二转月道蛊师). It opens every clash with a moon blade, the Gu Yue way, and then fights up close. = Kultivator bulan tingkat dua (二转月道蛊师). Ia membuka setiap bentrokan dengan bilah bulan, cara Gu Yue, lalu bertarung jarak dekat.
A rank-three moon cultivator (三转月道蛊师) whose first blade often decides the fight before it begins. Lighter than a strength master, and cheaper to feed. = Kultivator bulan tingkat tiga (三转月道蛊师) yang bilah pertamanya sering menentukan pertarungan sebelum dimulai. Lebih ringan daripada master kekuatan, dan lebih murah diberi makan.
A rank-four moon master (四转月道蛊师), the pride of a moonlit clan. Its upkeep is the price of that pride. = Master bulan tingkat empat (四转月道蛊师), kebanggaan klan bulan. Biaya hidupnya adalah harga kebanggaan itu.
Lightning wolves (电狼) hunt in packs of thousands on the Southern Border. One is a nuisance; a tide of them empties villages. = Serigala petir (电狼) berburu dalam kawanan ribuan ekor di Perbatasan Selatan. Seekor saja menyusahkan; segelombang dari mereka mengosongkan desa.
A calf-sized lightning wolf (豪电狼) that leads a hundred others. Kill it and the pack around it falters. = Serigala petir sebesar anak sapi (豪电狼) yang memimpin seratus serigala lain. Bunuh dia dan kawanan di sekitarnya goyah.
A king of ten thousand beasts (雷冠头狼), as big as a hill, its head fur bristling up into a crown. When one comes down the mountain, the village either holds or ceases to exist. = Raja sepuluh ribu binatang (雷冠头狼), sebesar bukit, bulu kepalanya tegak membentuk mahkota. Saat ia turun gunung, desa itu bertahan atau lenyap.
Grade A aptitude (甲等资质): an essence sea that fills most of the aperture and refills fast. Rare, prized, and watched closely by everyone. = Bakat tingkat A (甲等资质): lautan esensi yang mengisi sebagian besar apertur dan cepat pulih. Langka, berharga, dan diawasi ketat oleh semua orang.
Grade B aptitude (乙等资质): a solid essence sea. The backbone of a clan's next generation. = Bakat tingkat B (乙等资质): lautan esensi yang kokoh. Tulang punggung generasi berikutnya sebuah klan.
Grade C aptitude (丙等资质): an ordinary essence sea. Ordinary is enough, for those willing to work for it. = Bakat tingkat C (丙等资质): lautan esensi biasa. Biasa itu cukup, bagi yang mau bekerja untuknya.
Grade D aptitude (丁等资质): a shallow essence sea that refills slowly. Such students eat more stones and are given fewer chances. = Bakat tingkat D (丁等资质): lautan esensi dangkal yang lambat pulih. Murid seperti ini menghabiskan lebih banyak batu dan diberi lebih sedikit kesempatan.
The Gu Master spends hard-won insight on a refinement attempt. Success climbs one rung; failure keeps the cost. = Gu Master menghabiskan pemahaman yang diraih dengan susah payah untuk satu percobaan pemurnian. Berhasil naik satu anak tangga; gagal tetap membayar harganya.
Moonlight Gu (月光蛊), the Gu Yue emblem, throws blades of moonlight and eats moon orchid petals. Bred only by the clan's own method. = Gu Cahaya Bulan (月光蛊), lambang Gu Yue, melempar bilah cahaya bulan dan memakan kelopak anggrek bulan. Hanya dibiakkan dengan cara rahasia klan itu sendiri.
White Boar Gu (白豕蛊) rebuilds its user's body until it carries one boar's strength. It eats pork, and the strength lasts only while the Gu lives (fusing it into White Jade Gu keeps it). = Gu Babi Putih (白豕蛊) membangun ulang tubuh penggunanya hingga memiliki kekuatan seekor babi. Ia memakan daging babi, dan kekuatannya hanya bertahan selama Gu itu hidup (peleburan menjadi Gu Giok Putih mempertahankannya).
Black Boar Gu (黑豕蛊), the white one's twin: a second boar's strength that stacks with the first. The merchant caravans sell it to whoever pays most. = Gu Babi Hitam (黑豕蛊), kembaran yang putih: kekuatan seekor babi kedua yang bertumpuk dengan yang pertama. Kafilah pedagang menjualnya kepada siapa pun yang membayar paling mahal.
Jade Skin Gu (玉皮蛊) wraps its user in a pale-green skin of jade, and eats jade to keep it. The cap of an unpathed Gu Master, and an ingredient for those who go further. = Gu Kulit Giok (玉皮蛊) membungkus penggunanya dengan kulit giok hijau pucat, dan memakan giok untuk mempertahankannya. Puncak bagi Gu Master tanpa jalur, dan bahan bagi yang melangkah lebih jauh.
Liquor Worm (酒虫) drinks wine and refines a rank-one Gu Master's essence. Above rank one it is useless unless refined further, into the Four Flavours Liquor Worm (四味酒虫). = Cacing Arak (酒虫) meminum arak dan memurnikan esensi Gu Master tingkat satu. Di atas tingkat satu ia tak berguna, kecuali dimurnikan lebih lanjut menjadi Cacing Arak Empat Rasa (四味酒虫).
White Jade Gu (白玉蛊) is fused from a boar Gu and a jade-skin Gu. The boar's strength stays in the body; the jade light hardens; the appetite for jade doubles. = Gu Giok Putih (白玉蛊) dilebur dari Gu babi dan Gu kulit giok. Kekuatan babi tetap tinggal di tubuh; cahaya gioknya mengeras; nafsu makan gioknya berlipat dua.
Moon Raiment (月霓裳) is fused from a Moonlight Gu and a Jade Skin Gu: a garment of moonlight that shields its wearer and steadies the allies nearby. It still eats moon orchids, and it starves like any other Gu. = Jubah Bulan (月霓裳) dilebur dari Gu Cahaya Bulan dan Gu Kulit Giok: pakaian cahaya bulan yang melindungi pemakainya dan menguatkan sekutu di dekatnya. Ia tetap memakan anggrek bulan, dan bisa kelaparan seperti Gu lainnya.
A killer move (杀招): the unit's Gu strike together as one technique. It rests on a core Gu, here its rank-two fusion Gu, and is lost if that core dies. = Jurus pamungkas (杀招): Gu milik unit itu menyerang bersama sebagai satu teknik. Ia bertumpu pada satu Gu inti, di sini Gu leburan tingkat duanya, dan hilang bila Gu inti itu mati.
Bear Strength Gu (熊力蛊), the Xiong emblem, lends its user a bear's strength. The Xiong clan has little else and needs little else. = Gu Kekuatan Beruang (熊力蛊), lambang Xiong, meminjamkan kekuatan beruang kepada penggunanya. Klan Xiong tak punya banyak hal lain dan tak butuh banyak hal lain.
Stream Gu (溪流蛊), the Bai emblem, named for running water. The Bai clan favours water and ice Gu. = Gu Aliran Sungai (溪流蛊), lambang Bai, dinamai dari air yang mengalir. Klan Bai mengutamakan Gu air dan es.
The moon orchids have run out and the Gu are starving. If the orchids do not return in time, some of them will not survive the wait. = Anggrek bulan habis dan para Gu kelaparan. Jika anggrek tak kembali tepat waktu, sebagian dari mereka tak akan selamat menunggu.
The pork has run out and the boar Gu are starving. A starving Gu does not fight, and a Gu that starves long enough dies. = Daging babi habis dan Gu babi kelaparan. Gu yang kelaparan tidak bertarung, dan Gu yang kelaparan cukup lama akan mati.
The jade has run out and the jade Gu are starving. Rank-two Gu last longer than rank-one Gu, but not forever. = Giok habis dan Gu giok kelaparan. Gu tingkat dua bertahan lebih lama daripada Gu tingkat satu, tapi tidak selamanya.
The wine has run out and the Liquor Worm is starving. It will not wait long. = Arak habis dan Cacing Arak kelaparan. Ia tak akan menunggu lama.
The clan head's pavilion (家主阁) at the heart of the village, with the ancestral hall inside. Whoever sits in it decides who gets stones and who gets none. = Paviliun kepala klan (家主阁) di jantung desa, dengan aula leluhur di dalamnya. Siapa pun yang duduk di sana memutuskan siapa yang mendapat batu dan siapa yang tidak.
The clan's own spring (元泉), where the yearly awakening is held. The deeper a youth walks into the spring's pressure, the better the grade; a clan without its spring awakens blind. = Mata air milik klan (元泉), tempat upacara kebangkitan tahunan diadakan. Semakin dalam seorang pemuda melangkah melawan tekanan mata air, semakin baik tingkatnya; klan tanpa mata airnya membangkitkan dengan buta.
Gu Yue's sea of moon orchids around the clan spring (花海): food for every Moonlight Gu and the stage of the awakening. The clan guards it more closely than its treasury. = Lautan anggrek bulan milik Gu Yue di sekitar mata air klan (花海): makanan bagi setiap Gu Cahaya Bulan dan panggung upacara kebangkitan. Klan menjaganya lebih ketat daripada perbendaharaannya.
The clan school (学堂). Every new student picks a first Gu from its Gu room, and those who stay cultivate there between battles. = Sekolah klan (学堂). Setiap murid baru memilih Gu pertamanya dari ruang Gu, dan yang tinggal berkultivasi di sana di antara pertempuran.
Mortal servants grow and gather the foods the clan's Gu eat. Unglamorous, and the reason the clan's Gu are still alive. = Pelayan fana menanam dan mengumpulkan makanan untuk Gu milik klan. Tak gemerlap, dan menjadi alasan Gu klan masih hidup.
A village tavern (酒肆) selling wine to mortals and Gu Masters alike. It also feeds the Liquor Worm and hears every rumour. = Kedai arak desa (酒肆) yang menjual arak kepada manusia fana maupun Gu Master. Ia juga memberi makan Cacing Arak dan mendengar setiap kabar burung.
A sealed, quiet room stocked with materials and spare stones, where a Gu Master can pour essence into a recipe undisturbed. Careful refinement happens here, at a price; reckless refinement happens anywhere. = Ruang tertutup yang tenang, penuh bahan dan batu cadangan, tempat Gu Master bisa menuangkan esensi ke dalam resep tanpa gangguan. Pemurnian yang hati-hati terjadi di sini, dengan harga; pemurnian nekat terjadi di mana saja.
The stockade wall (寨墙) of a mountain village, manned by Gu Masters and elders when beasts or rivals come. Every Qing Mao village trusts its wall; a formation, if the clan ever learns one, is raised behind it. = Tembok benteng (寨墙) desa gunung, dijaga para Gu Master dan tetua saat binatang buas atau saingan datang. Setiap desa Qing Mao mengandalkan temboknya; formasi, bila klan itu kelak menguasainya, dibangun di baliknya.
The Wu clan's battle stage (演武场), the largest in the Southern Border. Its Gu Masters fight each other until they no longer lose to anyone else. = Panggung laga klan Wu (演武场), yang terbesar di Perbatasan Selatan. Para Gu Masternya saling bertarung hingga tak lagi kalah dari siapa pun.
A shop (商铺) where caravans trade Gu, materials and stones. Everything here has a price, including information. = Toko (商铺) tempat kafilah memperdagangkan Gu, bahan, dan batu. Segala sesuatu di sini punya harga, termasuk informasi.
The hidden inheritance of a demonic Gu Master who died on Qing Mao (花酒行者传承). Its heir gains jade, insight and strength, and inherits a grudge: its last prize ruins the heir's own spring. = Warisan tersembunyi seorang Gu Master iblis yang mati di Qing Mao (花酒行者传承). Pewarisnya mendapat giok, pemahaman, dan kekuatan, sekaligus mewarisi dendam: hadiah terakhirnya merusak mata air sang pewaris sendiri.
The Southern Border's great market city (商家城), where even demonic loot changes hands. The Shang clan does not ask where the goods came from. = Kota pasar besar Perbatasan Selatan (商家城), tempat bahkan jarahan iblis berpindah tangan. Klan Shang tidak bertanya dari mana barang itu berasal.
A spring of heaven-and-earth energy (灵泉) that yields primeval stones. Every Qing Mao clan built its village on one; whoever loses its spring loses its future. = Mata air energi langit dan bumi (灵泉) yang menghasilkan batu primordial. Setiap klan di Qing Mao membangun desanya di atas satu mata air; siapa yang kehilangan mata airnya kehilangan masa depannya.
Moon orchids (月兰花), whose petals feed the Moonlight Gu. A Moon clan without them has blades that will not cut. = Anggrek bulan (月兰花), yang kelopaknya menjadi makanan Gu Cahaya Bulan. Klan Bulan tanpanya memiliki bilah yang tak bisa memotong.
Wild boars (野猪) of the Qing Mao forests: pork for the boar Gu, tusks for the refiner. Strength clans count them like stones. = Babi hutan (野猪) di hutan Qing Mao: daging untuk Gu babi, taring untuk penempa. Klan kekuatan menghitungnya seperti menghitung batu.
Fine jade (玉石), the food of the jade-skin Gu and the price of every rank-two fusion. Both paths need it, so both paths fight for it. = Giok halus (玉石), makanan Gu kulit giok dan harga setiap peleburan tingkat dua. Kedua jalur membutuhkannya, jadi kedua jalur memperebutkannya.
Brewed wine (酒), drunk by villagers and by the Liquor Worm. Brewed in taverns, never found in the wild. = Arak (酒) buatan, diminum penduduk desa dan Cacing Arak. Dibuat di kedai, tak pernah ditemukan di alam liar.
Pelts of Southern Border beasts, sold by caravans. The only comfort the mountain offers for free, once someone has killed for it. = Kulit binatang Perbatasan Selatan, dijual oleh kafilah. Satu-satunya kenyamanan yang gunung berikan cuma-cuma, setelah seseorang membunuh demi itu.
Mortal fields that feed the village. Nobody writes songs about them. = Ladang manusia fana yang memberi makan desa. Tak ada yang menulis lagu tentangnya.
Shafts dug into the hills by mortal hands. Jade comes out of some of them. = Lubang tambang yang digali di bukit oleh tangan manusia fana. Giok keluar dari sebagian di antaranya.
The sealed cave in which a clan keeps and taps its spring. Raiders know exactly what it is worth. = Gua tertutup tempat klan menjaga dan menyadap mata airnya. Para penjarah tahu persis berapa nilainya.
Tended beds of moon orchids and other crops. Gu are fed from here. = Petak tanaman anggrek bulan dan tanaman lain yang dirawat. Gu diberi makan dari sini.
A hunters' lodge in the forest. Boar and furs come out of it; sometimes the hunters do not. = Pondok pemburu di hutan. Babi dan bulu binatang keluar dari sana; terkadang para pemburunya tidak.
Mountain paths between villages. They carry caravans, armies and wolves alike. = Jalan setapak gunung di antara desa-desa. Dilalui kafilah, pasukan, dan serigala sama saja.
The den of a beast group (兽巢). Packs keep coming out of it until someone clears it. = Sarang kawanan binatang (兽巢). Kawanan terus keluar darinya sampai seseorang membersihkannya.
A dead Gu Master's sealed legacy (传承). It rewards the lucky and the prepared, and punishes the rest. = Warisan tersegel seorang Gu Master yang telah mati (传承). Ia memberi hadiah kepada yang beruntung dan yang siap, dan menghukum sisanya.
The righteous path (正道): clan law, alliances and a respectable face. Righteous clans kill as readily as demonic ones; they keep better records of why. = Jalan lurus (正道): hukum klan, aliansi, dan wajah yang terhormat. Klan lurus membunuh sama mudahnya dengan klan iblis; mereka hanya mencatat alasannya dengan lebih rapi.
Strict clan law (族规) keeps members in line. Obedience is cheaper than unrest. = Hukum klan yang ketat (族规) menjaga anggota tetap patuh. Kepatuhan lebih murah daripada kerusuhan.
Righteous clans band together against a shared threat, and keep count of who owes whom. Small clans remember who paid them. = Klan-klan lurus bersatu melawan ancaman bersama, dan tetap mencatat siapa berutang kepada siapa. Klan kecil mengingat siapa yang membayar mereka.
A righteous village is held, not abandoned. Its walls and its defenders are built for that. = Desa lurus dipertahankan, bukan ditinggalkan. Tembok dan para pembelanya dibangun untuk itu.
A stable clan feeds its Gu efficiently. Order is a resource too. = Klan yang stabil memberi makan Gu-nya dengan efisien. Ketertiban juga merupakan sumber daya.
The demonic path (魔道): take what you need by force and trust no one. It pays well and makes enemies faster than it makes stones. = Jalan iblis (魔道): ambil apa yang kau butuhkan dengan paksa dan jangan percaya siapa pun. Jalan ini menguntungkan, tapi menciptakan musuh lebih cepat daripada menghasilkan batu.
Demonic Gu Masters strip whatever they overrun. Nothing left behind is wasted. = Gu Master iblis melucuti apa saja yang mereka lindas. Tak ada yang tertinggal yang terbuang percuma.
A lone cultivator (散修) has no clan behind them, and on the Southern Border every demonic Gu Master is one: few, strong, travelling light, owing nothing to anyone. Every new village they hold is one more place to be betrayed. = Kultivator lepas (散修) tak punya klan di belakangnya, dan di Perbatasan Selatan setiap Gu Master iblis adalah kultivator lepas: sedikit, kuat, bepergian ringan, tak berutang pada siapa pun. Setiap desa baru yang mereka kuasai adalah satu tempat lagi untuk dikhianati.
War feeds the Gu; peace starves them; mortals pay either way. A captured village pays for the war that took it. = Perang memberi makan Gu; damai membuat mereka kelaparan; manusia fana membayar dalam kedua keadaan. Desa yang direbut membayar perang yang merebutnya.
Strike first and strike hardest. The second blow is for those who missed the first. = Serang lebih dulu dan serang paling keras. Pukulan kedua hanya untuk mereka yang meleset di pukulan pertama.
The moon path (月道): Gu that shape moonlight into blades. On Qing Mao that art means the Gu Yue clan and its Moonlight Gu. Lighter on the treasury than strength, and dependent on orchids. = Jalur bulan (月道): Gu yang membentuk cahaya bulan menjadi bilah. Di Qing Mao, seni itu berarti klan Gu Yue dan Gu Cahaya Bulannya. Lebih ringan bagi perbendaharaan daripada jalur kekuatan, dan bergantung pada anggrek.
Path insight multiplies Gu of the same path. Moon Gu in moon hands cut deeper. = Pemahaman jalur melipatgandakan Gu dari jalur yang sama. Gu bulan di tangan pengguna bulan memotong lebih dalam.
More orchid beds in the spring cave and on the slopes. More petals, more blades. = Lebih banyak petak anggrek di gua mata air dan di lereng. Lebih banyak kelopak, lebih banyak bilah.
Moon cultivators strike and slip away before the answer comes. A moon cultivator who stands still is a target. = Kultivator bulan menyerang lalu menghilang sebelum balasan datang. Kultivator bulan yang diam adalah sasaran.
The clan's moon tradition is fully mastered; its students arrive already blooded. The academy stops training students and starts training killers. = Tradisi bulan klan telah dikuasai sepenuhnya; murid-muridnya datang dengan pengalaman bertarung. Akademi berhenti melatih murid dan mulai melatih pembunuh.
The strength path (力道): Gu that add raw might to the body itself. It hits hardest and eats the most. = Jalur kekuatan (力道): Gu yang menambahkan kekuatan mentah ke tubuh itu sendiri. Pukulannya paling keras dan makannya paling banyak.
Path insight multiplies the boar strength grafted onto the body. A boar Gu is only as strong as the body that carries it. = Pemahaman jalur melipatgandakan kekuatan babi yang ditanam di tubuh. Gu babi hanya sekuat tubuh yang membawanya.
Strength cultivators prove themselves against beast packs, and bring the meat home. The meat feeds the clan's boar Gu. = Kultivator kekuatan membuktikan diri melawan kawanan binatang, dan membawa pulang dagingnya. Daging itu memberi makan Gu babi milik klan.
A tempered body recovers in the middle of a fight. The enemy tires first. = Tubuh yang ditempa pulih di tengah pertarungan. Musuh lelah lebih dulu.
The body itself becomes the weapon, and the weapon moves faster. Few clans ever get this far down one path. = Tubuh itu sendiri menjadi senjata, dan senjata itu bergerak lebih cepat. Hanya sedikit klan yang sampai sejauh ini di satu jalur.
The Gu Yue clan (古月一族), halfway up Qing Mao Mountain. Its emblem is the Moonlight Gu, bred by a secret method and fed from its own sea of moon orchids. For centuries it ruled the mountain; now the Bai are catching up. = Klan Gu Yue (古月一族), di pertengahan Gunung Qing Mao. Lambangnya adalah Gu Cahaya Bulan, dibiakkan dengan cara rahasia dan diberi makan dari lautan anggrek bulan miliknya sendiri. Selama berabad-abad ia menguasai gunung; kini klan Bai mulai menyusul.
The Bai clan (白家) of the waterfall village on Qing Mao's back slope, second of the three clans and Gu Yue's rising rival, which wants all three springs. Its Gu Masters favour water and ice, and its fighters once brought down a Thunder Crown Wolf. = Klan Bai (白家) dari desa air terjun di lereng belakang Qing Mao, klan kedua dari ketiganya dan saingan Gu Yue yang sedang naik, yang menginginkan ketiga mata air. Gu Masternya mengutamakan air dan es, dan para petarungnya pernah menumbangkan Serigala Mahkota Guntur.
The Xiong clan (熊家) on Qing Mao's front slope: the weakest of the three on paper, the most numerous in the field, and righteous like the others. It lets others bleed first and is not above hiring demonic muscle. = Klan Xiong (熊家) di lereng depan Qing Mao: yang terlemah dari ketiganya di atas kertas, yang terbanyak di medan, dan beraliran lurus seperti yang lain. Ia membiarkan yang lain berdarah lebih dulu dan tak segan menyewa tenaga iblis.
The Wu clan (武家), first among the Southern Border's righteous super clans, seated on Wu Yi Mountain. Its head Wu Ji walks the strength path, but the clan's own strongest tradition is the wind path (风道); its battle stage is the largest in the region. = Klan Wu (武家), yang pertama di antara klan super aliran lurus Perbatasan Selatan, berkedudukan di Gunung Wu Yi. Pemimpinnya, Wu Ji, menempuh jalur kekuatan, tetapi tradisi terkuat klan itu sendiri adalah jalur angin (风道); panggung laganya yang terbesar di wilayah itu.
Hairy men (毛民), born refiners who follow whoever refines better than they do. Their friendship is measured in insight. = Manusia berbulu (毛民), penempa sejak lahir yang mengikuti siapa pun yang menempa lebih baik daripada mereka. Persahabatan mereka diukur dengan pemahaman.
The mortal villages at the foot of Qing Mao. The mountain clans divide their farmers and hunters among themselves. = Desa-desa manusia fana di kaki Qing Mao. Klan-klan gunung membagi petani dan pemburu mereka di antara mereka sendiri.
The merchant clan of Jia Village (贾家), whose caravans bring a market and a Gu shop up the mountain. Their best Gu go to the highest bidder. = Klan pedagang dari Desa Jia (贾家), yang kafilahnya membawa pasar dan toko Gu ke atas gunung. Gu terbaik mereka jatuh ke penawar tertinggi.
Southern Border clans swallow one another. The clan whose capital is the last one standing rules the mountains. = Klan-klan Perbatasan Selatan saling menelan. Klan yang ibu kotanya terakhir bertahan menguasai pegunungan.
When time runs out, the strongest clan is the one remembered. The score counts what a clan has built and kept. = Ketika waktu habis, klan terkuatlah yang dikenang. Skor menghitung apa yang telah dibangun dan dipertahankan klan.
Mortals and settlers. They do not fight. = Manusia fana dan pemukim. Mereka tidak bertarung.
Gu Masters of every rank, from rank one to the immortals and the Venerable. A path is a promotion they may take at any rank. = Gu Master dari setiap tingkat, dari tingkat satu hingga para abadi dan Yang Mulia. Jalur adalah promosi yang boleh diambil di tingkat mana pun.
Gu Masters of the moon path. They fight up close, but open every clash with a thrown moon blade. = Gu Master jalur bulan. Mereka bertarung jarak dekat, tetapi membuka setiap bentrokan dengan lemparan bilah bulan.
Gu Masters of the strength path. They hit hardest, and they cost the most to keep. = Gu Master jalur kekuatan. Pukulan mereka paling keras, dan biaya hidup mereka paling mahal.
The beasts of the wild: lightning wolves and their kings. They pillage what they cannot eat. = Binatang buas di alam liar: serigala petir dan raja-rajanya. Mereka menjarah apa yang tidak bisa mereka makan.
A dead Gu Master's inheritance (传承), unearthed and held: recipes, materials, insight. Whoever holds the ground holds the prize, so nobody holds it for long without a fight. = Warisan seorang Gu Master yang telah mati (传承), tergali dan dikuasai: resep, bahan, pemahaman. Siapa yang menguasai tanahnya menguasai hadiahnya, jadi tak ada yang menguasainya lama tanpa pertarungan.
Diggers open an inheritance slowly and carefully, so that it does not destroy itself. Haste has buried more heirs than enemies have. = Para penggali membuka warisan pelan-pelan dan hati-hati, agar ia tidak menghancurkan dirinya sendiri. Ketergesaan telah mengubur lebih banyak pewaris daripada musuh.
A rank-two Gu Master (二转): red-iron essence fills the aperture. Rank and path are separate: any path can be walked at any rank. = Gu Master tingkat dua (二转): esensi besi merah mengisi apertur. Tingkat dan jalur terpisah: jalur apa pun bisa ditempuh di tingkat mana pun.
A rank-two Gu Master of the Gu Yue clan (二转): moonlight is the clan's tradition, though not every member walks the moon path. = Gu Master tingkat dua dari klan Gu Yue (二转): cahaya bulan adalah tradisi klan ini, meski tidak semua anggotanya menempuh jalur bulan.
A rank-two Gu Master of the Bai clan (二转): the clan's tradition is the water of its Stream Gu. = Gu Master tingkat dua dari klan Bai (二转): tradisi klan ini adalah air dari Gu Aliran Sungainya.
A rank-two Gu Master of the Xiong clan (二转): the clan's tradition is the raw strength of its Bear Strength Gu. = Gu Master tingkat dua dari klan Xiong (二转): tradisi klan ini adalah kekuatan mentah dari Gu Kekuatan Beruangnya.
A rank-two Gu Master of the Wu clan (二转): the Southern Border's first clan trains its own in the largest battle stage of the region, in the clan's wind path. = Gu Master tingkat dua dari klan Wu (二转): klan pertama Perbatasan Selatan melatih orang-orangnya di panggung laga terbesar wilayah itu, dalam jalur angin klannya.
A rank-three Gu Master (三转): white-silver essence fills the aperture. Rank and path are separate: any path can be walked at any rank. = Gu Master tingkat tiga (三转): esensi perak putih mengisi apertur. Tingkat dan jalur terpisah: jalur apa pun bisa ditempuh di tingkat mana pun.
A rank-three Gu Master of the Gu Yue clan (三转): moonlight is the clan's tradition, though not every member walks the moon path. = Gu Master tingkat tiga dari klan Gu Yue (三转): cahaya bulan adalah tradisi klan ini, meski tidak semua anggotanya menempuh jalur bulan.
A rank-three Gu Master of the Bai clan (三转): the clan's tradition is the water of its Stream Gu. = Gu Master tingkat tiga dari klan Bai (三转): tradisi klan ini adalah air dari Gu Aliran Sungainya.
A rank-three Gu Master of the Xiong clan (三转): the clan's tradition is the raw strength of its Bear Strength Gu. = Gu Master tingkat tiga dari klan Xiong (三转): tradisi klan ini adalah kekuatan mentah dari Gu Kekuatan Beruangnya.
A rank-three Gu Master of the Wu clan (三转): the Southern Border's first clan trains its own in the largest battle stage of the region, in the clan's wind path. = Gu Master tingkat tiga dari klan Wu (三转): klan pertama Perbatasan Selatan melatih orang-orangnya di panggung laga terbesar wilayah itu, dalam jalur angin klannya.
A rank-four Gu Master (四转): yellow-gold essence fills the aperture. Rank and path are separate: any path can be walked at any rank. = Gu Master tingkat empat (四转): esensi emas kuning mengisi apertur. Tingkat dan jalur terpisah: jalur apa pun bisa ditempuh di tingkat mana pun.
A rank-four Gu Master of the Gu Yue clan (四转): moonlight is the clan's tradition, though not every member walks the moon path. = Gu Master tingkat empat dari klan Gu Yue (四转): cahaya bulan adalah tradisi klan ini, meski tidak semua anggotanya menempuh jalur bulan.
A rank-four Gu Master of the Bai clan (四转): the clan's tradition is the water of its Stream Gu. = Gu Master tingkat empat dari klan Bai (四转): tradisi klan ini adalah air dari Gu Aliran Sungainya.
A rank-four Gu Master of the Xiong clan (四转): the clan's tradition is the raw strength of its Bear Strength Gu. = Gu Master tingkat empat dari klan Xiong (四转): tradisi klan ini adalah kekuatan mentah dari Gu Kekuatan Beruangnya.
A rank-four Gu Master of the Wu clan (四转): the Southern Border's first clan trains its own in the largest battle stage of the region, in the clan's wind path. = Gu Master tingkat empat dari klan Wu (四转): klan pertama Perbatasan Selatan melatih orang-orangnya di panggung laga terbesar wilayah itu, dalam jalur angin klannya.
The mark of a demonic clan's cultivator. Righteous clans post bounties and wanted notices for such heads, and fight harder against them; the mark fades once the clan takes a righteous name. = Tanda kultivator dari klan iblis. Klan-klan lurus memasang hadiah dan maklumat buronan untuk kepala seperti itu, dan bertarung lebih keras melawannya; tanda itu pudar begitu klan mengambil nama lurus.
Rank five (五转): purple crystal essence, the peak of mortal cultivation. Many masters stop here for good; the next step is the ascension, and it can kill. = Tingkat lima (五转): esensi kristal ungu, puncak kultivasi fana. Banyak master berhenti di sini selamanya; langkah berikutnya adalah kenaikan abadi, dan itu bisa membunuh.
Rank six (六转): the immortal threshold, green grape essence. An immortal's aperture is a blessed land that feeds it essence for as long as it lives. = Tingkat enam (六转): ambang keabadian, esensi anggur hijau. Apertur seorang abadi adalah tanah berkah yang memberinya esensi selama ia hidup.
Rank five essence (紫晶真元) condenses like crystal. Opens the Rank Five Gu Master. = Esensi tingkat lima (紫晶真元) memadat seperti kristal. Membuka Gu Master Tingkat Lima.
Heaven, earth and human qi (天气, 地气, 人气) must meet in balance for a mortal to become an immortal. From now on your land gathers heaven qi, your springs and hills earth qi, and your people and battles human qi. = Qi langit, bumi, dan manusia (天气, 地气, 人气) harus bertemu seimbang agar seorang fana menjadi abadi. Mulai sekarang wilayah Anda mengumpulkan qi langit, mata air dan bukit mengumpulkan qi bumi, rakyat dan pertempuran mengumpulkan qi manusia.
Calamities (灾劫) come on a schedule and can be prepared for. Knowing them is the last preparation for the ascension: a rank-five master may now try it (the Ascension promotion). = Bencana (灾劫) datang menurut jadwal dan bisa dipersiapkan. Memahaminya adalah persiapan terakhir sebelum kenaikan: master tingkat lima kini boleh mencobanya (promosi Kenaikan Abadi).
A rank-five Gu Master (五转): the strongest a mortal gets. It cannot be upgraded with stones; it can only ascend, through the Ascension promotion, and the ascension may kill it. = Gu Master tingkat lima (五转): sekuat-kuatnya seorang fana. Ia tidak bisa ditingkatkan dengan batu; ia hanya bisa naik lewat promosi Kenaikan Abadi, dan kenaikan itu bisa membunuhnya.
A rank-six Gu Immortal (六转蛊仙). Only the ascension makes one, or Spring Autumn Cicada's return (without a blessed land). Its blessed land feeds the clan green grape essence and stones; with more than nine essence in store it fights harder. = Gu Abadi tingkat enam (六转蛊仙). Hanya kenaikan abadi yang bisa melahirkannya, atau kembalinya lewat Jangkrik Musim Semi Gugur (tanpa tanah berkah). Tanah berkahnya memberi klan esensi anggur hijau dan batu; dengan simpanan esensi lebih dari sembilan ia bertarung lebih kuat.
Crush the aperture, draw in the three qi and survive the calamity (升仙). Balanced qi succeeds four times in five, haste one time in two; aptitude A helps, aptitude D hurts. Failure kills the master; success brings 20 Lifespan Gu. = Hancurkan apertur, tarik masuk tiga qi, dan bertahan dari bencana (升仙). Qi yang seimbang berhasil empat dari lima kali, tergesa-gesa satu dari dua; bakat A membantu, bakat D merugikan. Gagal berarti sang master mati; berhasil membawa 20 Gu Umur.
A lower-grade blessed land (下等福地), the most common: 1 green grape essence, 2 stones and 1 immortal material a turn (red date essence at rank seven). = Tanah berkah kelas rendah (下等福地), yang paling umum: 1 esensi anggur hijau, 2 batu, dan 1 bahan abadi per giliran (esensi kurma merah di tingkat tujuh).
A middle-grade blessed land (中等福地): 2 green grape essence, 4 stones and 1 immortal material a turn (red date essence at rank seven). = Tanah berkah kelas menengah (中等福地): 2 esensi anggur hijau, 4 batu, dan 1 bahan abadi per giliran (esensi kurma merah di tingkat tujuh).
An upper-grade blessed land (上等福地), rare: 3 green grape essence, 6 stones and 2 immortal materials a turn (red date essence at rank seven). = Tanah berkah kelas atas (上等福地), langka: 3 esensi anggur hijau, 6 batu, dan 2 bahan abadi per giliran (esensi kurma merah di tingkat tujuh).
A super-grade blessed land (特等福地), the foundation of a prodigy: 5 green grape essence, 10 stones and 2 immortal materials a turn (red date essence at rank seven). = Tanah berkah kelas istimewa (特等福地), fondasi seorang jenius: 5 esensi anggur hijau, 10 batu, dan 2 bahan abadi per giliran (esensi kurma merah di tingkat tujuh).
Heaven qi (天气) falls on the land a clan holds: 1 a turn for every 15 land tiles. = Qi langit (天气) turun ke wilayah yang dikuasai klan: 1 per giliran untuk setiap 15 petak darat.
Earth qi (地气) rises from spring caves and hills: 1 a turn per spring cave and per 8 hills. = Qi bumi (地气) naik dari gua mata air dan bukit: 1 per giliran per gua mata air dan per 8 bukit.
Human qi (人气) is gathered through people and deeds: 1 a turn per 10 citizens, and 5% of the damage your units deal. = Qi manusia (人气) dikumpulkan lewat rakyat dan perbuatan: 1 per giliran per 10 penduduk, dan 5% dari kerusakan yang diberikan unit Anda.
Rank-six immortal essence (青提仙元). It never refills by itself: blessed lands make it, and a few immortal Gu, inheritances and trades. = Esensi abadi tingkat enam (青提仙元). Ia tidak pernah terisi sendiri: tanah berkah menghasilkannya, juga beberapa Gu abadi, warisan, dan perdagangan.
Ten aperture-years pass between earthly calamities (地灾). When this runs out the immortal's blessed land is struck; a bigger land runs faster and is struck sooner (11 to 14 turns on Standard; 10 in a grotto-heaven). = Sepuluh tahun apertur berlalu di antara bencana bumi (地灾). Saat ini habis, tanah berkah sang abadi dihantam; tanah yang lebih besar berputar lebih cepat dan lebih cepat dihantam (11 sampai 14 giliran pada kecepatan Standar; 10 di gua surgawi).
A heavenly tribulation (天劫) comes every hundred aperture-years: 60 turns on Standard at rank six, 30 at rank seven, 50 in a grotto-heaven. Unprepared, one immortal in four dies of it. = Kesengsaraan langit (天劫) datang setiap seratus tahun apertur: 60 giliran pada kecepatan Standar di tingkat enam, 30 di tingkat tujuh, 50 di gua surgawi. Tanpa persiapan, satu dari empat abadi mati karenanya.
A calamity has ravaged the blessed land: it yields no essence and no stones until the status runs out. = Bencana telah memorak-porandakan tanah berkah: ia tidak menghasilkan esensi maupun batu sampai status ini habis.
Defences planned before the calamity comes (one per clan). It opens the cheapest way through earthly calamities and, with essence, through heavenly tribulations. = Pertahanan yang direncanakan sebelum bencana datang (satu per klan). Ia membuka jalan termurah melewati bencana bumi dan, dengan esensi, melewati kesengsaraan langit.
Stores laid in for the calamity (one per clan): after an earthly calamity the land is rebuilt from the vault for 40 stones. = Persediaan yang disiapkan untuk bencana (satu per klan): setelah bencana bumi, tanah dibangun ulang dari gudang dengan 40 batu.
Lifespan Gu (寿蛊) are made only by heaven and earth where life teems; nobody can refine one. Forests, jungles and swamps yield a few, as do some immortal Gu and inheritances. Reaching rank six, seven, eight and nine brings 20, 25, 35 and 60, and a higher rank burns them more slowly: one each 10, 15, 20 or 30 turns on Standard. With none left an immortal heals only by pillaging and wastes away (7 HP a turn). Civilopedia, Tutorials: Immortal Lifespan. = Gu Umur (寿蛊) hanya diciptakan langit dan bumi di tempat kehidupan melimpah; tak seorang pun bisa memurnikannya. Hutan, rimba, dan rawa menghasilkan sedikit, begitu pula beberapa Gu abadi dan warisan. Mencapai tingkat enam, tujuh, delapan, dan sembilan membawa 20, 25, 35, dan 60, dan tingkat yang lebih tinggi membakarnya lebih lambat: satu tiap 10, 15, 20, atau 30 giliran pada kecepatan Standar. Bila habis, seorang abadi hanya bisa pulih dengan menjarah dan merana (7 HP per giliran). Civilopedia, Tutorial: Umur Abadi.
Spring Autumn Cicada (春秋蝉), rank six, time path: Red Lotus's vital Gu. When its owner loses an immortal, the will may return up the river of time: half the time a new Gu Immortal appears (without a blessed land). Costs essence on top of production; a captured city keeps it, so conquest seizes the Gu. Its birth may call down a calamity. = Jangkrik Musim Semi Gugur (春秋蝉), tingkat enam, jalur waktu: Gu vital Teratai Merah. Saat pemiliknya kehilangan seorang abadi, kehendaknya bisa kembali menyusuri sungai waktu: separuh kemungkinan muncul Gu Abadi baru (tanpa tanah berkah). Membutuhkan esensi selain produksi; kota yang direbut tetap memilikinya, jadi penaklukan merampas Gu itu. Kelahirannya bisa memanggil bencana.
Fixed Immortal Travel (定仙游), rank six, space path: carries its holder to any place it remembers. Your immortals gain 1 movement. Costs essence on top of production; a captured city keeps it, so conquest seizes the Gu. Its birth may call down a calamity. = Perjalanan Abadi Tetap (定仙游), tingkat enam, jalur ruang: membawa pemegangnya ke tempat mana pun yang ia ingat. Para abadi Anda mendapat 1 gerak. Membutuhkan esensi selain produksi; kota yang direbut tetap memilikinya, jadi penaklukan merampas Gu itu. Kelahirannya bisa memanggil bencana.
Man as Before (人如故), rank six, time path: returns a body to an earlier moment. Your immortals heal 20 more HP a turn. Costs essence on top of production; a captured city keeps it, so conquest seizes the Gu. Its birth may call down a calamity. = Manusia Seperti Dulu (人如故), tingkat enam, jalur waktu: mengembalikan tubuh ke saat sebelumnya. Para abadi Anda pulih 20 HP lebih banyak per giliran. Membutuhkan esensi selain produksi; kota yang direbut tetap memilikinya, jadi penaklukan merampas Gu itu. Kelahirannya bisa memanggil bencana.
Unravel Mystery (解谜), rank six, wisdom path: solves trials and puzzles. +15% Science in all cities. Costs essence on top of production; a captured city keeps it, so conquest seizes the Gu. Its birth may call down a calamity. = Mengurai Misteri (解谜), tingkat enam, jalur kebijaksanaan: memecahkan ujian dan teka-teki. +15% Sains di semua kota. Membutuhkan esensi selain produksi; kota yang direbut tetap memilikinya, jadi penaklukan merampas Gu itu. Kelahirannya bisa memanggil bencana.
Connect Luck (连运), rank six, luck path: links one's luck to others'. Your immortals fight 10% harder, and with Spring Autumn Cicada a fallen immortal returns more often. Costs essence on top of production; a captured city keeps it, so conquest seizes the Gu. Its birth may call down a calamity. = Sambung Keberuntungan (连运), tingkat enam, jalur keberuntungan: menautkan keberuntungan seseorang dengan orang lain. Para abadi Anda bertarung 10% lebih kuat, dan bersama Jangkrik Musim Semi Gugur abadi yang gugur lebih sering kembali. Membutuhkan esensi selain produksi; kota yang direbut tetap memilikinya, jadi penaklukan merampas Gu itu. Kelahirannya bisa memanggil bencana.
Self Strength (我力), rank six, strength path: the core of Myriad Self. Every strength-path unit you own fights 15% harder. Costs essence on top of production; a captured city keeps it, so conquest seizes the Gu. Its birth may call down a calamity. = Kekuatan Diri (我力), tingkat enam, jalur kekuatan: inti dari Sepuluh Ribu Diri. Setiap unit jalur kekuatan milik Anda bertarung 15% lebih kuat. Membutuhkan esensi selain produksi; kota yang direbut tetap memilikinya, jadi penaklukan merampas Gu itu. Kelahirannya bisa memanggil bencana.
Woman's Heart (妇人心), rank six, poison path. Your units fight 20% harder against wounded units. Costs essence on top of production; a captured city keeps it, so conquest seizes the Gu. Its birth may call down a calamity. = Hati Wanita (妇人心), tingkat enam, jalur racun. Unit Anda bertarung 20% lebih kuat melawan unit yang terluka. Membutuhkan esensi selain produksi; kota yang direbut tetap memilikinya, jadi penaklukan merampas Gu itu. Kelahirannya bisa memanggil bencana.
Bone Spike (骨刺), rank six, bone path. Your immortals defend 20% harder. Costs essence on top of production; a captured city keeps it, so conquest seizes the Gu. Its birth may call down a calamity. = Duri Tulang (骨刺), tingkat enam, jalur tulang. Para abadi Anda bertahan 20% lebih kuat. Membutuhkan esensi selain produksi; kota yang direbut tetap memilikinya, jadi penaklukan merampas Gu itu. Kelahirannya bisa memanggil bencana.
Star Eyes (星眸), rank six, star path: one of the immortal Gu in Fang Yuan's hands. Your immortals see 2 tiles farther. Costs essence on top of production; a captured city keeps it, so conquest seizes the Gu. Its birth may call down a calamity. = Mata Bintang (星眸), tingkat enam, jalur bintang: salah satu Gu abadi di tangan Fang Yuan. Para abadi Anda melihat 2 petak lebih jauh. Membutuhkan esensi selain produksi; kota yang direbut tetap memilikinya, jadi penaklukan merampas Gu itu. Kelahirannya bisa memanggil bencana.
Divert Disaster (排难), rank six, luck path: weakens or turns aside calamities. Its owner's immortals may divert every earthly calamity and heavenly tribulation at no cost. Costs essence on top of production; a captured city keeps it, so conquest seizes the Gu. Its birth may call down a calamity. = Alihkan Bencana (排难), tingkat enam, jalur keberuntungan: melemahkan atau membelokkan bencana. Para abadi pemiliknya dapat mengalihkan setiap bencana bumi dan kesengsaraan langit tanpa biaya. Membutuhkan esensi selain produksi; kota yang direbut tetap memilikinya, jadi penaklukan merampas Gu itu. Kelahirannya bisa memanggil bencana.
An immortal Gu recipe (仙蛊方) is the plan for a Gu unique in the world; even a complete one costs a fortune. Opens the rank-six immortal Gu, each a world wonder bought with production and green grape essence. = Resep Gu abadi (仙蛊方) adalah rancangan Gu yang hanya ada satu di dunia; bahkan yang lengkap pun menelan harta. Membuka Gu abadi tingkat enam, masing-masing keajaiban dunia yang dibayar dengan produksi dan esensi anggur hijau.
The qi-path heritage of the Heavenly Court's founder. 2 human qi a turn; qi-path units fight 15% harder. Built only by a clan holding its seal, which a trial grants (元始真传); a captured city keeps it. = Warisan jalur qi pendiri Istana Langit. 2 qi manusia per giliran; unit jalur qi bertarung 15% lebih kuat. Hanya bisa dibangun klan yang memegang segelnya, yang diberikan lewat ujian (元始真传); kota yang direbut tetap memilikinya.
The seal of the Primordial Origin Inheritance: proof that the clan passed its trial. It unlocks building the inheritance; it cannot be built. = Segel Warisan Asal Primordial: bukti bahwa klan lulus ujiannya. Segel ini membuka pembangunan warisan itu; segel tidak bisa dibangun.
Star Constellation's wisdom-path heritage, intricate and hard on the mind. +20% science; wisdom-path units fight 15% harder. Built only by a clan holding its seal, which a trial grants (星宿真传); a captured city keeps it. = Warisan jalur kebijaksanaan Rasi Bintang, rumit dan menguras pikiran. +20% sains; unit jalur kebijaksanaan bertarung 15% lebih kuat. Hanya bisa dibangun klan yang memegang segelnya, yang diberikan lewat ujian (星宿真传); kota yang direbut tetap memilikinya.
The seal of the Star Constellation Inheritance: proof that the clan passed its trial. It unlocks building the inheritance; it cannot be built. = Segel Warisan Rasi Bintang: bukti bahwa klan lulus ujiannya. Segel ini membuka pembangunan warisan itu; segel tidak bisa dibangun.
Limitless's rule-path heritage, which ends in a test that must be broken. Building upkeep -25%; rule-path units fight 15% harder. Built only by a clan holding its seal, which a trial grants (无极真传); a captured city keeps it. = Warisan jalur aturan Tanpa Batas, yang berakhir dengan ujian yang harus dipatahkan. Biaya bangunan -25%; unit jalur aturan bertarung 15% lebih kuat. Hanya bisa dibangun klan yang memegang segelnya, yang diberikan lewat ujian (无极真传); kota yang direbut tetap memilikinya.
The seal of the Limitless Inheritance: proof that the clan passed its trial. It unlocks building the inheritance; it cannot be built. = Segel Warisan Tanpa Batas: bukti bahwa klan lulus ujiannya. Segel ini membuka pembangunan warisan itu; segel tidak bisa dibangun.
Reckless Savage's strength-path heritage, won only by enduring. Strength-path units fight 25% harder, transformation-path units 10%. Built only by a clan holding its seal, which a trial grants (狂蛮传承); a captured city keeps it. = Warisan jalur kekuatan Si Buas Nekat, hanya didapat dengan bertahan. Unit jalur kekuatan bertarung 25% lebih kuat, unit jalur transformasi 10%. Hanya bisa dibangun klan yang memegang segelnya, yang diberikan lewat ujian (狂蛮传承); kota yang direbut tetap memilikinya.
The seal of the Reckless Savage Inheritance: proof that the clan passed its trial. It unlocks building the inheritance; it cannot be built. = Segel Warisan Si Buas Nekat: bukti bahwa klan lulus ujiannya. Segel ini membuka pembangunan warisan itu; segel tidak bisa dibangun.
One of Red Lotus's time-path heritages, left on the River of Time to arm Fate's future enemy. A Lifespan Gu every five turns; time-path units fight 15% harder. Built only by a clan holding its seal, which a trial grants (红莲真传); a captured city keeps it. = Salah satu warisan jalur waktu Teratai Merah, ditinggalkan di Sungai Waktu untuk mempersenjatai musuh Takdir di masa depan. Satu Gu Umur tiap lima giliran; unit jalur waktu bertarung 15% lebih kuat. Hanya bisa dibangun klan yang memegang segelnya, yang diberikan lewat ujian (红莲真传); kota yang direbut tetap memilikinya.
The seal of the Red Lotus Inheritance: proof that the clan passed its trial. It unlocks building the inheritance; it cannot be built. = Segel Warisan Teratai Merah: bukti bahwa klan lulus ujiannya. Segel ini membuka pembangunan warisan itu; segel tidak bisa dibangun.
Genesis Lotus's wood-path heritage. 2 green grape essence a turn; wood-path units fight 15% harder. Built only by a clan holding its seal, which a trial grants (元莲真传); a captured city keeps it. = Warisan jalur kayu Teratai Asal. 2 esensi anggur hijau per giliran; unit jalur kayu bertarung 15% lebih kuat. Hanya bisa dibangun klan yang memegang segelnya, yang diberikan lewat ujian (元莲真传); kota yang direbut tetap memilikinya.
The seal of the Genesis Lotus Inheritance: proof that the clan passed its trial. It unlocks building the inheritance; it cannot be built. = Segel Warisan Teratai Asal: bukti bahwa klan lulus ujiannya. Segel ini membuka pembangunan warisan itu; segel tidak bisa dibangun.
One of Thieving Heaven's theft-path heritages; its trial is pure chance, no fight. Half of every slain enemy's cost becomes stones; theft-path units fight 15% harder. Built only by a clan holding its seal, which a trial grants (盗天真传); a captured city keeps it. = Salah satu warisan jalur pencurian Pencuri Langit; ujiannya murni untung-untungan, tanpa pertarungan. Separuh biaya setiap musuh yang dibunuh menjadi batu; unit jalur pencurian bertarung 15% lebih kuat. Hanya bisa dibangun klan yang memegang segelnya, yang diberikan lewat ujian (盗天真传); kota yang direbut tetap memilikinya.
The seal of the Thieving Heaven Inheritance: proof that the clan passed its trial. It unlocks building the inheritance; it cannot be built. = Segel Warisan Pencuri Langit: bukti bahwa klan lulus ujiannya. Segel ini membuka pembangunan warisan itu; segel tidak bisa dibangun.
The first rung of Giant Sun's luck ladder, the luck of the self. +10% stones; luck-path units fight 15% harder. Built only by a clan holding its seal, which a trial grants (己运真传); a captured city keeps it. = Anak tangga pertama keberuntungan Matahari Raksasa, keberuntungan diri. +10% batu; unit jalur keberuntungan bertarung 15% lebih kuat. Hanya bisa dibangun klan yang memegang segelnya, yang diberikan lewat ujian (己运真传); kota yang direbut tetap memilikinya.
The seal of the Giant Sun Luck Inheritance: proof that the clan passed its trial. It unlocks building the inheritance; it cannot be built. = Segel Warisan Keberuntungan Matahari Raksasa: bukti bahwa klan lulus ujiannya. Segel ini membuka pembangunan warisan itu; segel tidak bisa dibangun.
Spectral Soul's soul-path summit. Units gain 25% more XP in battle; soul-path units fight 15% harder. Built only by a clan holding its seal, which a trial grants (幽魂真传); a captured city keeps it. = Puncak jalur jiwa Jiwa Hantu. Unit mendapat 25% XP lebih banyak dalam pertempuran; unit jalur jiwa bertarung 15% lebih kuat. Hanya bisa dibangun klan yang memegang segelnya, yang diberikan lewat ujian (幽魂真传); kota yang direbut tetap memilikinya.
The seal of the Spectral Soul Inheritance: proof that the clan passed its trial. It unlocks building the inheritance; it cannot be built. = Segel Warisan Jiwa Hantu: bukti bahwa klan lulus ujiannya. Segel ini membuka pembangunan warisan itu; segel tidak bisa dibangun.
One of Paradise Earth's earth-path heritages, one per region. 2 earth qi a turn; earth-path units fight 15% harder. Built only by a clan holding its seal, which a trial grants (乐土真传); a captured city keeps it. = Salah satu warisan jalur bumi Bumi Surga, satu per wilayah. 2 qi bumi per giliran; unit jalur bumi bertarung 15% lebih kuat. Hanya bisa dibangun klan yang memegang segelnya, yang diberikan lewat ujian (乐土真传); kota yang direbut tetap memilikinya.
The seal of the Paradise Earth Inheritance: proof that the clan passed its trial. It unlocks building the inheritance; it cannot be built. = Segel Warisan Bumi Surga: bukti bahwa klan lulus ujiannya. Segel ini membuka pembangunan warisan itu; segel tidak bisa dibangun.
Three pillars of light (enslavement, refinement, fire) inside a dying blessed land. Three units cost no upkeep; enslavement-path units fight 15% harder. Built only by a clan holding its seal, which a trial grants (三王传承); a captured city keeps it. = Tiga pilar cahaya (perbudakan, penyulingan, api) di dalam tanah berkah yang sekarat. Tiga unit tanpa biaya pemeliharaan; unit jalur perbudakan bertarung 15% lebih kuat. Hanya bisa dibangun klan yang memegang segelnya, yang diberikan lewat ujian (三王传承); kota yang direbut tetap memilikinya.
The seal of the Three Kings Inheritance: proof that the clan passed its trial. It unlocks building the inheritance; it cannot be built. = Segel Warisan Tiga Raja: bukti bahwa klan lulus ujiannya. Segel ini membuka pembangunan warisan itu; segel tidak bisa dibangun.
The refinement-path heritage of the first refiner of all time. Immortal Gu are built 25% faster; refinement-path units fight 15% harder. Built only by a clan holding its seal, which a trial grants (长毛老祖炼道真传); a captured city keeps it. = Warisan jalur penyulingan penyuling pertama sepanjang masa. Gu abadi dibangun 25% lebih cepat; unit jalur penyulingan bertarung 15% lebih kuat. Hanya bisa dibangun klan yang memegang segelnya, yang diberikan lewat ujian (长毛老祖炼道真传); kota yang direbut tetap memilikinya.
The seal of the Long Hair Ancestor Inheritance: proof that the clan passed its trial. It unlocks building the inheritance; it cannot be built. = Segel Warisan Leluhur Rambut Panjang: bukti bahwa klan lulus ujiannya. Segel ini membuka pembangunan warisan itu; segel tidak bisa dibangun.
Hu Immortal's blessed land, whose land spirit serves the first to climb Dang Hun Mountain. +2 happiness and 1 heaven qi a turn. Built only by a clan holding its seal, which a trial grants (狐仙传承); a captured city keeps it. = Tanah berkah Abadi Hu, yang roh tanahnya melayani orang pertama yang mendaki Gunung Dang Hun. +2 kebahagiaan dan 1 qi langit per giliran. Hanya bisa dibangun klan yang memegang segelnya, yang diberikan lewat ujian (狐仙传承); kota yang direbut tetap memilikinya.
The seal of the Hu Immortal Inheritance: proof that the clan passed its trial. It unlocks building the inheritance; it cannot be built. = Segel Warisan Abadi Hu: bukti bahwa klan lulus ujiannya. Segel ini membuka pembangunan warisan itu; segel tidak bisa dibangun.
A piece of Blood Sea Ancestor's heritage; only a demonic clan may claim it, and its heir is hunted. Blood-path units fight 25% harder; kills feed human qi. Built only by a clan holding its seal, which a trial grants (血海真传); a captured city keeps it. = Sepotong warisan Leluhur Lautan Darah; hanya klan iblis yang boleh mengklaimnya, dan pewarisnya diburu. Unit jalur darah bertarung 25% lebih kuat; pembunuhan memberi qi manusia. Hanya bisa dibangun klan yang memegang segelnya, yang diberikan lewat ujian (血海真传); kota yang direbut tetap memilikinya.
The seal of the Blood Sea Inheritance: proof that the clan passed its trial. It unlocks building the inheritance; it cannot be built. = Segel Warisan Lautan Darah: bukti bahwa klan lulus ujiannya. Segel ini membuka pembangunan warisan itu; segel tidak bisa dibangun.
A desolate beast (荒兽), about as strong as a rank-six immortal. Only a beast tide or Heaven's Will brings one; its corpse is a heap of immortal materials. = Binatang buas purba (荒兽), kira-kira sekuat abadi tingkat enam. Hanya gelombang binatang atau Kehendak Langit yang membawanya; bangkainya adalah tumpukan bahan abadi.
Ranked materials (仙材) from which immortal Gu are refined: 30 for a rank-six Gu up to 80 for rank nine, 60 for a Gu House. Blessed lands grow 1-2 a turn, a grotto-heaven 3; a slain desolate beast yields 20; Treasure Yellow Heaven buys a surplus for essence. = Bahan berperingkat (仙材) untuk memurnikan Gu abadi: 30 untuk Gu tingkat enam hingga 80 untuk tingkat sembilan, 60 untuk Rumah Gu. Tanah berkah menumbuhkan 1-2 per giliran, gua surgawi 3; binatang buas purba yang terbunuh menghasilkan 20; Langit Kuning Harta membeli kelebihannya dengan esensi.
Dragon Strength (龙力), rank seven, strength path: permanent dragon-grade strength. Strength-path units fight 20% harder. Costs essence of its rank on top of production; a captured city keeps it. = Kekuatan Naga (龙力), tingkat tujuh, jalur kekuatan: kekuatan tingkat naga yang permanen. Unit jalur kekuatan bertarung 20% lebih kuat. Membutuhkan esensi sesuai tingkatnya selain produksi; kota yang direbut tetap memilikinya.
Year Gu (年蛊), rank seven, time path: stored years. A Lifespan Gu every three turns. Costs essence of its rank on top of production; a captured city keeps it. = Gu Tahun (年蛊), tingkat tujuh, jalur waktu: tahun yang tersimpan. Satu Gu Umur tiap tiga giliran. Membutuhkan esensi sesuai tingkatnya selain produksi; kota yang direbut tetap memilikinya.
Formation Flag (阵旗), rank seven, formation path: stores a whole formation and plants it elsewhere. Military units fight 15% harder beside another. Costs essence of its rank on top of production; a captured city keeps it. = Bendera Formasi (阵旗), tingkat tujuh, jalur formasi: menyimpan seluruh formasi dan menancapkannya di tempat lain. Unit militer bertarung 15% lebih kuat di samping unit lain. Membutuhkan esensi sesuai tingkatnya selain produksi; kota yang direbut tetap memilikinya.
Divination Tortoise Shell (卜卦龟背), rank seven, wisdom path: blocks every deduction about its owner. Heaven's Will cannot find its clan; +10% science. Costs essence of its rank on top of production; a captured city keeps it. = Cangkang Kura-kura Ramalan (卜卦龟背), tingkat tujuh, jalur kebijaksanaan: menghalangi setiap deduksi tentang pemiliknya. Kehendak Langit tidak bisa menemukan klannya; +10% sains. Membutuhkan esensi sesuai tingkatnya selain produksi; kota yang direbut tetap memilikinya.
Dragon Centipede (龙蜈), rank seven, sword path: the world's only one, a wild Gu that hunts ancient desolate beasts. +30% strength against beasts. Costs essence of its rank on top of production; a captured city keeps it. = Kelabang Naga (龙蜈), tingkat tujuh, jalur pedang: satu-satunya di dunia, Gu liar yang memburu binatang buas purba kuno. +30% kekuatan melawan binatang. Membutuhkan esensi sesuai tingkatnya selain produksi; kota yang direbut tetap memilikinya.
Reputation Restriction (名缰), rank seven, information path: a rope that binds even ancient desolate beasts. Slain beasts give immortal materials. Costs essence of its rank on top of production; a captured city keeps it. = Kekang Reputasi (名缰), tingkat tujuh, jalur informasi: tali yang mengikat bahkan binatang buas purba kuno. Binatang yang terbunuh memberi bahan abadi. Membutuhkan esensi sesuai tingkatnya selain produksi; kota yang direbut tetap memilikinya.
Calamity Beckoning (招灾), rank seven, luck path: draws calamities onto oneself. Its owner's immortals may beckon an earthly calamity to the land's edge and keep what it leaves (10 immortal materials). Costs essence of its rank on top of production; a captured city keeps it. = Pemanggil Bencana (招灾), tingkat tujuh, jalur keberuntungan: menarik bencana ke diri sendiri. Para abadi pemiliknya dapat memanggil bencana bumi ke tepi tanah dan menyimpan sisanya (10 bahan abadi). Membutuhkan esensi sesuai tingkatnya selain produksi; kota yang direbut tetap memilikinya.
Change Soul (换魂), rank seven, soul path. Your immortals gain 20% more XP in battle. Costs essence of its rank on top of production; a captured city keeps it. = Ganti Jiwa (换魂), tingkat tujuh, jalur jiwa. Para abadi Anda mendapat 20% XP lebih banyak dalam pertempuran. Membutuhkan esensi sesuai tingkatnya selain produksi; kota yang direbut tetap memilikinya.
Dragon Breath (龙息), rank seven, transformation path. Your immortals attack 20% harder. Costs essence of its rank on top of production; a captured city keeps it. = Napas Naga (龙息), tingkat tujuh, jalur transformasi. Para abadi Anda menyerang 20% lebih kuat. Membutuhkan esensi sesuai tingkatnya selain produksi; kota yang direbut tetap memilikinya.
Heavenly Essence Treasure Imperial Lotus (天元宝皇莲), rank eight, wood path: Genesis Lotus's core Gu, the one essence source that is a Gu. 1 white lychee and 2 green grape essence a turn. Costs essence of its rank on top of production; a captured city keeps it. = Teratai Kaisar Pusaka Esensi Langit (天元宝皇莲), tingkat delapan, jalur kayu: Gu inti Teratai Asal, satu-satunya sumber esensi yang berupa Gu. 1 esensi leci putih dan 2 esensi anggur hijau per giliran. Membutuhkan esensi sesuai tingkatnya selain produksi; kota yang direbut tetap memilikinya.
Years Flow Like Water (似水流年), rank eight, time path: turns immortal essence into years. Every five turns, 10 green grape essence become 2 Lifespan Gu. Costs essence of its rank on top of production; a captured city keeps it. = Tahun Mengalir Seperti Air (似水流年), tingkat delapan, jalur waktu: mengubah esensi abadi menjadi tahun. Setiap lima giliran, 10 esensi anggur hijau menjadi 2 Gu Umur. Membutuhkan esensi sesuai tingkatnya selain produksi; kota yang direbut tetap memilikinya.
Dream Token (如梦令), rank eight, dream path: enslaves even rank eights through their dreams. +20% strength against immortals. Costs essence of its rank on top of production; a captured city keeps it. = Titah Mimpi (如梦令), tingkat delapan, jalur mimpi: memperbudak bahkan tingkat delapan lewat mimpi mereka. +20% kekuatan melawan para abadi. Membutuhkan esensi sesuai tingkatnya selain produksi; kota yang direbut tetap memilikinya.
Soul Beast Token (魂兽令), rank eight, enslavement path: commands soul beasts. Four units cost no upkeep. Costs essence of its rank on top of production; a captured city keeps it. = Titah Binatang Jiwa (魂兽令), tingkat delapan, jalur perbudakan: memerintah binatang jiwa. Empat unit tanpa biaya pemeliharaan. Membutuhkan esensi sesuai tingkatnya selain produksi; kota yang direbut tetap memilikinya.
Treasure Light Gu (宝光蛊), rank eight, light path: the light that prices goods at Treasure Yellow Heaven. +10% stones, and a better bargain in the market. Costs essence of its rank on top of production; a captured city keeps it. = Gu Cahaya Pusaka (宝光蛊), tingkat delapan, jalur cahaya: cahaya yang menaksir barang di Langit Kuning Harta. +10% batu, dan tawaran lebih baik di pasar. Membutuhkan esensi sesuai tingkatnya selain produksi; kota yang direbut tetap memilikinya.
Advance Refinement Gu (升炼蛊), rank eight, refinement path: raises other Gu's rank. Immortal Gu are built 30% faster. Costs essence of its rank on top of production; a captured city keeps it. = Gu Peningkat Penyulingan (升炼蛊), tingkat delapan, jalur penyulingan: menaikkan tingkat Gu lain. Gu abadi dibangun 30% lebih cepat. Membutuhkan esensi sesuai tingkatnya selain produksi; kota yang direbut tetap memilikinya.
Steal Life (偷生), rank eight, theft path: Thieving Heaven's first Gu. An immortal that kills heals 25 HP. Costs essence of its rank on top of production; a captured city keeps it. = Curi Nyawa (偷生), tingkat delapan, jalur pencurian: Gu pertama Pencuri Langit. Abadi yang membunuh pulih 25 HP. Membutuhkan esensi sesuai tingkatnya selain produksi; kota yang direbut tetap memilikinya.
Human Qi Immortal Gu (人气仙蛊), rank eight, qi path: one of the three qi as a Gu. 3 human qi a turn. Costs essence of its rank on top of production; a captured city keeps it. = Gu Abadi Qi Manusia (人气仙蛊), tingkat delapan, jalur qi: salah satu dari tiga qi sebagai Gu. 3 qi manusia per giliran. Membutuhkan esensi sesuai tingkatnya selain produksi; kota yang direbut tetap memilikinya.
Rank seven (七转): red date essence. Three hundred aperture-years of calamities lie behind every rank-seven immortal. = Tingkat tujuh (七转): esensi kurma merah. Tiga ratus tahun apertur penuh bencana ada di belakang setiap abadi tingkat tujuh.
Rank eight (八转): white lychee essence. The aperture becomes a grotto-heaven, and the tribulations grow worse. = Tingkat delapan (八转): esensi leci putih. Apertur menjadi gua surgawi, dan kesengsaraan makin berat.
Rank-seven essence (红枣仙元). An immortal that has survived a heavenly tribulation may climb to rank seven with dao marks tier II and 60 green grape essence (on Standard). = Esensi tingkat tujuh (红枣仙元). Abadi yang selamat dari kesengsaraan langit boleh naik ke tingkat tujuh dengan jejak dao tingkat II dan 60 esensi anggur hijau (pada kecepatan Standar).
Recipes for rank-seven immortal Gu, bought with red date essence. = Resep Gu abadi tingkat tujuh, dibayar dengan esensi kurma merah.
The rank-eight aperture (洞天). A rank-seven immortal that has survived another tribulation may climb to rank eight with dao marks tier III and 60 red date essence (on Standard); its blessed land becomes a grotto-heaven. = Apertur tingkat delapan (洞天). Abadi tingkat tujuh yang selamat dari kesengsaraan berikutnya boleh naik ke tingkat delapan dengan jejak dao tingkat III dan 60 esensi kurma merah (pada kecepatan Standar); tanah berkahnya menjadi gua surgawi.
Recipes for rank-eight immortal Gu, bought with white lychee essence. = Resep Gu abadi tingkat delapan, dibayar dengan esensi leci putih.
A rank-seven Gu Immortal (七转蛊仙). Its blessed land makes red date essence; with more than nine of it in store it fights harder. = Gu Abadi tingkat tujuh (七转蛊仙). Tanah berkahnya menghasilkan esensi kurma merah; dengan simpanan lebih dari sembilan ia bertarung lebih kuat.
A rank-eight Gu Immortal (八转蛊仙), master of a grotto-heaven. With more than nine white lychee essence in store it fights harder. = Gu Abadi tingkat delapan (八转蛊仙), penguasa sebuah gua surgawi. Dengan simpanan lebih dari sembilan esensi leci putih ia bertarung lebih kuat.
An ancient desolate beast (上古荒兽), about rank seven. Beast tides bring it in the Rank Seven era; its corpse yields 30 immortal materials. = Binatang buas purba kuno (上古荒兽), kira-kira tingkat tujuh. Gelombang binatang membawanya di Era Tingkat Tujuh; bangkainya menghasilkan 30 bahan abadi.
An immemorial desolate beast (太古荒兽), about rank eight; one killed a rank-seven immortal of the Heavenly Court. Its corpse yields 50 immortal materials. = Binatang buas purba abadi (太古荒兽), kira-kira tingkat delapan; seekor pernah membunuh abadi tingkat tujuh dari Istana Langit. Bangkainya menghasilkan 50 bahan abadi.
This immortal came through a heavenly tribulation and may climb to the next rank. = Abadi ini lolos dari kesengsaraan langit dan boleh naik ke tingkat berikutnya.
A one-turn mark while the immortal climbs a rank. = Tanda satu giliran saat sang abadi naik tingkat.
A grotto-heaven (洞天): the rank-eight aperture. 3 white lychee essence, 12 stones and 3 immortal materials a turn; calamities every 10 turns, tribulations every 50 (on Standard). A Venerable leaves it behind. = Gua surgawi (洞天): apertur tingkat delapan. 3 esensi leci putih, 12 batu, dan 3 bahan abadi per giliran; bencana tiap 10 giliran, kesengsaraan tiap 50 (pada kecepatan Standar). Yang Mulia meninggalkannya.
Climb to rank seven: needs a survived heavenly tribulation, dao marks tier II and 60 green grape essence on Standard, at home. It brings 25 Lifespan Gu. = Naik ke tingkat tujuh: perlu selamat dari kesengsaraan langit, jejak dao tingkat II, dan 60 esensi anggur hijau pada kecepatan Standar, di wilayah sendiri. Membawa 25 Gu Umur.
Climb to rank eight: needs another survived tribulation, dao marks tier III and 60 red date essence on Standard, at home. The blessed land becomes a grotto-heaven. It brings 35 Lifespan Gu. = Naik ke tingkat delapan: perlu selamat dari kesengsaraan berikutnya, jejak dao tingkat III, dan 60 esensi kurma merah pada kecepatan Standar, di wilayah sendiri. Tanah berkah menjadi gua surgawi. Membawa 35 Gu Umur.
Rank-seven immortal essence (红枣仙元). Blessed lands of rank-seven immortals make it; rank-seven immortal Gu cost it. = Esensi abadi tingkat tujuh (红枣仙元). Tanah berkah abadi tingkat tujuh menghasilkannya; Gu abadi tingkat tujuh membutuhkannya.
Rank-eight immortal essence (白荔仙元), made by grotto-heavens; rank-eight immortal Gu cost it. = Esensi abadi tingkat delapan (白荔仙元), dihasilkan gua surgawi; Gu abadi tingkat delapan membutuhkannya.
A Venerable (尊者), rank nine: unbeatable in its era, but only long-lived, never eternal. Strength 168; three strikes a turn; walks through anything; enslaves the defeated; every enemy beside it fights 25% weaker. It brings 60 Lifespan Gu and burns one each thirty turns on Standard; with none left it wastes away (7 HP a turn) and heals only by pillaging. Each kill heals 10 HP; it makes 6 yellow apricot essence a turn. = Yang Mulia (尊者), tingkat sembilan: tak terkalahkan di zamannya, tetapi hanya berumur panjang, tidak abadi. Kekuatan 168; tiga serangan per giliran; menembus segala medan; memperbudak yang dikalahkan; setiap musuh di sampingnya bertarung 25% lebih lemah. Ia membawa 60 Gu Umur dan membakar satu tiap tiga puluh giliran pada kecepatan Standar; bila habis, ia merana (7 HP per giliran) dan hanya pulih dengan menjarah. Tiap korban memulihkan 10 HP; ia menghasilkan 6 esensi aprikot kuning per giliran.
A Gu House (仙蛊屋): Longevity Heaven's rank-eight luck altar (劫运坛), a fortress that walks. Needs Connect Luck; one per clan; defends 50% harder. = Rumah Gu (仙蛊屋): altar keberuntungan tingkat delapan milik Langit Umur Panjang (劫运坛), benteng yang berjalan. Butuh Sambung Keberuntungan; satu per klan; bertahan 50% lebih kuat.
A Gu House (万年斗飞车): a rank-eight time-path fortress that sails the river of time. Needs Years Flow Like Water; one per clan; ignores terrain. = Rumah Gu (万年斗飞车): benteng jalur waktu tingkat delapan yang berlayar di sungai waktu. Butuh Tahun Mengalir Seperti Air; satu per klan; mengabaikan medan.
A Gu House (龙宫): a rank-eight dream-token fortress. Needs Dream Token; one per clan; +20% strength against immortals. = Rumah Gu (龙宫): benteng tingkat delapan dari titah mimpi. Butuh Titah Mimpi; satu per klan; +20% kekuatan melawan para abadi.
Rank nine (成尊): a rank-eight immortal of supreme attainment in some path breaks the three blockades. It marks the one Venerable in the world: a rank-eight immortal gains it by its Ascend to Venerable promotion. When the Venerable dies it is removed and the race reopens. = Tingkat sembilan (成尊): abadi tingkat delapan dengan pencapaian tertinggi di suatu jalur menembus tiga blokade. Ia menandai satu-satunya Yang Mulia di dunia: abadi tingkat delapan memperolehnya lewat promosi Naik Menjadi Yang Mulia. Saat Yang Mulia mati, penanda ini dihapus dan perlombaan dibuka kembali.
Eternal life (永生), Fang Yuan's goal, beyond any Venerable. A living Venerable gains it through its Seek Eternal Life promotion (300 yellow apricot essence on Standard) before its lifespan runs out; it wins the game. = Hidup abadi (永生), tujuan Fang Yuan, melampaui Yang Mulia mana pun. Yang Mulia yang masih hidup memperolehnya lewat promosi Mencari Hidup Abadi (300 esensi aprikot kuning pada kecepatan Standar) sebelum umurnya habis; ia memenangkan permainan.
A dead Venerable's true inheritance (真传), which others fight over. Built by the clan holding its seal; a conqueror takes it. +25% battle XP; immortals fight 20% harder. = Warisan sejati (真传) seorang Yang Mulia yang telah mati, yang diperebutkan pihak lain. Dibangun oleh klan pemegang segelnya; penakluk merebutnya. +25% XP pertempuran; para abadi bertarung 20% lebih kuat.
The seal a dead Venerable leaves its clan. It unlocks building the true inheritance. = Segel yang ditinggalkan Yang Mulia yang telah mati untuk klannya. Segel ini membuka pembangunan warisan sejati.
A Venerable refines the world's dao marks of its path (道主). Opens the Venerable Ascension and Eternal Life. = Seorang Yang Mulia memurnikan jejak dao jalurnya di seluruh dunia (道主). Membuka Kenaikan Yang Mulia dan Hidup Abadi.
A Gu House (仙蛊屋) is a formation-path killer move built as a fortress. Opens the Gu Houses (three for any clan, a fourth for the Heavenly Court), each needing its key immortal Gu. = Rumah Gu (仙蛊屋) adalah jurus pamungkas jalur formasi yang dibangun sebagai benteng. Membuka Rumah Gu (tiga untuk klan mana pun, satu lagi untuk Istana Langit), masing-masing butuh Gu abadi kuncinya.
Rank-nine essence (黄杏仙元); even a Venerable runs short of it. Only a living Venerable makes it; Eternal Life costs 300 on Standard. = Esensi tingkat sembilan (黄杏仙元); bahkan Yang Mulia pun kekurangan. Hanya Yang Mulia yang hidup yang menghasilkannya; Hidup Abadi membutuhkan 300 pada kecepatan Standar.
Eternal life, beyond any Venerable: raise a Venerable and have it seek Eternal Life (its Seek Eternal Life promotion) before its lifespan runs out. = Hidup abadi, melampaui Yang Mulia mana pun: lahirkan seorang Yang Mulia dan biarkan ia meraih Hidup Abadi (promosi Mencari Hidup Abadi) sebelum umurnya habis.
Gu Houses: immortal fortresses that walk, one of each per clan, each built around its key immortal Gu. = Rumah Gu: benteng abadi yang berjalan, masing-masing satu per klan, dibangun di sekitar Gu abadi kuncinya.
Wisdom Gu (智慧蛊), rank nine, wisdom path: its light speeds every deduction, at a cost in lifespan; second only to Fate Gu in the Heavenly Court's eyes. +30% science; burns a Lifespan Gu every five turns. Costs yellow apricot essence on top of production; a captured city keeps it. = Gu Kebijaksanaan (智慧蛊), tingkat sembilan, jalur kebijaksanaan: cahayanya mempercepat setiap deduksi, dengan harga umur; di mata Istana Langit hanya kalah dari Gu Takdir. +30% sains; membakar satu Gu Umur tiap lima giliran. Membutuhkan esensi aprikot kuning selain produksi; kota yang direbut tetap memilikinya.
Derivation Gu (衍化蛊), rank nine, rule path: derives new results from given inputs, the core of a Heavenly Court formation. Buildings are built 30% faster. Costs yellow apricot essence on top of production; a captured city keeps it. = Gu Derivasi (衍化蛊), tingkat sembilan, jalur aturan: menurunkan hasil baru dari masukan yang ada, inti sebuah formasi Istana Langit. Bangunan dibangun 30% lebih cepat. Membutuhkan esensi aprikot kuning selain produksi; kota yang direbut tetap memilikinya.
Giant Sun's tiered inheritance tower in the Imperial Court Blessed Land; only thick Huang Jin blood may enter. +15% stones; luck-path units fight 15% harder. Built only by a clan holding its seal, which a trial grants (八十八角真阳楼); a captured city keeps it. = Menara warisan bertingkat Matahari Raksasa di Tanah Berkah Istana Kekaisaran; hanya darah Huang Jin yang kental yang boleh masuk. +15% batu; unit jalur keberuntungan bertarung 15% lebih kuat. Hanya bisa dibangun klan yang memegang segelnya, yang diberikan lewat ujian (八十八角真阳楼); kota yang direbut tetap memilikinya.
The seal of the 88 True Yang Building: proof that the clan passed its trial. It unlocks building the inheritance; it cannot be built. = Segel Gedung Yang Sejati 88: bukti bahwa klan lulus ujiannya. Segel ini membuka pembangunan warisan itu; segel tidak bisa dibangun.
Recipes for rank-nine immortal Gu; fewer than ten exist at a time. They cost yellow apricot essence, which only a Venerable makes. = Resep Gu abadi tingkat sembilan; kurang dari sepuluh ada pada satu waktu. Membutuhkan esensi aprikot kuning, yang hanya dihasilkan Yang Mulia.
The Heavenly Court's rank-nine Gu House (监天塔) around Fate Gu: it watches the world (+2 sight) and holds fast (+25% defending). Needs Fate Gu. = Rumah Gu tingkat sembilan Istana Langit (监天塔) di sekitar Gu Takdir: mengawasi dunia (+2 penglihatan) dan bertahan kokoh (+25% saat bertahan). Butuh Gu Takdir.
An immortal turned zombie (仙僵): no ageing, a dead aperture, no healing except by pillage. When the Zombie Alliance loses an immortal, one rises. Weaker while Fate Gu stands. = Abadi yang menjadi mayat hidup (仙僵): tidak menua, apertur mati, tidak pulih kecuali dengan menjarah. Saat Aliansi Mayat Hidup kehilangan seorang abadi, satu bangkit. Lebih lemah selama Gu Takdir berdiri.
Fate Gu (宿命蛊), rank nine: it fixes every being's destiny. Only the Heavenly Court builds it; whoever conquers its city fights the Fate War. Immortals +15% strength; +2 happiness. = Gu Takdir (宿命蛊), tingkat sembilan: menetapkan takdir setiap makhluk. Hanya Istana Langit yang membangunnya; siapa pun yang menaklukkan kotanya menghadapi Perang Takdir. Para abadi +15% kekuatan; +2 kebahagiaan.
Proof that this clan shattered Fate Gu. It can never be rebuilt, and the qi tides sweep the world. = Bukti bahwa klan ini menghancurkan Gu Takdir. Gu itu tak pernah bisa dibangun lagi, dan pasang qi menyapu dunia.
Proof that this clan seized Fate Gu from the Heavenly Court and kept it. = Bukti bahwa klan ini merebut Gu Takdir dari Istana Langit dan menyimpannya.
The Heavenly Court (天庭), founded by Primordial Origin: it guards and repairs Fate Gu and rules the Central Continent through the ancient sects. Only it builds Fate Gu. = Istana Langit (天庭), didirikan Asal Primordial: menjaga dan memperbaiki Gu Takdir serta menguasai Benua Tengah lewat sekte-sekte kuno. Hanya ia yang membangun Gu Takdir.
The Huang Jin (黄金家族), every bloodline of Giant Sun on the Northern Plains. No Huang Jin line may be wiped out; only they may pass the 88 True Yang Building's trial. = Huang Jin (黄金家族), seluruh garis darah Matahari Raksasa di Dataran Utara. Tak satu pun garis Huang Jin boleh punah; hanya mereka yang boleh lulus ujian Gedung Yang Sejati 88.
The Zombie Alliance (僵盟): immortal zombies with a righteous face and a secret master. Its immortals never age but their blessed lands make no essence (plunder and trade must feed them), and its fallen rise again as zombies. = Aliansi Mayat Hidup (僵盟): mayat hidup abadi dengan wajah lurus dan tuan rahasia. Para abadinya tak pernah menua tetapi tanah berkah mereka tak menghasilkan esensi (jarahan dan dagang yang memberi makan), dan yang gugur bangkit lagi sebagai mayat hidup.
The Fang clan (房家), a righteous Western Desert power unrivalled at building Gu Houses. Gu Houses +50% production; +10% science. = Klan Fang (房家), kekuatan lurus Gurun Barat yang tak tertandingi dalam membangun Rumah Gu. Rumah Gu +50% produksi; +10% sains.
The hairy-men refiners of the Lang Ya Blessed Land (琅琊派), whose land spirit trades Gu. = Para penyuling manusia berbulu dari Tanah Berkah Lang Ya (琅琊派), yang roh tanahnya memperdagangkan Gu.
Spirit Affinity House (灵缘斋), one of the ten great ancient sects of the Central Continent. = Rumah Afinitas Roh (灵缘斋), salah satu dari sepuluh sekte kuno besar Benua Tengah.
Combat Immortal Sect (战仙宗), one of the ten great ancient sects, famed for battle. = Sekte Abadi Tempur (战仙宗), salah satu dari sepuluh sekte kuno besar, termasyhur dalam pertempuran.
The merfolk's court in the Eastern Sea (鲛人王庭). = Istana kaum duyung di Laut Timur (鲛人王庭).
Rank nine (九转): the Venerables. One alone outweighs a region; while one lives, every other clan fights in its shadow. = Tingkat sembilan (九转): para Yang Mulia. Seorang saja melebihi satu wilayah; selama ia hidup, setiap klan lain bertarung di bawah bayangannya.
A Venerable's will reaches every region. While a Venerable lives, its clan thrives (+20% production, +3 happiness) and every other clan fights 10% weaker, loses 2 happiness, and meets the Venerable's Shadow. = Kehendak seorang Yang Mulia menjangkau setiap wilayah. Selama Yang Mulia hidup, klannya berjaya (+20% produksi, +3 kebahagiaan) dan setiap klan lain bertarung 10% lebih lemah, kehilangan 2 kebahagiaan, dan menghadapi Bayang-bayang Yang Mulia.
A Venerable's killer move for one turn: double strength. Costs 20 yellow apricot essence. = Jurus pamungkas Yang Mulia selama satu giliran: kekuatan berlipat dua. Membutuhkan 20 esensi aprikot kuning.
Every 25 turns on Standard a chaos calamity (混沌大难) falls on the Venerable: 40 yellow apricot essence and 10 HP, or 25 HP of its burning life. = Setiap 25 giliran pada kecepatan Standar bencana kekacauan (混沌大难) jatuh pada Yang Mulia: 40 esensi aprikot kuning dan 10 HP, atau 25 HP dari hidupnya yang terbakar.
Dang Hun Mountain (荡魂山), a secret realm of heaven and earth. A mountain that shakes the soul harder the higher one climbs; broken souls become Guts Gu. Units beside it are tempered: +15% battle XP. = Gunung Dang Hun (荡魂山), alam rahasia langit dan bumi. Gunung yang mengguncang jiwa makin keras makin tinggi didaki; jiwa yang hancur menjadi Gu Nyali. Unit di sampingnya tertempa: +15% XP pertempuran.
Granted for the rest of the game to land units that stood beside Dang Hun Mountain. = Diberikan seumur permainan kepada unit darat yang pernah berdiri di samping Gunung Dang Hun.
Luo Po Valley (落魄谷), a secret realm of heaven and earth. A valley of soul-loosening fog and soul-cutting wind, one of the soul path's two holy lands. Units that end their turn inside take 15 damage; units beside it fight 10% harder. = Lembah Luo Po (落魄谷), alam rahasia langit dan bumi. Lembah kabut pelepas jiwa dan angin pemotong jiwa, salah satu dari dua tanah suci jalur jiwa. Unit yang mengakhiri giliran di dalamnya menerima 15 kerusakan; unit di sampingnya bertarung 10% lebih kuat.
Granted for the rest of the game to land units that stood beside Luo Po Valley. = Diberikan seumur permainan kepada unit darat yang pernah berdiri di samping Lembah Luo Po.
Reverse Flow River (逆流河), a secret realm of heaven and earth. A river where no Gu works and attacks rebound. Units beside it bear its seal: +15% defending. = Sungai Arus Balik (逆流河), alam rahasia langit dan bumi. Sungai tempat Gu tak berfungsi dan serangan berbalik. Unit di sampingnya membawa segelnya: +15% saat bertahan.
Granted for the rest of the game to land units that stood beside Reverse Flow River. = Diberikan seumur permainan kepada unit darat yang pernah berdiri di samping Sungai Arus Balik.
River of Time (光阴长河), a secret realm of heaven and earth. Time-path currents where Red Lotus's stone lotus islands drift. Units beside it fight 10% harder. = Sungai Waktu (光阴长河), alam rahasia langit dan bumi. Arus jalur waktu tempat pulau-pulau teratai batu Teratai Merah hanyut. Unit di sampingnya bertarung 10% lebih kuat.
Granted for the rest of the game to land units that stood beside River of Time. = Diberikan seumur permainan kepada unit darat yang pernah berdiri di samping Sungai Waktu.
Door of Life and Death (生死门), a secret realm of heaven and earth. The door that draws the dead in; since Fate Gu's wound some escape as zombies. Units beside it heal 10 HP more. = Pintu Hidup dan Mati (生死门), alam rahasia langit dan bumi. Pintu yang menarik masuk orang mati; sejak Gu Takdir terluka sebagian lolos sebagai mayat hidup. Unit di sampingnya pulih 10 HP lebih banyak.
Granted for the rest of the game to land units that stood beside Door of Life and Death. = Diberikan seumur permainan kepada unit darat yang pernah berdiri di samping Pintu Hidup dan Mati.
Book Mountain (书山), a secret realm of heaven and earth. A mountain of books with an ink waterfall and a literature spring. +5 science; units beside it gain 20% more XP. = Gunung Buku (书山), alam rahasia langit dan bumi. Gunung buku dengan air terjun tinta dan mata air sastra. +5 sains; unit di sampingnya mendapat 20% XP lebih banyak.
Granted for the rest of the game to land units that stood beside Book Mountain. = Diberikan seumur permainan kepada unit darat yang pernah berdiri di samping Gunung Buku.
Crazed Demon Cave (疯魔窟), a secret realm of heaven and earth. A cave whose demonic sound drives creatures mad; Limitless's inheritance lies within. Units that end their turn inside take 20 damage; units beside it attack 15% harder. = Gua Iblis Gila (疯魔窟), alam rahasia langit dan bumi. Gua yang suara iblisnya membuat makhluk gila; warisan Tanpa Batas ada di dalamnya. Unit yang mengakhiri giliran di dalamnya menerima 20 kerusakan; unit di sampingnya menyerang 15% lebih kuat.
Granted for the rest of the game to land units that stood beside Crazed Demon Cave. = Diberikan seumur permainan kepada unit darat yang pernah berdiri di samping Gua Iblis Gila.
Dragon Whale Paradise (龙鲸乐土), a secret realm of heaven and earth. Paradise Earth's Eastern Sea inheritance inside the azure dragon whale. Units beside it heal 10 HP more. = Surga Paus Naga (龙鲸乐土), alam rahasia langit dan bumi. Warisan Laut Timur Bumi Surga di dalam paus naga biru. Unit di sampingnya pulih 10 HP lebih banyak.
Granted for the rest of the game to land units that stood beside Dragon Whale Paradise. = Diberikan seumur permainan kepada unit darat yang pernah berdiri di samping Surga Paus Naga.
Tian Ti Mountain (天梯山), a secret realm of heaven and earth. The ruined stair to the Heavenly Court; fighting on it affronts the Court. Units beside it see 1 tile farther. = Gunung Tian Ti (天梯山), alam rahasia langit dan bumi. Tangga runtuh menuju Istana Langit; bertarung di atasnya menghina Istana. Unit di sampingnya melihat 1 petak lebih jauh.
Granted for the rest of the game to land units that stood beside Tian Ti Mountain. = Diberikan seumur permainan kepada unit darat yang pernah berdiri di samping Gunung Tian Ti.
Lang Ya Blessed Land (琅琊福地), a secret realm of heaven and earth. The hairy men's blessed land, where refinement succeeds more often and the land spirit trades Gu. Units beside it fight 10% harder. = Tanah Berkah Lang Ya (琅琊福地), alam rahasia langit dan bumi. Tanah berkah manusia berbulu, tempat penyulingan lebih sering berhasil dan roh tanah memperdagangkan Gu. Unit di sampingnya bertarung 10% lebih kuat.
Granted for the rest of the game to land units that stood beside Lang Ya Blessed Land. = Diberikan seumur permainan kepada unit darat yang pernah berdiri di samping Tanah Berkah Lang Ya.
Imperial Court Blessed Land (王庭福地), a secret realm of heaven and earth. Opens every ten years to the contest's winner and shelters from the killing blizzard. Units beside it defend 15% harder. = Tanah Berkah Istana Kekaisaran (王庭福地), alam rahasia langit dan bumi. Terbuka setiap sepuluh tahun bagi pemenang kontes dan melindungi dari badai salju maut. Unit di sampingnya bertahan 15% lebih kuat.
Granted for the rest of the game to land units that stood beside Imperial Court Blessed Land. = Diberikan seumur permainan kepada unit darat yang pernah berdiri di samping Tanah Berkah Istana Kekaisaran.
Hu Immortal Blessed Land (狐仙福地), a secret realm of heaven and earth. A rank-six aperture on Tian Ti Mountain, won by the first to climb Dang Hun Mountain. +3 happiness; units beside it move 1 tile farther. = Tanah Berkah Abadi Hu (狐仙福地), alam rahasia langit dan bumi. Apertur tingkat enam di Gunung Tian Ti, dimenangkan oleh yang pertama mendaki Gunung Dang Hun. +3 kebahagiaan; unit di sampingnya bergerak 1 petak lebih jauh.
Granted for the rest of the game to land units that stood beside Hu Immortal Blessed Land. = Diberikan seumur permainan kepada unit darat yang pernah berdiri di samping Tanah Berkah Abadi Hu.
A rank-eight immortal of supreme attainment breaks the three blockades and becomes a Venerable (dao marks tier IV and 60 white lychee essence on Standard, at home). It brings 60 Lifespan Gu. Only one Venerable lives in the world at a time. = Abadi tingkat delapan dengan pencapaian tertinggi menembus tiga blokade dan menjadi Yang Mulia (jejak dao tingkat IV dan 60 esensi leci putih pada kecepatan Standar, di wilayah sendiri). Membawa 60 Gu Umur. Hanya satu Yang Mulia hidup di dunia pada satu waktu.
The Venerable spends 300 yellow apricot essence (on Standard) on eternal life, Fang Yuan's goal: its clan wins the game. = Yang Mulia menghabiskan 300 esensi aprikot kuning (pada kecepatan Standar) untuk hidup abadi, tujuan Fang Yuan: klannya memenangkan permainan.
Tier I: +10% strength. Dao marks (道痕) are engraved in a cultivator's body and aperture: the more of its path, the stronger its methods; marks of different paths interfere. They grow one tier every 20 turns on Standard for a path's Master of rank three or more, and an immortal also takes a tier from every immortal it kills and every heavenly tribulation it survives. Mortals hold at most tier II; rank seven needs tier II, rank eight tier III, the Venerable tier IV. = Tingkat I: +10% kekuatan. Jejak dao (道痕) terukir di tubuh dan apertur seorang kultivator: makin banyak jejak jalurnya, makin kuat metodenya; jejak jalur yang berbeda saling mengganggu. Jejak bertambah satu tingkat tiap 20 giliran pada kecepatan Standar bagi Ahli jalur tingkat tiga ke atas, dan seorang abadi juga mendapat satu tingkat dari setiap abadi yang dibunuhnya dan setiap kesengsaraan langit yang dilaluinya. Manusia fana paling banyak tingkat II; tingkat tujuh butuh tingkat II, tingkat delapan tingkat III, Yang Mulia tingkat IV.
Tier II: +20% strength. Dao marks (道痕) are engraved in a cultivator's body and aperture: the more of its path, the stronger its methods; marks of different paths interfere. They grow one tier every 20 turns on Standard for a path's Master of rank three or more, and an immortal also takes a tier from every immortal it kills and every heavenly tribulation it survives. Mortals hold at most tier II; rank seven needs tier II, rank eight tier III, the Venerable tier IV. = Tingkat II: +20% kekuatan. Jejak dao (道痕) terukir di tubuh dan apertur seorang kultivator: makin banyak jejak jalurnya, makin kuat metodenya; jejak jalur yang berbeda saling mengganggu. Jejak bertambah satu tingkat tiap 20 giliran pada kecepatan Standar bagi Ahli jalur tingkat tiga ke atas, dan seorang abadi juga mendapat satu tingkat dari setiap abadi yang dibunuhnya dan setiap kesengsaraan langit yang dilaluinya. Manusia fana paling banyak tingkat II; tingkat tujuh butuh tingkat II, tingkat delapan tingkat III, Yang Mulia tingkat IV.
Tier III: +30% strength. Dao marks (道痕) are engraved in a cultivator's body and aperture: the more of its path, the stronger its methods; marks of different paths interfere. They grow one tier every 20 turns on Standard for a path's Master of rank three or more, and an immortal also takes a tier from every immortal it kills and every heavenly tribulation it survives. Mortals hold at most tier II; rank seven needs tier II, rank eight tier III, the Venerable tier IV. = Tingkat III: +30% kekuatan. Jejak dao (道痕) terukir di tubuh dan apertur seorang kultivator: makin banyak jejak jalurnya, makin kuat metodenya; jejak jalur yang berbeda saling mengganggu. Jejak bertambah satu tingkat tiap 20 giliran pada kecepatan Standar bagi Ahli jalur tingkat tiga ke atas, dan seorang abadi juga mendapat satu tingkat dari setiap abadi yang dibunuhnya dan setiap kesengsaraan langit yang dilaluinya. Manusia fana paling banyak tingkat II; tingkat tujuh butuh tingkat II, tingkat delapan tingkat III, Yang Mulia tingkat IV.
Tier IV: +40% strength, heals 10 HP more. Dao marks (道痕) are engraved in a cultivator's body and aperture: the more of its path, the stronger its methods; marks of different paths interfere. They grow one tier every 20 turns on Standard for a path's Master of rank three or more, and an immortal also takes a tier from every immortal it kills and every heavenly tribulation it survives. Mortals hold at most tier II; rank seven needs tier II, rank eight tier III, the Venerable tier IV. = Tingkat IV: +40% kekuatan, pulih 10 HP lebih banyak. Jejak dao (道痕) terukir di tubuh dan apertur seorang kultivator: makin banyak jejak jalurnya, makin kuat metodenya; jejak jalur yang berbeda saling mengganggu. Jejak bertambah satu tingkat tiap 20 giliran pada kecepatan Standar bagi Ahli jalur tingkat tiga ke atas, dan seorang abadi juga mendapat satu tingkat dari setiap abadi yang dibunuhnya dan setiap kesengsaraan langit yang dilaluinya. Manusia fana paling banyak tingkat II; tingkat tujuh butuh tingkat II, tingkat delapan tingkat III, Yang Mulia tingkat IV.
Tier V: +55% strength, heals 15 HP more. Dao marks (道痕) are engraved in a cultivator's body and aperture: the more of its path, the stronger its methods; marks of different paths interfere. They grow one tier every 20 turns on Standard for a path's Master of rank three or more, and an immortal also takes a tier from every immortal it kills and every heavenly tribulation it survives. Mortals hold at most tier II; rank seven needs tier II, rank eight tier III, the Venerable tier IV. = Tingkat V: +55% kekuatan, pulih 15 HP lebih banyak. Jejak dao (道痕) terukir di tubuh dan apertur seorang kultivator: makin banyak jejak jalurnya, makin kuat metodenya; jejak jalur yang berbeda saling mengganggu. Jejak bertambah satu tingkat tiap 20 giliran pada kecepatan Standar bagi Ahli jalur tingkat tiga ke atas, dan seorang abadi juga mendapat satu tingkat dari setiap abadi yang dibunuhnya dan setiap kesengsaraan langit yang dilaluinya. Manusia fana paling banyak tingkat II; tingkat tujuh butuh tingkat II, tingkat delapan tingkat III, Yang Mulia tingkat IV.
A Master contemplating its path: when this runs out (20 turns on Standard) its dao marks grow by one tier. = Seorang Ahli merenungkan jalurnya: saat ini habis (20 giliran pada kecepatan Standar) jejak dao-nya bertambah satu tingkat.
The region wall of the Southern Border (瘴气界壁). It holds back the strong, not the weak: anyone can push through, slowly, and a unit that ends its turn inside takes 15 damage. An immortal is dragged harder by rank: 10 more at rank six, 30 at seven, 60 at eight, so rank-eight immortals all but never cross. Found on the Five Regions map. = Dinding wilayah Perbatasan Selatan (瘴气界壁). Ia menahan yang kuat, bukan yang lemah: siapa pun bisa menembusnya, perlahan, dan unit yang mengakhiri giliran di dalamnya menerima 15 kerusakan. Abadi ditarik lebih keras sesuai tingkatnya: 10 lagi di tingkat enam, 30 di tujuh, 60 di delapan, sehingga abadi tingkat delapan nyaris tak pernah menyeberang. Ada di peta Lima Wilayah.
The region wall of the Northern Plains (甘草界壁). It holds back the strong, not the weak: anyone can push through, slowly, and a unit that ends its turn inside takes 10 damage. An immortal is dragged harder by rank: 10 more at rank six, 30 at seven, 60 at eight, so rank-eight immortals all but never cross. Found on the Five Regions map. = Dinding wilayah Dataran Utara (甘草界壁). Ia menahan yang kuat, bukan yang lemah: siapa pun bisa menembusnya, perlahan, dan unit yang mengakhiri giliran di dalamnya menerima 10 kerusakan. Abadi ditarik lebih keras sesuai tingkatnya: 10 lagi di tingkat enam, 30 di tujuh, 60 di delapan, sehingga abadi tingkat delapan nyaris tak pernah menyeberang. Ada di peta Lima Wilayah.
The region wall of the Eastern Sea (苍水界壁). It holds back the strong, not the weak: anyone can push through, slowly, and a unit that ends its turn inside takes 10 damage. An immortal is dragged harder by rank: 10 more at rank six, 30 at seven, 60 at eight, so rank-eight immortals all but never cross. Found on the Five Regions map. = Dinding wilayah Laut Timur (苍水界壁). Ia menahan yang kuat, bukan yang lemah: siapa pun bisa menembusnya, perlahan, dan unit yang mengakhiri giliran di dalamnya menerima 10 kerusakan. Abadi ditarik lebih keras sesuai tingkatnya: 10 lagi di tingkat enam, 30 di tujuh, 60 di delapan, sehingga abadi tingkat delapan nyaris tak pernah menyeberang. Ada di peta Lima Wilayah.
The region wall of the Western Desert (狂炎界壁). It holds back the strong, not the weak: anyone can push through, slowly, and a unit that ends its turn inside takes 15 damage. An immortal is dragged harder by rank: 10 more at rank six, 30 at seven, 60 at eight, so rank-eight immortals all but never cross. Found on the Five Regions map. = Dinding wilayah Gurun Barat (狂炎界壁). Ia menahan yang kuat, bukan yang lemah: siapa pun bisa menembusnya, perlahan, dan unit yang mengakhiri giliran di dalamnya menerima 15 kerusakan. Abadi ditarik lebih keras sesuai tingkatnya: 10 lagi di tingkat enam, 30 di tujuh, 60 di delapan, sehingga abadi tingkat delapan nyaris tak pernah menyeberang. Ada di peta Lima Wilayah.
The region wall of the Central Continent (圣贤界壁). It holds back the strong, not the weak: anyone can push through, slowly, and a unit that ends its turn inside takes 10 damage. An immortal is dragged harder by rank: 10 more at rank six, 30 at seven, 60 at eight, so rank-eight immortals all but never cross. Found on the Five Regions map. = Dinding wilayah Benua Tengah (圣贤界壁). Ia menahan yang kuat, bukan yang lemah: siapa pun bisa menembusnya, perlahan, dan unit yang mengakhiri giliran di dalamnya menerima 10 kerusakan. Abadi ditarik lebih keras sesuai tingkatnya: 10 lagi di tingkat enam, 30 di tujuh, 60 di delapan, sehingga abadi tingkat delapan nyaris tak pernah menyeberang. Ada di peta Lima Wilayah.
Lakes give fresh water to the tiles beside them, so farms can be built there (as beside rivers and oases). = Danau memberi air tawar ke petak di sampingnya, sehingga ladang bisa dibangun di sana (seperti di samping sungai dan oasis).
An oasis gives fresh water to the tiles beside it, so farms can be built there (as beside rivers and lakes). = Oasis memberi air tawar ke petak di sampingnya, sehingga ladang bisa dibangun di sana (seperti di samping sungai dan danau).
Rivers run along tile edges and give fresh water to the tiles on both sides, so farms can be built there. Crossing one takes all remaining movement; attacking across one costs 20% strength. = Sungai mengalir di tepi petak dan memberi air tawar ke petak di kedua sisinya, sehingga ladang bisa dibangun di sana. Menyeberanginya menghabiskan semua sisa gerak; menyerang menyeberanginya mengurangi kekuatan 20%.
A marsh slows every step. Clear it (Remove Marsh) before building on the tile. = Rawa memperlambat setiap langkah. Bersihkan dulu (Hapus Rawa) sebelum membangun di petak ini.
A lone Gu Master (散修) with no clan behind him: he lives by his own Gu and his wits, and robs as readily as he trades. Strength 11, 20% stronger when defending. Barbarian camps send him out once every clan knows Rank Two Cultivation; the Wandering Gu Master event may bring one to your door. = Gu Master penyendiri (散修) tanpa klan di belakangnya: ia hidup dari Gu dan akalnya sendiri, dan merampok semudah ia berdagang. Kekuatan 11, 20% lebih kuat saat bertahan. Kamp barbar mengirimnya begitu semua klan mengenal Kultivasi Tingkat Dua; event Gu Master Pengembara bisa membawanya ke pintumu.
A demonic-path Gu Master (魔道蛊师): he takes what he wants and kills for Gu. Strength 18, 20% stronger when attacking, heals 15 HP per kill. He raids from Demonic Dens and in the Demonic Raid event. = Gu Master jalan iblis (魔道蛊师): ia mengambil apa yang ia mau dan membunuh demi Gu. Kekuatan 18, 20% lebih kuat saat menyerang, pulih 15 HP per korban. Ia menyerbu dari Sarang Iblis dan dalam event Penyerbuan Iblis.
A demonic elder (魔道长老) of rank five, who leads the raids. Strength 35, 20% stronger when attacking, heals 20 HP per kill, and every enemy soldier beside him fights 10% weaker. = Tetua iblis (魔道长老) tingkat lima yang memimpin penyerbuan. Kekuatan 35, 20% lebih kuat saat menyerang, pulih 20 HP per korban, dan setiap prajurit musuh di sampingnya bertarung 10% lebih lemah.
A den of demonic Gu Masters (魔窟). Raiders keep coming out of it until someone clears it, in every region of the world. = Sarang Gu Master iblis (魔窟). Para penyerbu terus keluar darinya sampai seseorang membersihkannya, di setiap wilayah dunia.
The Man Tribe (蛮家), a large Northern Plains tribe that holds Red Flame Valley, a shelter from the great blizzards. It has swallowed many small tribes and bullies the rest. A Battle Tribe: its friends receive Gu Masters. = Suku Man (蛮家), suku besar Dataran Utara yang menguasai Lembah Api Merah, tempat berlindung dari badai salju besar. Ia telah menelan banyak suku kecil dan menindas sisanya. Suku Perang: sahabatnya menerima Gu Master.
The Ge Tribe (葛家), a poor, small Northern Plains tribe, too small to enter the Imperial Court contest on its own. It looks for a strong friend. = Suku Ge (葛家), suku kecil dan miskin di Dataran Utara, terlalu kecil untuk ikut perebutan Istana Kekaisaran sendirian. Ia mencari sahabat yang kuat.
The Lan Clan (兰家) rules Zhou Xi Oasis in the Western Desert and forbids anyone to fly over it. = Klan Lan (兰家) menguasai Oasis Zhou Xi di Gurun Barat dan melarang siapa pun terbang di atasnya.
The Mo Clan (莫家), a super force of the Western Desert based at Sand Wolf City. A Battle Tribe: its friends receive Gu Masters. = Klan Mo (莫家), kekuatan super Gurun Barat yang berpusat di Kota Serigala Pasir. Suku Perang: sahabatnya menerima Gu Master.
The Xiao Clan (萧家), the richest traders of the Western Desert, whose caravans run the Silk Corridor. = Klan Xiao (萧家), pedagang terkaya di Gurun Barat, yang kafilahnya menjalankan Koridor Sutra.
The Song Clan (宋家), one of the Eastern Sea's ten great righteous houses, light and water path, seated in Heavy Water Blessed Land. = Klan Song (宋家), salah satu dari sepuluh keluarga lurus besar di Laut Timur, jalur cahaya dan air, berkedudukan di Tanah Berkah Air Berat.
The Xia Clan (夏家), the weakest water-path clan on the far edge of the Eastern Sea, always at odds with its neighbours and with the Merman Imperial Court. A Battle Tribe: its friends receive Gu Masters. = Klan Xia (夏家), klan jalur air terlemah di tepi jauh Laut Timur, selalu berselisih dengan tetangganya dan Istana Kekaisaran Duyung. Suku Perang: sahabatnya menerima Gu Master.
The Immortal Crane Sect (仙鹤门), one of the ten great ancient sects, seated on Fei He Mountain. The Gu Yue founder came from it, and it hunts demonic Gu Masters. = Sekte Bangau Abadi (仙鹤门), salah satu dari sepuluh sekte kuno besar, berkedudukan di Gunung Fei He. Pendiri Gu Yue berasal darinya, dan sekte ini memburu Gu Master iblis.
Heavenly Lotus Sect (天莲派), one of the ten great ancient sects. Its seat is a blessed land on a mountain rich in natural dao marks, and it alone owns four Gu Houses. = Sekte Teratai Langit (天莲派), salah satu dari sepuluh sekte kuno besar. Kedudukannya sebuah tanah berkah di gunung yang kaya tanda dao alami, dan ia sendiri memiliki empat Rumah Gu.
Spirit Butterfly Valley (灵蝶谷), one of the ten great ancient sects, the best of them at information-path arts. = Lembah Kupu-Kupu Roh (灵蝶谷), salah satu dari sepuluh sekte kuno besar, yang paling ahli dalam seni jalur informasi.
Ancient Soul Sect (古魂门), one of the ten great ancient sects. For thousands of years it has ruled the far west of the Central Continent from its seat above the Earth Abyss. = Sekte Jiwa Kuno (古魂门), salah satu dari sepuluh sekte kuno besar. Selama ribuan tahun ia menguasai ujung barat Benua Tengah dari kedudukannya di atas Jurang Bumi.
Heaven's Envy Tower (天妒楼), one of the ten great ancient sects, known for its healers and its wisdom-path immortals. = Menara Iri Langit (天妒楼), salah satu dari sepuluh sekte kuno besar, dikenal karena para penyembuhnya dan Gu Abadi jalur kebijaksanaannya.
Wind Cloud Manor (风云府), one of the ten great ancient sects, famed across the continent for its Gu formations. = Kediaman Angin Awan (风云府), salah satu dari sepuluh sekte kuno besar, termasyhur di seluruh benua karena formasi Gu-nya.
Black Heaven Temple (黑天寺), one of the ten great ancient sects. Its word alone can brand an immortal demonic and set the ten sects hunting him. = Kuil Langit Hitam (黑天寺), salah satu dari sepuluh sekte kuno besar. Ucapannya saja cukup untuk mencap seorang Gu Abadi sebagai iblis dan membuat sepuluh sekte memburunya.
Myriad Dragon Dock (万龙坞), one of the ten great ancient sects. Its blessed land lies on an island in the middle of Dragon Lake, next to the Immortal Crane Sect's lands. = Dermaga Selaksa Naga (万龙坞), salah satu dari sepuluh sekte kuno besar. Tanah berkahnya terletak di sebuah pulau di tengah Danau Naga, bersebelahan dengan wilayah Sekte Bangau Abadi.
The Wan clan (万家) of Gao Song Oasis, the second resource point of the Western Desert. It rallies the desert's righteous families against the Fang clan. = Klan Wan (万家) dari Oasis Gao Song, titik sumber daya kedua Gurun Barat. Ia menghimpun keluarga-keluarga lurus gurun melawan Klan Fang.
Middle stage (中阶), the second of a rank's four small stages. A Gu Master climbs them by cultivating, faster with a better aptitude; each stage adds 5% Strength, and a new rank starts again at initial. = Tahap menengah (中阶), tahap kecil kedua dari empat di setiap rank. Gu Master menaikinya dengan berkultivasi, lebih cepat dengan bakat yang lebih baik; tiap tahap menambah Kekuatan 5%, dan rank baru dimulai lagi dari tahap awal.
Upper stage (高阶), the third small stage of a rank: 5% more Strength again. = Tahap atas (高阶), tahap kecil ketiga sebuah rank: Kekuatan 5% lagi.
Peak stage (巅峰), the top of a rank. From here the breakthrough to the next rank costs 30% fewer stones; before the peak it costs 50% more. = Tahap puncak (巅峰), puncak sebuah rank. Dari sini terobosan ke rank berikutnya 30% lebih murah; sebelum puncak 50% lebih mahal.
Cultivating towards the next small stage. When the count runs out the unit climbs one stage: every 8 turns with grade A aptitude, 10 with B, 12 with C, 16 with D, 5 with an extreme physique (Standard speed); twice as long for an immortal. = Berkultivasi menuju tahap kecil berikutnya. Saat hitungannya habis, unit naik satu tahap: tiap 8 giliran dengan bakat A, 10 dengan B, 12 dengan C, 16 dengan D, 5 dengan fisik ekstrem (kecepatan Standar); dua kali lebih lama bagi Gu Abadi.
One of the ten extreme physiques (十绝体), one awakening in a hundred: the essence fills the whole aperture. +20% Strength, +50% XP from combat, 20% less upkeep, a small stage every 5 turns. Heaven does not suffer it: when the Doomed Aperture runs out, a bearer still mortal bursts and dies; only ascending to rank six saves it. = Salah satu dari sepuluh fisik ekstrem (十绝体), satu dari seratus kebangkitan: esensinya memenuhi seluruh apertur. Kekuatan +20%, XP dari pertempuran +50%, pemeliharaan 20% lebih murah, satu tahap kecil tiap 5 giliran. Langit tak menoleransinya: saat Apertur Terkutuk habis, pembawa yang masih fana meledak dan mati; hanya naik ke rank enam yang menyelamatkannya.
The extreme physique's countdown. When it runs out, a bearer still below rank six dies. = Hitung mundur fisik ekstrem. Saat habis, pembawa yang masih di bawah rank enam mati.
Green Copper relic Gu (青铜舍利蛊): used once, it lifts a rank-one Gu Master one small stage at once. It costs 25 primeval stones and is spent. = Gu relik tembaga hijau (青铜舍利蛊): sekali pakai, mengangkat Gu Master rank satu satu tahap kecil seketika. Harganya 25 batu primordial dan habis terpakai.
Red Iron relic Gu (赤铁舍利蛊): used once, it lifts a rank-two Gu Master one small stage at once. It costs 40 primeval stones and is spent. = Gu relik besi merah (赤铁舍利蛊): sekali pakai, mengangkat Gu Master rank dua satu tahap kecil seketika. Harganya 40 batu primordial dan habis terpakai.
White Silver relic Gu (白银舍利蛊): used once, it lifts a rank-three Gu Master one small stage at once. It costs 60 primeval stones and is spent. = Gu relik perak putih (白银舍利蛊): sekali pakai, mengangkat Gu Master rank tiga satu tahap kecil seketika. Harganya 60 batu primordial dan habis terpakai.
Yellow Gold relic Gu (黄金舍利蛊): used once, it lifts a rank-four Gu Master one small stage at once. It costs 90 primeval stones and is spent. = Gu relik emas kuning (黄金舍利蛊): sekali pakai, mengangkat Gu Master rank empat satu tahap kecil seketika. Harganya 90 batu primordial dan habis terpakai.
Purple Crystal relic Gu (紫晶舍利蛊): used once, it lifts a rank-five Gu Master one small stage at once. It costs 130 primeval stones and is spent. = Gu relik kristal ungu (紫晶舍利蛊): sekali pakai, mengangkat Gu Master rank lima satu tahap kecil seketika. Harganya 130 batu primordial dan habis terpakai.
The frenzy lightning wolf (狂电狼), a thousand-beast king of the wolf tide: above the bold wolf, below the thunder crown wolf. Some carry thunder wings and leap into the air. It leads every beast near it. = Serigala petir gila (狂电狼), raja seribu binatang dalam gelombang serigala: di atas serigala berani, di bawah serigala mahkota petir. Sebagian membawa sayap petir dan melompat ke udara. Ia memimpin setiap binatang di dekatnya.
The feathermen (羽民) of Yu Sheng City in the Western Desert, a variant human kind born to fly. They keep a royal line and do not go to war lightly, though they have immortals of their own. Friends see farther; allies' soldiers move faster over the desert. = Manusia bulu (羽民) dari Kota Yu Sheng di Gurun Barat, kaum manusia varian yang lahir untuk terbang. Mereka punya garis raja dan tak mudah berperang, meski punya Gu Abadi sendiri. Sahabatnya melihat lebih jauh; prajurit sekutunya bergerak lebih cepat di gurun.
The snowmen (雪人) of the Great Snow Mountain on the Northern Plains: six tribes who hardly laugh or cry, raised as an immortal's elite warbands. Friends and allies hold their ground better; allies receive warriors. = Manusia salju (雪人) dari Gunung Salju Besar di Dataran Utara: enam suku yang nyaris tak pernah tertawa atau menangis, dibesarkan sebagai pasukan elit seorang Gu Abadi. Sahabat dan sekutunya lebih kokoh bertahan; sekutunya menerima prajurit.
The inkmen (墨人) of Ink Man City, a variant human kind of the Northern Plains whose king rules them under the long pressure of the golden tribes. Friends and allies gain culture; allies, contentment too. = Manusia tinta (墨人) dari Kota Manusia Tinta, kaum manusia varian Dataran Utara yang rajanya memerintah di bawah tekanan panjang suku-suku emas. Sahabat dan sekutunya mendapat budaya; sekutunya juga kebahagiaan.
The rockmen (石人) live deep underground and eat ore, finding Gu as they dig; a tribe of them dwells south of the Hu Immortal blessed land. Friends and allies gain production; allies' mines yield more. = Manusia batu (石人) hidup jauh di bawah tanah dan memakan bijih, menemukan Gu sambil menggali; satu suku mereka tinggal di selatan tanah berkah Hu Immortal. Sahabat dan sekutunya mendapat produksi; tambang sekutunya menghasilkan lebih banyak.

# Paths: tiers, killer moves, statuses (data/paths*.csv, tools/gen_paths.py)
Every other path this unit holds costs Strength: dao marks interfere = Setiap jalur lain yang dipegang unit ini memotong Kekuatan: jejak dao saling mengganggu
Strength Master = Ahli Jalur Kekuatan
Strength path (力道), Master attainment (大师): a tempered body keeps its force while hurt. +20% strength. Signature: no penalty for wounds. Hit: each attack inflicts Guard Broken for 2 turns (dao marks I-V: 2/2/3/3/4). Its Gu is its vital Gu (本命蛊): if the Gu starves to death, the Master takes 30 damage (none at 30 HP or less). = Jalur Kekuatan (力道), pencapaian Ahli (大师): tubuh yang ditempa tetap bertenaga saat terluka. +20% kekuatan. Ciri khas: tanpa penalti saat terluka. Serangan: tiap serangan menimbulkan Pertahanan Jebol selama 2 giliran (jejak dao I-V: 2/2/3/3/4). Gu-nya adalah Gu vitalnya (本命蛊): bila Gu itu mati kelaparan, sang Ahli menerima 30 kerusakan (tidak ada bila HP-nya 30 atau kurang).
Strength Grandmaster = Mahaguru Jalur Kekuatan
Strength path, Grandmaster attainment (宗师): deep enough to bend other paths' methods to its own Gu. Opens the killer move Self-Reliance (AI clans use it by themselves when they attack). +25% strength; unlocks: each attack takes 1 movement from the target. = Jalur Kekuatan, pencapaian Mahaguru (宗师): cukup dalam untuk meminjam cara jalur lain dengan Gu sendiri. Membuka jurus pamungkas Berdiri Sendiri (klan AI memakainya sendiri saat menyerang). +25% kekuatan; membuka: tiap serangan merampas 1 gerak sasaran.
Strength Great Grandmaster = Mahaguru Agung Jalur Kekuatan
Strength path, Great Grandmaster attainment (大宗师): where most rank-eight immortals end; a rank-six immortal that reaches it opens the immortal killer move Myriad Self, paid in its own rank's essence (5 green grape at rank six, 4 red date at seven, 3 white lychee at eight, 2 yellow apricot as a Venerable; AI clans use it by themselves when they attack). +30% strength; adds: domain: enemies beside it fight 10% weaker. = Jalur Kekuatan, pencapaian Mahaguru Agung (大宗师): tempat kebanyakan abadi tingkat delapan berhenti; abadi tingkat enam yang mencapainya membuka jurus pamungkas abadi Sepuluh Ribu Diri, dibayar dengan esensi tingkatnya sendiri (5 anggur hijau di tingkat enam, 4 kurma merah di tujuh, 3 leci putih di delapan, 2 aprikot kuning untuk Yang Mulia; klan AI memakainya sendiri saat menyerang). +30% kekuatan; menambah: domain: musuh di sampingnya bertarung 10% lebih lemah.
Strength Supreme Grandmaster = Mahaguru Tertinggi Jalur Kekuatan
